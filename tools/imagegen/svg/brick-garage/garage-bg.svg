<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1688" fill="none">
  <!-- brick toy garage interior - soft bg, empty foreground for UI -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6E5"/>
      <stop offset="55%" stop-color="#FFE8C8"/>
      <stop offset="100%" stop-color="#F5D5A8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F4FF"/>
      <stop offset="100%" stop-color="#C8E4F8"/>
    </linearGradient>
  </defs>
  <rect width="780" height="1688" fill="url(#wall)"/>
  <!-- soft daylight window glow top -->
  <ellipse cx="390" cy="120" rx="280" ry="90" fill="#FFF6E5" opacity="0.7"/>
  <rect x="180" y="40" width="420" height="160" rx="28" fill="#7CC6FE" opacity="0.35"/>
  <rect x="210" y="60" width="160" height="110" rx="16" fill="#FFFFFF" opacity="0.45"/>
  <rect x="410" y="60" width="160" height="110" rx="16" fill="#FFFFFF" opacity="0.35"/>
  <!-- left shelf unit -->
  <rect x="28" y="280" width="150" height="520" rx="24" fill="#B07A4F" opacity="0.85"/>
  <rect x="44" y="310" width="118" height="18" rx="6" fill="#FFF6E5" opacity="0.35"/>
  <rect x="44" y="390" width="118" height="18" rx="6" fill="#FFF6E5" opacity="0.35"/>
  <rect x="44" y="470" width="118" height="18" rx="6" fill="#FFF6E5" opacity="0.35"/>
  <rect x="44" y="550" width="118" height="18" rx="6" fill="#FFF6E5" opacity="0.35"/>
  <rect x="44" y="630" width="118" height="18" rx="6" fill="#FFF6E5" opacity="0.35"/>
  <rect x="44" y="710" width="118" height="18" rx="6" fill="#FFF6E5" opacity="0.35"/>
  <!-- cute mini parked silhouettes on left shelf -->
  <rect x="58" y="340" width="70" height="28" rx="10" fill="#FF6B81" opacity="0.7"/>
  <rect x="58" y="500" width="70" height="28" rx="10" fill="#7CC6FE" opacity="0.7"/>
  <rect x="58" y="660" width="70" height="28" rx="10" fill="#FFC94A" opacity="0.7"/>
  <!-- right shelf -->
  <rect x="602" y="280" width="150" height="520" rx="24" fill="#B07A4F" opacity="0.85"/>
  <rect x="618" y="310" width="118" height="18" rx="6" fill="#FFF6E5" opacity="0.35"/>
  <rect x="618" y="390" width="118" height="18" rx="6" fill="#FFF6E5" opacity="0.35"/>
  <rect x="618" y="470" width="118" height="18" rx="6" fill="#FFF6E5" opacity="0.35"/>
  <rect x="618" y="550" width="118" height="18" rx="6" fill="#FFF6E5" opacity="0.35"/>
  <rect x="618" y="630" width="118" height="18" rx="6" fill="#FFF6E5" opacity="0.35"/>
  <rect x="618" y="710" width="118" height="18" rx="6" fill="#FFF6E5" opacity="0.35"/>
  <rect x="632" y="340" width="70" height="28" rx="10" fill="#A78BFA" opacity="0.7"/>
  <rect x="632" y="500" width="70" height="28" rx="10" fill="#7BD389" opacity="0.7"/>
  <rect x="632" y="660" width="70" height="28" rx="10" fill="#FF9F45" opacity="0.7"/>
  <!-- ceiling lights -->
  <ellipse cx="260" cy="220" rx="50" ry="14" fill="#FFC94A" opacity="0.45"/>
  <ellipse cx="520" cy="220" rx="50" ry="14" fill="#FFC94A" opacity="0.45"/>
  <!-- open center play area (kept mostly empty) -->
  <rect x="0" y="900" width="780" height="788" fill="url(#floor)"/>
  <!-- soft floor tiles hint -->
  <rect x="80" y="980" width="620" height="8" rx="4" fill="#FFFFFF" opacity="0.35"/>
  <rect x="80" y="1120" width="620" height="8" rx="4" fill="#FFFFFF" opacity="0.28"/>
  <rect x="80" y="1260" width="620" height="8" rx="4" fill="#FFFFFF" opacity="0.22"/>
  <rect x="80" y="1400" width="620" height="8" rx="4" fill="#FFFFFF" opacity="0.18"/>
  <!-- garage door arch suggestion at mid -->
  <path d="M160 900 Q390 780 620 900" fill="#FFFFFF" opacity="0.2"/>
  <rect x="200" y="860" width="380" height="40" rx="16" fill="#B07A4F" opacity="0.25"/>
</svg>
