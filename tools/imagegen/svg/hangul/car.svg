<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- ground contact -->
  <ellipse cx="64" cy="112" rx="40" ry="8" fill="#3D2B1F" opacity="0.12"/>
  <!-- body -->
  <rect x="14" y="58" width="100" height="40" rx="18" fill="#FF6B81" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- cabin -->
  <path d="M36 58 C40 34 56 28 72 28 C92 28 104 40 108 58 Z" fill="#7CC6FE" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- cabin glass tint -->
  <ellipse cx="72" cy="44" rx="22" ry="12" fill="#FFF6E5" opacity="0.55"/>
  <!-- body highlight -->
  <ellipse cx="40" cy="68" rx="18" ry="8" fill="#FFF6E5" opacity="0.55"/>
  <!-- bumper -->
  <rect x="96" y="72" width="16" height="14" rx="6" fill="#FF9F45" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- wheels -->
  <circle cx="38" cy="98" r="14" fill="#3D2B1F" stroke="#3D2B1F" stroke-width="5"/>
  <circle cx="90" cy="98" r="14" fill="#3D2B1F" stroke="#3D2B1F" stroke-width="5"/>
  <circle cx="38" cy="98" r="6" fill="#FFF6E5"/>
  <circle cx="90" cy="98" r="6" fill="#FFF6E5"/>
  <!-- headlight eyes (facing right) -->
  <circle cx="104" cy="70" r="9" fill="#FFC94A" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="106" cy="70" rx="3.2" ry="4" fill="#3D2B1F"/>
  <circle cx="107" cy="68.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="92" cy="70" r="8" fill="#FFC94A" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="94" cy="70" rx="2.8" ry="3.5" fill="#3D2B1F"/>
  <circle cx="95" cy="68.5" r="1.1" fill="#FFFFFF"/>
  <!-- blush -->
  <ellipse cx="84" cy="78" rx="5" ry="3" fill="#FFB3C1" opacity="0.5"/>
  <!-- smile -->
  <path d="M96 78 Q102 84 108 78" stroke="#3D2B1F" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- roof light -->
  <ellipse cx="72" cy="26" rx="8" ry="6" fill="#FFC94A" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="69" cy="24" rx="3" ry="2" fill="#FFF6E5" opacity="0.6"/>
</svg>
