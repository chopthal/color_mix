<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- soft ground -->
  <ellipse cx="64" cy="112" rx="36" ry="7" fill="#3D2B1F" opacity="0.12"/>
  <!-- outer seal ring -->
  <circle cx="64" cy="64" r="48" fill="#FF9F45" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round"/>
  <!-- inner cream disk -->
  <circle cx="64" cy="64" r="36" fill="#FFF6E5" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round"/>
  <!-- highlight -->
  <ellipse cx="50" cy="48" rx="16" ry="10" fill="#FFFFFF" opacity="0.55"/>
  <!-- soft star seal (rounded points) -->
  <path d="M64 34
           C67 46 74 52 86 54
           C74 57 68 64 66 76
           C64 64 57 57 46 54
           C57 52 61 46 64 34 Z"
        fill="#FF6B81" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- star highlight -->
  <ellipse cx="58" cy="48" rx="7" ry="4" fill="#FFF6E5" opacity="0.6"/>
  <!-- tiny sparkles -->
  <circle cx="40" cy="78" r="4" fill="#FFC94A" stroke="#3D2B1F" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="88" cy="78" r="4" fill="#FFC94A" stroke="#3D2B1F" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="64" cy="90" r="3.5" fill="#FFB3C1" stroke="#3D2B1F" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
