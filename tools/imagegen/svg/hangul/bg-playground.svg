<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 512" width="768" height="512" fill="none">
  <defs>
    <linearGradient id="playSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D6ECFF"/>
      <stop offset="48%" stop-color="#EAF6FF"/>
      <stop offset="100%" stop-color="#E4F5D8"/>
    </linearGradient>
    <linearGradient id="playGrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8E9B0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A8D98A" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="768" height="512" fill="url(#playSky)"/>
  <!-- soft ground band, lower third only -->
  <ellipse cx="384" cy="460" rx="420" ry="90" fill="url(#playGrass)"/>
  <!-- left tree (edge) -->
  <ellipse cx="90" cy="300" rx="48" ry="56" fill="#7BD389" opacity="0.38"/>
  <ellipse cx="70" cy="270" rx="34" ry="36" fill="#3FA34D" opacity="0.28"/>
  <ellipse cx="118" cy="278" rx="30" ry="32" fill="#6EE7B7" opacity="0.3"/>
  <rect x="82" y="340" width="16" height="50" rx="6" fill="#B07A4F" opacity="0.28"/>
  <!-- right balloon cluster (edge) -->
  <circle cx="680" cy="120" r="22" fill="#FF6B81" opacity="0.28"/>
  <circle cx="710" cy="140" r="18" fill="#A78BFA" opacity="0.26"/>
  <circle cx="660" cy="150" r="16" fill="#FFC94A" opacity="0.26"/>
  <path d="M680 142 Q678 200 676 250" stroke="#3D2B1F" stroke-width="3" opacity="0.12" stroke-linecap="round" fill="none"/>
  <path d="M710 158 Q708 210 706 255" stroke="#3D2B1F" stroke-width="3" opacity="0.1" stroke-linecap="round" fill="none"/>
  <!-- soft clouds top -->
  <ellipse cx="220" cy="80" rx="50" ry="22" fill="#FFFFFF" opacity="0.45"/>
  <ellipse cx="250" cy="72" rx="28" ry="18" fill="#FFFFFF" opacity="0.4"/>
  <ellipse cx="480" cy="60" rx="42" ry="18" fill="#FFFFFF" opacity="0.35"/>
  <!-- tiny sun -->
  <circle cx="600" cy="70" r="28" fill="#FFC94A" opacity="0.28"/>
  <!-- calm open center for roads -->
</svg>
