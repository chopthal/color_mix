<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 224" fill="none">
  <!-- ground contact -->
  <ellipse cx="96" cy="208" rx="42" ry="10" fill="#3D2B1F" opacity="0.12"/>
  <!-- air tank -->
  <rect x="128" y="96" width="28" height="52" rx="12" fill="#3BA4E6" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="142" cy="108" rx="8" ry="5" fill="#FFF6E5" opacity="0.55"/>
  <!-- hose -->
  <path d="M128 108 C110 96, 100 88, 96 78" stroke="#3D2B1F" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M128 108 C110 96, 100 88, 96 78" stroke="#7CC6FE" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- legs -->
  <rect x="62" y="156" width="26" height="36" rx="12" fill="#3BA4E6" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <rect x="104" y="156" width="26" height="36" rx="12" fill="#3BA4E6" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <ellipse cx="75" cy="162" rx="7" ry="5" fill="#FFF6E5" opacity="0.5"/>
  <ellipse cx="117" cy="162" rx="7" ry="5" fill="#FFF6E5" opacity="0.5"/>
  <!-- body / wetsuit -->
  <rect x="58" y="92" width="76" height="72" rx="28" fill="#6EE7B7" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <ellipse cx="78" cy="108" rx="16" ry="12" fill="#FFF6E5" opacity="0.55"/>
  <!-- arms -->
  <rect x="28" y="108" width="34" height="26" rx="12" fill="#6EE7B7" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <rect x="130" y="108" width="34" height="26" rx="12" fill="#6EE7B7" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <!-- head / face -->
  <circle cx="96" cy="62" r="36" fill="#FFF6E5" stroke="#3D2B1F" stroke-width="8"/>
  <!-- helmet dome -->
  <path d="M60 58 C60 30, 132 30, 132 58 C132 78, 118 90, 96 90 C74 90, 60 78, 60 58 Z" fill="#7CC6FE" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round" opacity="0.9"/>
  <ellipse cx="96" cy="58" rx="24" ry="18" fill="#FFF6E5" opacity="0.55"/>
  <ellipse cx="82" cy="48" rx="10" ry="7" fill="#FFF6E5" opacity="0.55"/>
  <!-- eyes (lower half of face) -->
  <ellipse cx="82" cy="66" rx="5" ry="6" fill="#3D2B1F"/>
  <ellipse cx="110" cy="66" rx="5" ry="6" fill="#3D2B1F"/>
  <circle cx="84" cy="64" r="1.8" fill="#FFFFFF"/>
  <circle cx="112" cy="64" r="1.8" fill="#FFFFFF"/>
  <!-- blush -->
  <circle cx="72" cy="74" r="6" fill="#FFB3C1" opacity="0.5"/>
  <circle cx="120" cy="74" r="6" fill="#FFB3C1" opacity="0.5"/>
  <!-- smile -->
  <path d="M86 78 Q96 86 106 78" stroke="#3D2B1F" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
