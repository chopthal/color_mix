  <!-- wheels -->
  <ellipse cx="58" cy="148" rx="22" ry="18" fill="#3D2B1F" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <ellipse cx="58" cy="148" rx="10" ry="8" fill="#B07A4F"/>
  <ellipse cx="118" cy="148" rx="22" ry="18" fill="#3D2B1F" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <ellipse cx="118" cy="148" rx="10" ry="8" fill="#B07A4F"/>
  <!-- tank body pumpkin -->
  <ellipse cx="88" cy="100" rx="60" ry="56" fill="#FF9F45" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <path d="M88 48 Q74 100 88 150" stroke="#E07A30" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M66 56 Q56 100 66 144" stroke="#E07A30" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M110 56 Q120 100 110 144" stroke="#E07A30" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
  <ellipse cx="68" cy="78" rx="20" ry="13" fill="#FFF6E5" opacity="0.55"/>
  <!-- stem -->
  <rect x="80" y="36" width="16" height="20" rx="7" fill="#7BD389" stroke="#3D2B1F" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="96" cy="40" rx="14" ry="8" fill="#3FA34D" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round"/>
  <!-- spray nozzle arm (front-right) -->
  <rect x="136" y="86" width="36" height="16" rx="8" fill="#7CC6FE" stroke="#3D2B1F" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="172" cy="94" rx="14" ry="14" fill="#3BA4E6" stroke="#3D2B1F" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="168" cy="88" rx="5" ry="4" fill="#FFF6E5" opacity="0.55"/>
  <!-- soft splash drops -->
  <circle cx="178" cy="72" r="6" fill="#7CC6FE" stroke="#3D2B1F" stroke-width="4"/>
  <circle cx="166" cy="64" r="4.5" fill="#7CC6FE" stroke="#3D2B1F" stroke-width="3.5"/>
  <circle cx="184" cy="88" r="4" fill="#B8E4FF" stroke="#3D2B1F" stroke-width="3"/>
  <!-- face -->
  <ellipse cx="74" cy="108" rx="7" ry="9" fill="#3D2B1F"/>
  <ellipse cx="106" cy="108" rx="7" ry="9" fill="#3D2B1F"/>
  <circle cx="76" cy="105" r="2.4" fill="#FFFFFF"/>
  <circle cx="108" cy="105" r="2.4" fill="#FFFFFF"/>
  <circle cx="62" cy="120" r="8" fill="#FFB3C1" opacity="0.5"/>
  <circle cx="118" cy="120" r="8" fill="#FFB3C1" opacity="0.5"/>
  <path d="M78 128 Q90 140 102 128" stroke="#3D2B1F" stroke-width="5" stroke-linecap="round" fill="none"/>
