<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!-- cute candy ribbon bow -->
  <ellipse cx="48" cy="88" rx="22" ry="5" fill="#3D2B1F" opacity="0.12"/>
  <!-- left loop -->
  <ellipse cx="28" cy="44" rx="20" ry="16" fill="#FF6B81" stroke="#3D2B1F" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="24" cy="38" rx="8" ry="5" fill="#FFF6E5" opacity="0.5"/>
  <!-- right loop -->
  <ellipse cx="68" cy="44" rx="20" ry="16" fill="#FF6B81" stroke="#3D2B1F" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="62" cy="38" rx="8" ry="5" fill="#FFF6E5" opacity="0.5"/>
  <!-- center knot -->
  <ellipse cx="48" cy="46" rx="10" ry="12" fill="#FFB3C1" stroke="#3D2B1F" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="44" cy="42" rx="4" ry="3" fill="#FFF6E5" opacity="0.55"/>
  <!-- tails -->
  <path d="M40 54 L28 78 L40 70 Z" fill="#FF6B81" stroke="#3D2B1F" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M56 54 L68 78 L56 70 Z" fill="#FF6B81" stroke="#3D2B1F" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
