<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- cute witch hat magic portal -->
  <ellipse cx="80" cy="148" rx="48" ry="8" fill="#3D2B1F" opacity="0.12"/>
  <!-- soft sparkles -->
  <circle cx="28" cy="48" r="5" fill="#FFC94A" stroke="#3D2B1F" stroke-width="3"/>
  <circle cx="134" cy="56" r="4.5" fill="#A78BFA" stroke="#3D2B1F" stroke-width="3"/>
  <circle cx="40" cy="110" r="4" fill="#FF6B81" stroke="#3D2B1F" stroke-width="2.5"/>
  <circle cx="128" cy="108" r="5" fill="#FFC94A" stroke="#3D2B1F" stroke-width="3"/>
  <!-- brim -->
  <ellipse cx="80" cy="118" rx="64" ry="22" fill="#2E3A6B" stroke="#3D2B1F" stroke-width="6.5" stroke-linejoin="round"/>
  <ellipse cx="80" cy="114" rx="52" ry="12" fill="#A78BFA" opacity="0.35"/>
  <!-- cone -->
  <path d="M80 18 C92 18 108 70 118 112 L42 112 C52 70 68 18 80 18 Z"
        fill="#2E3A6B" stroke="#3D2B1F" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="72" cy="56" rx="12" ry="22" fill="#FFF6E5" opacity="0.35" transform="rotate(-8 72 56)"/>
  <!-- band -->
  <rect x="48" y="96" width="64" height="16" rx="8" fill="#A78BFA" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="60" cy="100" rx="10" ry="4" fill="#FFF6E5" opacity="0.45"/>
  <!-- buckle star -->
  <path d="M80 90 L84 98 L92 99 L86 105 L88 113 L80 108 L72 113 L74 105 L68 99 L76 98 Z"
        fill="#FFC94A" stroke="#3D2B1F" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- friendly face on cone -->
  <ellipse cx="70" cy="70" rx="5" ry="6.5" fill="#3D2B1F"/>
  <ellipse cx="92" cy="70" rx="5" ry="6.5" fill="#3D2B1F"/>
  <circle cx="71.5" cy="68" r="1.6" fill="#FFFFFF"/>
  <circle cx="93.5" cy="68" r="1.6" fill="#FFFFFF"/>
  <circle cx="60" cy="80" r="6" fill="#FFB3C1" opacity="0.5"/>
  <circle cx="102" cy="80" r="6" fill="#FFB3C1" opacity="0.5"/>
  <path d="M72 84 Q80 92 88 84" stroke="#3D2B1F" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
