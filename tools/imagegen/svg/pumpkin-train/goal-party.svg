<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- cute carnival party tent -->
  <ellipse cx="80" cy="148" rx="50" ry="8" fill="#3D2B1F" opacity="0.12"/>
  <!-- tent body -->
  <path d="M28 128 L28 78 L80 28 L132 78 L132 128 Z"
        fill="#FF6B81" stroke="#3D2B1F" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- stripes -->
  <path d="M48 78 L80 34 L80 128 L48 128 Z" fill="#FFF6E5" opacity="0.85"/>
  <path d="M112 78 L80 34 L80 128 L112 128 Z" fill="#FFF6E5" opacity="0.85"/>
  <path d="M28 128 L28 78 L80 28 L132 78 L132 128 Z"
        fill="none" stroke="#3D2B1F" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- door -->
  <path d="M62 128 L62 96 Q80 84 98 96 L98 128 Z"
        fill="#2E3A6B" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="72" cy="70" rx="10" ry="16" fill="#FFF6E5" opacity="0.4"/>
  <!-- flag pole -->
  <rect x="76" y="10" width="8" height="22" rx="4" fill="#B07A4F" stroke="#3D2B1F" stroke-width="4" stroke-linejoin="round"/>
  <path d="M84 14 L112 22 L84 30 Z" fill="#FFC94A" stroke="#3D2B1F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- soft balloons -->
  <circle cx="30" cy="52" r="12" fill="#7CC6FE" stroke="#3D2B1F" stroke-width="4.5"/>
  <ellipse cx="26" cy="46" rx="4" ry="3" fill="#FFF6E5" opacity="0.55"/>
  <path d="M30 64 Q30 72 34 78" stroke="#3D2B1F" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="130" cy="56" r="11" fill="#A78BFA" stroke="#3D2B1F" stroke-width="4.5"/>
  <ellipse cx="126" cy="50" rx="4" ry="3" fill="#FFF6E5" opacity="0.55"/>
  <path d="M130 67 Q130 74 126 80" stroke="#3D2B1F" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- tiny face above door -->
  <ellipse cx="70" cy="72" rx="3.5" ry="4.5" fill="#3D2B1F"/>
  <ellipse cx="90" cy="72" rx="3.5" ry="4.5" fill="#3D2B1F"/>
  <circle cx="71.2" cy="70.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="91.2" cy="70.5" r="1.2" fill="#FFFFFF"/>
  <path d="M74 82 Q80 88 86 82" stroke="#3D2B1F" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
