<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 320" fill="none">
  <!-- Empty ceramic flower pot / wide vase - Style A -->
  <ellipse cx="256" cy="292" rx="130" ry="12" fill="#3D2B1F" opacity="0.12"/>
  <!-- Pot body -->
  <path d="M130 120
           C130 120 148 250 256 250
           C364 250 382 120 382 120
           L360 100
           L152 100
           Z"
        fill="#FFB3C1" stroke="#3D2B1F" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Inner empty cavity -->
  <ellipse cx="256" cy="112" rx="118" ry="36"
           fill="#FFF6E5" stroke="#3D2B1F" stroke-width="13" stroke-linejoin="round"/>
  <!-- Ceramic rim lip -->
  <path d="M148 108 C180 88 332 88 364 108"
        fill="none" stroke="#FF6B81" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  <!-- Soft band decoration -->
  <path d="M160 170 C200 188 312 188 352 170"
        fill="none" stroke="#FF6B81" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <!-- Highlight -->
  <ellipse cx="198" cy="150" rx="28" ry="40" fill="#FFF6E5" opacity="0.5"/>
  <!-- Tiny flower bud on rim (empty inside) -->
  <circle cx="370" cy="96" r="14" fill="#A78BFA" stroke="#3D2B1F" stroke-width="5"/>
  <circle cx="370" cy="96" r="6" fill="#FFC94A" stroke="#3D2B1F" stroke-width="3"/>
  <ellipse cx="364" cy="90" rx="5" ry="3" fill="#FFF6E5" opacity="0.55"/>
</svg>
