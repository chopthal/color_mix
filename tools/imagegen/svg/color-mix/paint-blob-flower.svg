<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <!-- Five round petals blossom - white fill for multiply tint -->
  <g stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="96" cy="48" r="28" fill="#FFFFFF"/>
    <circle cx="140" cy="78" r="28" fill="#FFFFFF"/>
    <circle cx="124" cy="130" r="28" fill="#FFFFFF"/>
    <circle cx="68" cy="130" r="28" fill="#FFFFFF"/>
    <circle cx="52" cy="78" r="28" fill="#FFFFFF"/>
  </g>
  <!-- Center disc -->
  <circle cx="96" cy="96" r="26" fill="#F0F0F0" stroke="#3D2B1F" stroke-width="8"/>
  <!-- Soft highlight on top petal -->
  <ellipse cx="88" cy="38" rx="10" ry="8" fill="#E8E8E8" opacity="0.65"/>
  <!-- Tiny center sparkle (neutral) -->
  <circle cx="96" cy="96" r="10" fill="#FFFFFF" stroke="#3D2B1F" stroke-width="4"/>
</svg>
