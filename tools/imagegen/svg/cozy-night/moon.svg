<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <mask id="crescentMask">
      <rect width="192" height="192" fill="black"/>
      <circle cx="100" cy="96" r="62" fill="white"/>
      <circle cx="128" cy="86" r="48" fill="black"/>
    </mask>
  </defs>
  <!-- soft glow -->
  <circle cx="96" cy="96" r="78" fill="#FFC94A" opacity="0.2"/>
  <!-- crescent body (transparent cutout) -->
  <circle cx="100" cy="96" r="62" fill="#FFC94A" mask="url(#crescentMask)"/>
  <circle cx="100" cy="96" r="62" fill="none" stroke="#3D2B1F" stroke-width="8" mask="url(#crescentMask)"/>
  <!-- face on thick part of crescent -->
  <path d="M68 108 Q78 118 90 108" fill="none" stroke="#3D2B1F" stroke-width="5" stroke-linecap="round"/>
  <path d="M62 90 Q72 82 82 90" fill="none" stroke="#3D2B1F" stroke-width="5" stroke-linecap="round"/>
  <circle cx="66" cy="108" r="8" fill="#FFB3C1" opacity="0.55"/>
  <ellipse cx="72" cy="70" rx="12" ry="18" fill="#FFF6E5" opacity="0.55"/>
  <circle cx="44" cy="52" r="4" fill="#FFF6E5" opacity="0.7"/>
  <circle cx="148" cy="140" r="3" fill="#FFF6E5" opacity="0.5"/>
</svg>
