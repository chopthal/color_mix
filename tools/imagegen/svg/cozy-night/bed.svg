  <rect x="436" y="24" width="36" height="208" rx="16" ry="16" fill="#8F5E3A" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <ellipse cx="58" cy="48" rx="10" ry="14" fill="#FFF6E5" opacity="0.4"/>
  <ellipse cx="454" cy="48" rx="10" ry="14" fill="#FFF6E5" opacity="0.4"/>
