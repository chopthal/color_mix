<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1688" width="780" height="1688">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF2EC"/>
      <stop offset="45%" stop-color="#FFF6E5"/>
      <stop offset="100%" stop-color="#FFE8F0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0D0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFD0C0" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="780" height="1688" fill="url(#wall)"/>
  <!-- soft peach bands -->
  <rect y="0" width="780" height="220" fill="#FFB3C1" opacity="0.12"/>
  <rect y="1460" width="780" height="228" fill="url(#floor)"/>
  <!-- gentle polka dots (edges only - center play space empty) -->
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="70" cy="120" r="10"/>
    <circle cx="160" cy="260" r="7"/>
    <circle cx="40" cy="400" r="8"/>
    <circle cx="120" cy="560" r="6"/>
    <circle cx="55" cy="740" r="9"/>
    <circle cx="140" cy="920" r="7"/>
    <circle cx="60" cy="1100" r="8"/>
    <circle cx="130" cy="1280" r="6"/>
    <circle cx="45" cy="1480" r="10"/>
    <circle cx="710" cy="140" r="9"/>
    <circle cx="640" cy="280" r="7"/>
    <circle cx="740" cy="420" r="8"/>
    <circle cx="660" cy="580" r="6"/>
    <circle cx="725" cy="760" r="9"/>
    <circle cx="650" cy="940" r="7"/>
    <circle cx="735" cy="1120" r="8"/>
    <circle cx="670" cy="1300" r="6"/>
    <circle cx="720" cy="1500" r="10"/>
  </g>
  <g fill="#FFB3C1" opacity="0.28">
    <circle cx="90" cy="180" r="5"/>
