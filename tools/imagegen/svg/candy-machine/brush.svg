<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 256" width="128" height="256" fill="none">
  <!-- oversized pink kids toothbrush, upright -->
  <!-- handle -->
  <rect x="44" y="96" width="40" height="140" rx="20" fill="#FF6B81" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="44" y="96" width="40" height="140" rx="20" fill="#FF8FC4" opacity="0.45"/>
  <ellipse cx="56" cy="150" rx="8" ry="28" fill="#FFF6E5" opacity="0.55"/>
  <!-- grip bumps -->
  <ellipse cx="64" cy="170" rx="14" ry="8" fill="#FFB3C1" stroke="#3D2B1F" stroke-width="4"/>
  <ellipse cx="64" cy="196" rx="14" ry="8" fill="#FFB3C1" stroke="#3D2B1F" stroke-width="4"/>
  <!-- head -->
  <rect x="34" y="28" width="60" height="78" rx="22" fill="#FFFFFF" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="50" cy="48" rx="12" ry="10" fill="#FFF6E5" opacity="0.6"/>
  <!-- soft bristles -->
  <g fill="#7CC6FE" stroke="#3D2B1F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="42" y="40" width="8" height="48" rx="4"/>
    <rect x="54" y="36" width="8" height="52" rx="4"/>
    <rect x="66" y="40" width="8" height="48" rx="4"/>
    <rect x="78" y="38" width="8" height="50" rx="4"/>
  </g>
  <!-- cute face on head (friendly) -->
  <circle cx="52" cy="88" r="3" fill="#3D2B1F"/>
  <circle cx="76" cy="88" r="3" fill="#3D2B1F"/>
  <path d="M56 96 Q64 102 72 96" stroke="#3D2B1F" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
