  <circle cx="150" cy="105" r="2.4" fill="#FFFFFF"/>
  <circle cx="138" cy="124" r="7" fill="#FFB3C1" opacity="0.55"/>
  <path d="M156 122 Q164 128 170 120" stroke="#3D2B1F" stroke-width="5" stroke-linecap="round" fill="none"/>
