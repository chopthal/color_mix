  <path d="M96 108 Q128 18 148 108 Z" fill="#FF6B81" stroke="#3D2B1F" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M96 118 Q124 206 146 118 Z" fill="#FF6B81" stroke="#3D2B1F" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- tail left -->
  <path d="M58 112 L18 82 Q30 112 18 142 Z" fill="#FFB3C1" stroke="#3D2B1F" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- diamond body -->
  <path d="M70 112 L118 66 L168 112 L118 158 Z" fill="#FFB3C1" stroke="#3D2B1F" stroke-width="9" stroke-linejoin="round"/>
  <!-- soft stripes -->
