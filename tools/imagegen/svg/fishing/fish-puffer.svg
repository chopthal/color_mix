<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 192" fill="none">
  <!-- yellow round puffer, facing right -->
  <ellipse cx="128" cy="176" rx="42" ry="8" fill="#3D2B1F" opacity="0.12"/>
  <!-- soft spikes (rounded) -->
  <circle cx="78" cy="48" r="9" fill="#FFC94A" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="118" cy="36" r="9" fill="#FFC94A" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="158" cy="42" r="9" fill="#FFC94A" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="70" cy="128" r="8" fill="#FFC94A" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="150" cy="136" r="8" fill="#FFC94A" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <!-- tail left -->
  <path d="M52 96 L18 68 Q28 96 18 124 Z" fill="#FFC94A" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- body -->
  <circle cx="140" cy="96" r="62" fill="#FFC94A" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <!-- belly -->
  <ellipse cx="148" cy="118" rx="36" ry="24" fill="#FFF6E5" opacity="0.85"/>
  <ellipse cx="118" cy="72" rx="18" ry="12" fill="#FFF6E5" opacity="0.55"/>
  <!-- fins -->
  <ellipse cx="118" cy="148" rx="18" ry="10" fill="#FF9F45" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <ellipse cx="168" cy="70" rx="14" ry="9" fill="#FF9F45" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <!-- face (lower) -->
  <ellipse cx="168" cy="92" rx="8" ry="10" fill="#3D2B1F"/>
  <circle cx="170" cy="89" r="2.6" fill="#FFFFFF"/>
  <circle cx="156" cy="108" r="8" fill="#FFB3C1" opacity="0.5"/>
  <path d="M178 108 Q188 114 196 106" stroke="#3D2B1F" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- tiny mouth puff -->
  <ellipse cx="196" cy="100" rx="10" ry="8" fill="#FF9F45" stroke="#3D2B1F" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="192" cy="96" rx="4" ry="3" fill="#FFF6E5" opacity="0.55"/>
</svg>
