  <circle cx="91" cy="100" r="3.2" fill="#FFFFFF"/>
  <circle cx="139" cy="100" r="3.2" fill="#FFFFFF"/>
  <!-- blush -->
  <circle cx="70" cy="122" r="10" fill="#FFB3C1" opacity="0.5"/>
  <circle cx="154" cy="122" r="10" fill="#FFB3C1" opacity="0.5"/>
