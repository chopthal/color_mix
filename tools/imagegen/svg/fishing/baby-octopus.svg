  <!-- tentacles -->
  <path d="M58 128 Q42 176 58 196 Q72 188 70 140" fill="#A78BFA" stroke="#3D2B1F" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M86 140 Q80 188 96 204 Q110 192 104 142" fill="#A78BFA" stroke="#3D2B1F" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M120 142 Q126 196 140 204 Q154 188 148 140" fill="#A78BFA" stroke="#3D2B1F" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M154 128 Q174 176 166 196 Q152 188 154 140" fill="#A78BFA" stroke="#3D2B1F" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- head -->
  <ellipse cx="112" cy="100" rx="64" ry="60" fill="#A78BFA" stroke="#3D2B1F" stroke-width="9" stroke-linejoin="round"/>
  <ellipse cx="92" cy="78" rx="18" ry="12" fill="#FFF6E5" opacity="0.55"/>
  <!-- eyes lower -->
