<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <!-- round fishing net with wooden handle -->
  <ellipse cx="96" cy="178" rx="36" ry="7" fill="#3D2B1F" opacity="0.12"/>
  <!-- handle -->
  <path d="M118 118 L168 168" stroke="#B07A4F" stroke-width="18" stroke-linecap="round"/>
  <path d="M118 118 L168 168" stroke="#3D2B1F" stroke-width="8" stroke-linecap="round" fill="none" opacity="0"/>
  <line x1="118" y1="118" x2="168" y2="168" stroke="#3D2B1F" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="160" cy="160" rx="10" ry="8" fill="#FFF6E5" opacity="0.45"/>
  <!-- rim -->
  <circle cx="82" cy="82" r="54" fill="#FFF6E5" opacity="0.35" stroke="#3D2B1F" stroke-width="8"/>
  <!-- net mesh soft -->
  <circle cx="82" cy="82" r="40" fill="none" stroke="#FF9F45" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.85"/>
  <circle cx="82" cy="82" r="26" fill="none" stroke="#FF9F45" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round" opacity="0.7"/>
  <path d="M46 60 L118 104 M46 104 L118 60 M82 28 L82 136 M36 82 L128 82" stroke="#FFC94A" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <!-- rim wood accent -->
  <circle cx="82" cy="82" r="54" fill="none" stroke="#B07A4F" stroke-width="6" opacity="0.55"/>
  <ellipse cx="62" cy="58" rx="12" ry="8" fill="#FFF6E5" opacity="0.5"/>
</svg>
