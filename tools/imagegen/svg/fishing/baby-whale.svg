<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <!-- baby blue whale side view, facing right -->
  <ellipse cx="160" cy="186" rx="56" ry="9" fill="#3D2B1F" opacity="0.12"/>
  <!-- fluke left -->
  <path d="M56 100 Q12 60 10 40 Q36 88 56 100 Q36 112 10 160 Q12 140 56 100 Z" fill="#7CC6FE" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="180" cy="108" rx="110" ry="58" fill="#7CC6FE" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <!-- belly -->
  <path d="M100 120 Q180 158 260 118 Q180 138 100 120 Z" fill="#FFF6E5" opacity="0.75"/>
  <!-- fin -->
  <ellipse cx="160" cy="132" rx="28" ry="14" transform="rotate(18 160 132)" fill="#3BA4E6" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <!-- spout bump -->
  <ellipse cx="220" cy="56" rx="14" ry="8" fill="#3BA4E6" stroke="#3D2B1F" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="150" cy="84" rx="20" ry="12" fill="#FFF6E5" opacity="0.55"/>
  <!-- face -->
  <ellipse cx="250" cy="100" rx="8" ry="10" fill="#3D2B1F"/>
  <circle cx="252" cy="97" r="2.8" fill="#FFFFFF"/>
  <circle cx="238" cy="118" r="9" fill="#FFB3C1" opacity="0.5"/>
  <path d="M262 118 Q274 128 286 116" stroke="#3D2B1F" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
