<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1688" width="780" height="1688">
  <defs>
    <linearGradient id="mWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8E4FE"/>
      <stop offset="35%" stop-color="#7CC6FE"/>
      <stop offset="70%" stop-color="#3BA4E6"/>
      <stop offset="100%" stop-color="#2A7FB8"/>
