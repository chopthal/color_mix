  <path d="M40 1100 Q70 980 50 860 Q90 940 80 1100 Q60 1280 40 1480" fill="#3FA34D" opacity="0.35"/>
  <path d="M100 1200 Q130 1080 110 960 Q150 1060 140 1220 Q120 1400 100 1520" fill="#7BD389" opacity="0.3"/>
