  <path d="M0 1380 Q200 1320 390 1360 Q580 1400 780 1330 L780 1688 L0 1688 Z" fill="url(#mSand)"/>
  <ellipse cx="180" cy="1480" rx="40" ry="12" fill="#B07A4F" opacity="0.15"/>
  <ellipse cx="520" cy="1520" rx="50" ry="14" fill="#B07A4F" opacity="0.12"/>
