<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 160" fill="none">
  <!-- orange clownfish with white stripes, facing right -->
  <ellipse cx="128" cy="148" rx="40" ry="7" fill="#3D2B1F" opacity="0.12"/>
  <!-- tail left -->
  <path d="M54 80 L14 52 Q26 80 14 108 Z" fill="#FF9F45" stroke="#3D2B1F" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- dorsal -->
  <path d="M110 42 Q140 16 168 42 Z" fill="#FF9F45" stroke="#3D2B1F" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="148" cy="82" rx="72" ry="44" fill="#FF9F45" stroke="#3D2B1F" stroke-width="6" stroke-linejoin="round"/>
  <!-- white stripes -->
  <path d="M118 46 Q128 82 118 118 Q108 82 118 46 Z" fill="#FFFFFF" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round"/>
  <path d="M158 48 Q168 82 158 116 Q148 82 158 48 Z" fill="#FFFFFF" stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round"/>
  <!-- belly highlight -->
  <ellipse cx="160" cy="102" rx="28" ry="14" fill="#FFF6E5" opacity="0.45"/>
  <ellipse cx="126" cy="64" rx="14" ry="8" fill="#FFF6E5" opacity="0.55"/>
  <!-- fin -->
  <ellipse cx="148" cy="118" rx="16" ry="9" fill="#FF6B81" stroke="#3D2B1F" stroke-width="6" stroke-linejoin="round"/>
  <!-- face -->
  <ellipse cx="196" cy="76" rx="7" ry="9" fill="#3D2B1F"/>
  <circle cx="198" cy="73" r="2.4" fill="#FFFFFF"/>
  <circle cx="186" cy="92" r="7" fill="#FFB3C1" opacity="0.5"/>
  <path d="M206 90 Q214 96 220 90" stroke="#3D2B1F" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
