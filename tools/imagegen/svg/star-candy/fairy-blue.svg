<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- round blue fairy with gold crown, facing right -->
  <ellipse cx="128" cy="230" rx="46" ry="9" fill="#3D2B1F" opacity="0.12"/>
  <!-- wings -->
  <ellipse cx="62" cy="120" rx="34" ry="48" transform="rotate(-18 62 120)" fill="#FFFFFF" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round" opacity="0.92"/>
  <ellipse cx="194" cy="120" rx="34" ry="48" transform="rotate(18 194 120)" fill="#FFFFFF" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round" opacity="0.92"/>
  <ellipse cx="58" cy="108" rx="12" ry="18" transform="rotate(-18 58 108)" fill="#7CC6FE" opacity="0.45"/>
  <ellipse cx="198" cy="108" rx="12" ry="18" transform="rotate(18 198 108)" fill="#7CC6FE" opacity="0.45"/>
  <!-- feet -->
  <ellipse cx="104" cy="198" rx="18" ry="11" fill="#3BA4E6" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="152" cy="198" rx="18" ry="11" fill="#3BA4E6" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <!-- body -->
  <circle cx="128" cy="138" r="58" fill="#7CC6FE" stroke="#3D2B1F" stroke-width="10"/>
  <ellipse cx="128" cy="156" rx="34" ry="26" fill="#FFF6E5"/>
  <ellipse cx="112" cy="118" rx="16" ry="10" fill="#FFFFFF" opacity="0.55"/>
  <!-- arms -->
  <ellipse cx="72" cy="148" rx="16" ry="12" fill="#7CC6FE" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="184" cy="148" rx="16" ry="12" fill="#7CC6FE" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <!-- antenna stem -->
  <line x1="128" y1="82" x2="128" y2="54" stroke="#3BA4E6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="128" cy="48" r="9" fill="#FFC94A" stroke="#3D2B1F" stroke-width="8"/>
  <!-- crown -->
  <path d="M98 78 L108 48 L128 70 L148 48 L158 78 Z" fill="#FFC94A" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="108" cy="52" r="5" fill="#FF6B81"/>
  <circle cx="148" cy="52" r="5" fill="#FF6B81"/>
  <ellipse cx="118" cy="68" rx="8" ry="4" fill="#FFF6E5" opacity="0.55"/>
  <!-- face -->
  <ellipse cx="112" cy="130" rx="7" ry="9" fill="#3D2B1F"/>
  <ellipse cx="148" cy="130" rx="7" ry="9" fill="#3D2B1F"/>
  <circle cx="114" cy="127" r="2.4" fill="#FFFFFF"/>
  <circle cx="150" cy="127" r="2.4" fill="#FFFFFF"/>
  <circle cx="100" cy="144" r="9" fill="#FFB3C1" opacity="0.5"/>
  <circle cx="156" cy="144" r="9" fill="#FFB3C1" opacity="0.5"/>
  <path d="M116 154 Q128 164 140 154" stroke="#3D2B1F" stroke-width="6" stroke-linecap="round" fill="none"/>
