<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- soft blue candy-guard kid, facing right, star wand -->
  <ellipse cx="128" cy="232" rx="52" ry="10" fill="#3D2B1F" opacity="0.12"/>
  <!-- legs -->
  <rect x="96" y="168" width="28" height="42" rx="14" fill="#3BA4E6" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="132" y="168" width="28" height="42" rx="14" fill="#3BA4E6" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <ellipse cx="110" cy="210" rx="16" ry="9" fill="#2E3A6B" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="146" cy="210" rx="16" ry="9" fill="#2E3A6B" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <!-- body -->
  <rect x="86" y="118" width="84" height="62" rx="24" fill="#7CC6FE" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="128" cy="140" rx="18" ry="14" fill="#FFF6E5" opacity="0.65"/>
  <!-- star badge -->
  <path d="M128 132 L132 142 L143 143 L134 150 L137 161 L128 155 L119 161 L122 150 L113 143 L124 142 Z" fill="#FFC94A" stroke="#3D2B1F" stroke-width="6" stroke-linejoin="round"/>
  <!-- arms -->
  <ellipse cx="78" cy="140" rx="16" ry="13" fill="#FFD8B0" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="178" cy="136" rx="16" ry="13" fill="#FFD8B0" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <!-- wand in right hand -->
  <line x1="186" y1="128" x2="208" y2="88" stroke="#B07A4F" stroke-width="8" stroke-linecap="round"/>
  <path d="M208 70 L212 82 L224 84 L214 92 L217 104 L208 97 L199 104 L202 92 L192 84 L204 82 Z" fill="#FFC94A" stroke="#3D2B1F" stroke-width="6" stroke-linejoin="round"/>
  <ellipse cx="206" cy="78" rx="6" ry="4" fill="#FFF6E5" opacity="0.6"/>
  <!-- head -->
  <circle cx="128" cy="78" r="48" fill="#FFD8B0" stroke="#3D2B1F" stroke-width="10"/>
  <ellipse cx="112" cy="62" rx="16" ry="10" fill="#FFF6E5" opacity="0.55"/>
  <!-- hair -->
  <path d="M86 72 C88 42 112 34 128 34 C148 34 170 44 170 72 C162 52 144 48 128 48 C110 48 94 54 86 72 Z" fill="#B07A4F" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <!-- face -->
  <ellipse cx="112" cy="86" rx="7" ry="9" fill="#3D2B1F"/>
  <ellipse cx="146" cy="86" rx="7" ry="9" fill="#3D2B1F"/>
  <circle cx="114" cy="83" r="2.5" fill="#FFFFFF"/>
  <circle cx="148" cy="83" r="2.5" fill="#FFFFFF"/>
  <circle cx="100" cy="98" r="8" fill="#FFB3C1" opacity="0.5"/>
  <circle cx="156" cy="98" r="8" fill="#FFB3C1" opacity="0.5"/>
  <path d="M116 108 Q128 118 140 108" stroke="#3D2B1F" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
