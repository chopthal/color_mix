  <rect x="22" y="40" width="20" height="18" rx="6" fill="#FFFFFF"/>
  <rect x="22" y="88" width="20" height="18" rx="6" fill="#FFFFFF"/>
  <rect x="22" y="136" width="20" height="18" rx="6" fill="#FFFFFF"/>
  <rect x="22" y="184" width="20" height="18" rx="6" fill="#FFFFFF"/>
  <rect x="22" y="232" width="20" height="18" rx="6" fill="#FFFFFF"/>
  <!-- right candy cane -->
  <rect x="210" y="18" width="28" height="284" rx="14" fill="#FF6B81" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <rect x="214" y="56" width="20" height="18" rx="6" fill="#FFFFFF"/>
  <rect x="214" y="104" width="20" height="18" rx="6" fill="#FFFFFF"/>
