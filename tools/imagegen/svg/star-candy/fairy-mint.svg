  <path d="M128 22 L134 38 L151 40 L138 51 L142 68 L128 59 L114 68 L118 51 L105 40 L122 38 Z" fill="#FFC94A" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
