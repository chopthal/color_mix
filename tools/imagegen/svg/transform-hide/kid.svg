<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" fill="none">
  <!-- cute child with purple tunic + star wand, faces right -->
  <ellipse cx="128" cy="292" rx="52" ry="12" fill="#3D2B1F" opacity="0.12"/>
  <!-- legs -->
  <rect x="78" y="230" width="38" height="52" rx="16" fill="#7C3AED" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <rect x="140" y="230" width="38" height="52" rx="16" fill="#7C3AED" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="97" cy="280" rx="20" ry="10" fill="#5B21B6" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <ellipse cx="159" cy="280" rx="20" ry="10" fill="#5B21B6" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <!-- body tunic -->
  <rect x="68" y="148" width="120" height="96" rx="36" fill="#A78BFA" stroke="#3D2B1F" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="100" cy="168" rx="22" ry="12" fill="#FFF6E5" opacity="0.55"/>
  <!-- belly star -->
  <path d="M128 178 L136 196 L156 198 L140 210 L145 230 L128 218 L111 230 L116 210 L100 198 L120 196 Z" fill="#FFC94A" stroke="#3D2B1F" stroke-width="6" stroke-linejoin="round"/>
  <!-- arms -->
  <circle cx="60" cy="168" r="18" fill="#FFD8B0" stroke="#3D2B1F" stroke-width="8"/>
  <circle cx="196" cy="160" r="18" fill="#FFD8B0" stroke="#3D2B1F" stroke-width="8"/>
  <!-- wand (right hand) -->
  <line x1="204" y1="152" x2="228" y2="78" stroke="#DDD6FE" stroke-width="10" stroke-linecap="round"/>
  <path d="M228 52 L236 72 L258 74 L240 88 L245 110 L228 96 L211 110 L216 88 L198 74 L220 72 Z" fill="#FFC94A" stroke="#3D2B1F" stroke-width="6" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="128" cy="96" r="58" fill="#FFD8B0" stroke="#3D2B1F" stroke-width="10"/>
  <ellipse cx="108" cy="78" rx="16" ry="10" fill="#FFF6E5" opacity="0.55"/>
  <!-- hair -->
  <path d="M72 96 Q72 42 128 38 Q184 42 184 96 Q184 70 128 66 Q72 70 72 96 Z" fill="#5A3B2E" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
  <ellipse cx="98" cy="48" rx="22" ry="14" fill="#5A3B2E" stroke="#3D2B1F" stroke-width="6"/>
  <!-- face -->
  <ellipse cx="110" cy="104" rx="7" ry="9" fill="#3D2B1F"/>
  <ellipse cx="146" cy="104" rx="7" ry="9" fill="#3D2B1F"/>
  <circle cx="112" cy="101" r="2.5" fill="#FFFFFF"/>
  <circle cx="148" cy="101" r="2.5" fill="#FFFFFF"/>
  <circle cx="96" cy="118" r="8" fill="#FFB3C1" opacity="0.5"/>
  <circle cx="160" cy="118" r="8" fill="#FFB3C1" opacity="0.5"/>
  <path d="M116 128 Q128 140 140 128" stroke="#3D2B1F" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
