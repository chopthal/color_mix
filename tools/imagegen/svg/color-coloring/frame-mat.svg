<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- outer wood frame with transparent center hole -->
  <defs>
    <mask id="hole">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="72" y="72" width="368" height="368" rx="28" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#hole)">
    <rect x="16" y="16" width="480" height="480" rx="40" fill="#B07A4F"/>
    <rect x="28" y="28" width="456" height="456" rx="34" fill="#D4A574"/>
    <rect x="40" y="40" width="432" height="432" rx="30" fill="#C9955A"/>
    <rect x="52" y="52" width="408" height="408" rx="26" fill="#FFF6E5"/>
    <rect x="60" y="60" width="392" height="392" rx="22" fill="#F6E2B8"/>
  </g>
  <!-- soft inner lip -->
  <rect x="72" y="72" width="368" height="368" rx="28" fill="none" stroke="#E7C48A" stroke-width="10"/>
  <rect x="20" y="20" width="472" height="472" rx="38" fill="none" stroke="#3D2B1F" stroke-width="8" stroke-linejoin="round"/>
</svg>