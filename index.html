<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="키즈 놀이터">
  <title>🎈 신나는 키즈 놀이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    :root {
      --bg-sky: #e4f4fd;
      --card-shadow: 0 12px 28px rgba(74, 110, 169, 0.15);
      --font-main: "Jua", "Malgun Gothic", sans-serif;
    }

    body {
      font-family: var(--font-main);
      background: linear-gradient(180deg, #bfe3fc 0%, #dff3ff 45%, #effbf5 100%);
      color: #35495e;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }

    /* 배경 애니메이션 구름 & 장식 */
    .bg-decorations {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50px;
      animation: float-cloud linear infinite;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }
    .cloud-1 {
      width: 140px;
      height: 46px;
      top: 8%;
      left: -150px;
      animation-duration: 34s;
    }
    .cloud-1::before { width: 50px; height: 50px; top: -24px; left: 24px; }
    .cloud-1::after { width: 40px; height: 40px; top: -18px; right: 26px; }

    .cloud-2 {
      width: 180px;
      height: 56px;
      top: 22%;
      left: -200px;
      animation-duration: 45s;
      animation-delay: 10s;
      opacity: 0.6;
    }
    .cloud-2::before { width: 64px; height: 64px; top: -30px; left: 32px; }
    .cloud-2::after { width: 50px; height: 50px; top: -20px; right: 30px; }

    .sun {
      position: absolute;
      top: 20px;
      right: 25px;
      width: 72px;
      height: 72px;
      background: radial-gradient(circle, #ffe144 0%, #ffab00 80%);
      border-radius: 50%;
      box-shadow: 0 0 40px #ffc83b;
      animation: rotate-sun 25s linear infinite;
    }

    @keyframes float-cloud {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(100vw + 240px)); }
    }
    @keyframes rotate-sun {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.05) rotate(180deg); }
      100% { transform: scale(1) rotate(360deg); }
    }

    /* 메인 컨테이너 */
    .portal-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    /* 헤더 */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge-pill {
      display: inline-block;
      background: #ffecb3;
      color: #925400;
      padding: 6px 18px;
      border-radius: 30px;
      font-size: clamp(14px, 2.5vw, 17px);
      letter-spacing: 0.5px;
      box-shadow: 0 3px 0 #ffe082;
      margin-bottom: 8px;
      animation: bounce-subtle 2.5s ease-in-out infinite;
    }

    h1.portal-title {
      font-size: clamp(34px, 7vw, 56px);
      color: #2b4365;
      text-shadow: 0 3px 0 #ffffff, 0 6px 14px rgba(43, 67, 101, 0.15);
      line-height: 1.2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .title-emoji {
      display: inline-block;
      animation: wiggle 2s infinite ease-in-out;
    }

    .portal-subtitle {
      font-size: clamp(17px, 3.4vw, 22px);
      color: #5c7493;
      margin-top: 6px;
      font-weight: 400;
    }

    /* 게임 그리드 */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
      width: 100%;
      padding: 8px 4px;
    }

    /* 공통 게임 카드 */
    .game-card {
      position: relative;
      background: #ffffff;
      border-radius: 32px;
      padding: 24px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: var(--card-shadow);
      border: 5px solid transparent;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease, border-color 0.22s ease;
      cursor: pointer;
      overflow: hidden;
    }

    .game-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: currentColor;
      opacity: 0.8;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
    }

    .game-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 38px rgba(74, 110, 169, 0.22);
    }

    .game-card:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 8px 16px rgba(74, 110, 169, 0.15);
    }

    /* 카드 1: 색깔 섞기 */
    .card-color-mix {
      border-color: #ffd1d1;
      color: #e54b64;
    }
    .card-color-mix:hover {
      border-color: #ff6b81;
    }
    .card-color-mix .card-icon-wrap {
      background: radial-gradient(circle, #fff1f3 0%, #ffdbe1 100%);
      border: 4px solid #ffccd4;
    }

    /* 카드 2: 낚시 놀이 */
    .card-fishing {
      border-color: #cbe9ff;
      color: #0b80d7;
    }
    .card-fishing:hover {
      border-color: #38a9f6;
    }
    .card-fishing .card-icon-wrap {
      background: radial-gradient(circle, #eef7ff 0%, #d4ecff 100%);
      border: 4px solid #bce1ff;
    }

    /* 카드 3: 커밍순 */
    .card-coming {
      border-color: #e9ecef;
      color: #8c9ba5;
      background: rgba(255, 255, 255, 0.82);
      cursor: default;
    }
    .card-coming:hover {
      transform: none;
      box-shadow: var(--card-shadow);
      border-color: #e9ecef;
    }

    /* 카드 내부 구성 */
    .card-badge {
      align-self: flex-end;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .badge-hot {
      background: linear-gradient(135deg, #ff5e62, #ff9966);
    }
    .badge-new {
      background: linear-gradient(135deg, #11998e, #38ef7d);
    }
    .badge-soon {
      background: #adb5bd;
    }

    .card-icon-wrap {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 54px;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    .card-color-mix .card-icon-wrap span {
      animation: bounce 2s infinite ease-in-out;
    }
    .card-fishing .card-icon-wrap span {
      animation: swim 2.4s infinite ease-in-out;
    }

    .card-title {
      font-size: clamp(23px, 4.5vw, 29px);
      color: #233547;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 16px;
      color: #6a7d90;
      line-height: 1.4;
      margin-bottom: 18px;
      min-height: 44px;
    }

    .play-btn {
      width: 100%;
      padding: 12px 18px;
      border-radius: 24px;
      font-size: 19px;
      font-family: inherit;
      font-weight: 700;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.12);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .card-color-mix .play-btn {
      background: #ff5277;
      color: #ffffff;
      box-shadow: 0 5px 0 #d9385b;
    }
    .card-color-mix .play-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #d9385b;
    }

    .card-fishing .play-btn {
      background: #0ea5e9;
      color: #ffffff;
      box-shadow: 0 5px 0 #0284c7;
    }
    .card-fishing .play-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #0284c7;
    }

    .card-coming .play-btn {
      background: #e2e8f0;
      color: #94a3b8;
      box-shadow: 0 4px 0 #cbd5e1;
      cursor: not-allowed;
    }

    /* 하단 푸터 */
    footer {
      position: relative;
      z-index: 1;
      margin-top: 24px;
      font-size: 14px;
      color: #7d93a8;
      text-align: center;
    }

    /* 애니메이션 키프레임 */
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes swim {
      0%, 100% { transform: rotate(-5deg) translateY(0); }
      50% { transform: rotate(5deg) translateY(-6px); }
    }
    @keyframes bounce-subtle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }
  </style>
</head>
<body>
  <!-- 배경 데코 -->
  <div class="bg-decorations">
    <div class="sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
  </div>

  <div class="portal-container">
    <header>
      <div class="badge-pill">✨ 매일매일 재미있는 유아 감각 놀이터 ✨</div>
      <h1 class="portal-title">
        <span class="title-emoji">🎪</span> 신나는 키즈 놀이터 <span class="title-emoji">🎨</span>
      </h1>
      <p class="portal-subtitle">오늘은 어떤 신나는 놀이를 해볼까요?</p>
    </header>

    <main class="games-grid">
      <!-- 1. 색깔 섞기 게임 -->
      <a href="games/color-mix/index.html" class="game-card card-color-mix" id="cardColorMix">
        <span class="card-badge badge-hot">인기 최고!</span>
        <div class="card-icon-wrap">
          <span>🎨</span>
        </div>
        <h2 class="card-title">알록달록 색깔 섞기</h2>
        <p class="card-desc">물감을 콕콕 찍어서 섞어보세요!<br>어떤 예쁜 색이 나올까?</p>
        <button class="play-btn" type="button" tabindex="-1">
          <span>시작하기!</span> <span>▶</span>
        </button>
      </a>

      <!-- 2. 바다 낚시 놀이 -->
      <a href="games/fishing/index.html" class="game-card card-fishing" id="cardFishing">
        <span class="card-badge badge-new">두 번째 놀이</span>
        <div class="card-icon-wrap">
          <span>🎣</span>
        </div>
        <h2 class="card-title">두근두근 바다 낚시</h2>
        <p class="card-desc">바닷속 헤엄치는 물고기 중<br>찾아야 하는 물고기를 쏙 낚아요!</p>
        <button class="play-btn" type="button" tabindex="-1">
          <span>낚시하러 가기!</span> <span>🐟</span>
        </button>
      </a>

      <!-- 3. 커밍순 슬롯 -->
      <div class="game-card card-coming" id="cardComingSoon">
        <span class="card-badge badge-soon">준비 중</span>
        <div class="card-icon-wrap">
          <span>🧩</span>
        </div>
        <h2 class="card-title">새로운 놀이</h2>
        <p class="card-desc">더 재미있고 신나는 놀이가<br>곧 찾아올 예정이에요!</p>
        <button class="play-btn" type="button" disabled>
          <span>기대해 주세요!</span>
        </button>
      </div>
    </main>

    <footer>
      <p>아이들의 창의력과 관찰력을 키워주는 키즈 플레이존</p>
    </footer>
  </div>

  <script>
    // 유아 친화적인 인터랙션 사운드 (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playPopSound() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(840, audioCtx.currentTime + 0.12);
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.13);
    }

    // 카드 클릭 시 경쾌한 효과음 후 이동
    document.querySelectorAll('.game-card:not(.card-coming)').forEach(card => {
      card.addEventListener('pointerdown', () => {
        try { playPopSound(); } catch (e) {}
      });
    });
  </script>
</body>
</html>
