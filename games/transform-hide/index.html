<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="뾰로롱! 변신 숨바꼭질">
  <title>🪄 뾰로롱! 변신 숨바꼭질</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <meta name="theme-color" content="#bfe3fc">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">

  <script>
    (function () {
      if (location.protocol === 'file:') return;
      var p = location.pathname;
      if (/\/$/.test(p) || /\.html?$/.test(p)) return;
      location.replace(p + '/' + location.search + location.hash);
    })();
  </script>

  <link rel="stylesheet" href="../../fonts/fonts.css">

  <link rel="stylesheet" href="../_shared/kit.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="top-bar">
    <a class="nav-home" href="../../index.html" aria-label="놀이터로 돌아가기">
      <span>🏠</span>
      <span>놀이터</span>
    </a>
    <h1 class="app-title"><span>🪄</span> 뾰로롱! 변신 숨바꼭질</h1>
    <div class="top-right">
      <button class="btn-icon" id="btnSound" type="button" aria-label="소리 켜기/끄기">🔊</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="gameCanvas" aria-label="변신 숨바꼭질 놀이터"></canvas>

    <!-- 요정 고르기 -->
    <section class="select-screen is-on" id="selectScreen">
      <div class="select-head">
        <h2>누구랑 숨바꼭질?</h2>
        <p>요정 친구를 골라요</p>
        <p class="welcome-banner" id="welcomeBanner" hidden>요정이 손을 흔들어요! 반가워~</p>
      </div>

      <div class="fairy-row" id="fairyRow"></div>

      <button class="start-btn" id="btnStart" type="button">
        숨바꼭질 시작! <span>🪄</span>
      </button>
    </section>
  </main>

  <script src="../_shared/kit.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
