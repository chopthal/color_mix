<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="반짝반짝 별사탕을 지켜요">
  <title>🍬 반짝반짝 별사탕을 지켜요</title>

  <script>
    (function () {
      if (location.protocol === 'file:') return;
      var p = location.pathname;
      if (/\/$/.test(p) || /\.html?$/.test(p)) return;
      location.replace(p + '/' + location.search + location.hash);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="top-bar">
    <a class="nav-home" href="../../index.html" aria-label="놀이터로 돌아가기">
      <span>🏠</span>
      <span>놀이터</span>
    </a>
    <h1 class="app-title"><span>🍬</span> 별사탕을 지켜요</h1>
    <div class="top-right">
      <button class="btn-icon" id="btnSound" type="button" aria-label="소리 켜기/끄기">🔊</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="gameCanvas" aria-label="별사탕 숨기기 놀이터"></canvas>

    <!-- 요정 고르기 -->
    <section class="select-screen is-on" id="selectScreen">
      <div class="select-head">
        <h2>누구랑 놀까?</h2>
        <p>요정 친구를 골라요</p>
      </div>

      <div class="fairy-row" id="fairyRow"></div>

      <button class="start-btn" id="btnStart" type="button">
        놀이 시작! <span>🍬</span>
      </button>
    </section>

    <!-- 소프트 엔딩 -->
    <div class="ending-overlay" id="endingOverlay">
      <div class="ending-card">
        <div class="ending-ornament">🍬✨🍬</div>
        <h2>오늘 별사탕 잘 지켰어!</h2>
        <p>콩콩! 신나게 놀았어요</p>
        <div class="ending-actions">
          <button class="btn-pill btn-again" id="btnAgain" type="button">또! 🔁</button>
          <button class="btn-pill btn-change" id="btnChange" type="button">요정 바꾸기 🧚</button>
        </div>
        <a class="rest-link" href="../../index.html">쉬자 🏠</a>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
