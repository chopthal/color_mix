<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="달콤 사탕 자판기">
  <title>🍬 달콤 사탕 자판기</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">

  <script>
    (function () {
      if (location.protocol === 'file:') return;
      var p = location.pathname;
      if (/\/$/.test(p) || /\.html?$/.test(p)) return;
      location.replace(p + '/' + location.search + location.hash);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../_shared/kit.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="top-bar">
    <a class="nav-home" href="../../index.html" aria-label="놀이터로 돌아가기">
      <span>🏠</span>
      <span>놀이터</span>
    </a>
    <h1 class="app-title"><span>🍬</span> 달콤 사탕 자판기</h1>
    <div class="top-right">
      <button class="btn-icon" id="btnReset" type="button" aria-label="처음부터 다시" title="다시">🔄</button>
      <button class="btn-icon" id="btnSound" type="button" aria-label="소리 켜기/끄기">🔊</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="gameCanvas" aria-label="동전을 넣고 사탕을 뽑아 쪽쪽 녹여 먹고 치카치카 양치하는 놀이"></canvas>

    <div class="ending-overlay" id="endingOverlay">
      <div class="ending-card">
        <div class="ending-ornament">🦷✨🍬</div>
        <h2 id="endingTitle">치카치카 대성공!</h2>
        <p id="endingMsg">이가 반짝반짝 깨끗해졌어요</p>
        <div class="ending-actions">
          <button class="btn-pill btn-again" id="btnAgain" type="button">또 먹기! 🍬</button>
          <a class="btn-pill btn-play" id="btnRest" href="../../index.html">쉬자 🏠</a>
        </div>
      </div>
    </div>
  </main>

  <script src="../_shared/kit.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
