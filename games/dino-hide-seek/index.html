<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="숨바꼭질 공룡 친구들">
  <meta name="theme-color" content="#bfe3fc">
  <title>🦕 숨바꼭질 공룡 친구들</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --line: #34455c;
      --ink: #2b3a4a;
      --soft: #6b8098;
      --pink: #ff5d7a;
      --pink-dark: #d93e5b;
      --sky: #bfe3fc;
      --font: "Jua", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      --safe-top: max(10px, env(safe-area-inset-top));
      --safe-bottom: max(10px, env(safe-area-inset-bottom));
      --safe-left: max(10px, env(safe-area-inset-left));
      --safe-right: max(10px, env(safe-area-inset-right));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--sky);
      -webkit-text-size-adjust: 100%;
    }

    button {
      font-family: inherit;
      color: inherit;
      border: 0;
      background: none;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 4px solid #ffbe0b;
      outline-offset: 3px;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    /* ============ 공통 버튼 ============ */
    .icon-btn {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      border-radius: 20px;
      background: #ffffff;
      border: 3px solid #e3edf6;
      box-shadow: 0 4px 0 rgba(52, 69, 92, 0.12);
      font-size: 24px;
      display: grid;
      place-items: center;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .icon-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(52, 69, 92, 0.12);
    }

    .big-btn {
      width: 100%;
      min-height: 64px;
      padding: 10px 20px;
      border-radius: 26px;
      font-size: clamp(21px, 5vw, 26px);
      color: #ffffff;
      background: #ffffff;
      box-shadow: 0 6px 0 rgba(52, 69, 92, 0.12);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .big-btn.primary {
      background: var(--pink);
      box-shadow: 0 6px 0 var(--pink-dark);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
    }

    .big-btn.primary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--pink-dark);
    }

    .big-btn.soft {
      background: #eef6ff;
      color: #2b5f94;
      box-shadow: 0 6px 0 #cfe3f7;
    }

    .big-btn.soft:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #cfe3f7;
    }

    .big-btn.ghost {
      background: transparent;
      color: #5a7289;
      box-shadow: none;
      min-height: 52px;
      font-size: clamp(17px, 4vw, 20px);
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    .text-btn {
      font-size: 17px;
      color: #5a7289;
      padding: 10px 16px;
      border-radius: 16px;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .text-btn.danger {
      color: #c95268;
    }

    /* ============ 타이틀 ============ */
    #titleScreen {
      background: linear-gradient(180deg, #b7e2fd 0%, #dff3ff 46%, #e9fff2 100%);
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.86);
      border-radius: 60px;
      pointer-events: none;
      z-index: 1;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud.c1 {
      width: 150px;
      height: 48px;
      top: 9%;
      left: -170px;
      animation: drift 34s linear infinite -12s;
    }
    .cloud.c1::before { width: 56px; height: 56px; top: -26px; left: 26px; }
    .cloud.c1::after { width: 44px; height: 44px; top: -20px; right: 26px; }

    .cloud.c2 {
      width: 190px;
      height: 58px;
      top: 24%;
      left: -230px;
      opacity: 0.7;
      animation: drift 46s linear infinite -22s;
    }
    .cloud.c2::before { width: 68px; height: 68px; top: -32px; left: 34px; }
    .cloud.c2::after { width: 52px; height: 52px; top: -22px; right: 30px; }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(calc(100vw + 280px)); }
    }

    .title-hill {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -60px;
      height: 42%;
      border-radius: 50% 50% 0 0;
      background: radial-gradient(120% 100% at 50% 0%, #a5e7b2 0%, #7bd494 55%, #5cc07e 100%);
      z-index: 1;
    }

    .title-hill.h2 {
      bottom: -110px;
      height: 34%;
      background: radial-gradient(120% 100% at 50% 0%, #8edd9f 0%, #64c57f 60%, #4db16b 100%);
      opacity: 0.9;
    }

    .title-dinos {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(2px, 2vw, 18px);
      z-index: 2;
      pointer-events: none;
    }

    .title-dino {
      width: clamp(96px, 26vw, 170px);
      animation: peek-bob 2.6s ease-in-out infinite;
      filter: drop-shadow(0 10px 6px rgba(30, 60, 50, 0.15));
    }

    .title-dino:nth-child(2) { animation-delay: 0.35s; width: clamp(76px, 20vw, 132px); }
    .title-dino:nth-child(3) { animation-delay: 0.7s; width: clamp(64px, 17vw, 112px); }

    @keyframes peek-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .title-content {
      position: relative;
      z-index: 4;
      width: min(440px, 88vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-bottom: 8vh;
      gap: 10px;
    }

    .title-topbar {
      position: fixed;
      top: var(--safe-top);
      left: var(--safe-left);
      right: var(--safe-right);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      padding: 0 4px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 52px;
      padding: 0 18px;
      border-radius: 20px;
      background: #ffffff;
      border: 3px solid #e3edf6;
      box-shadow: 0 4px 0 rgba(52, 69, 92, 0.12);
      color: #43607d;
      font-size: 18px;
      text-decoration: none;
    }

    .title-kicker {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 999px;
      background: #fff3c4;
      color: #a06a00;
      font-size: clamp(14px, 3.6vw, 17px);
      box-shadow: 0 3px 0 #ffe58f;
      animation: soft-bounce 2.6s ease-in-out infinite;
    }

    @keyframes soft-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    h1.title-logo {
      font-size: clamp(36px, 9.4vw, 62px);
      line-height: 1.08;
      color: #2b4365;
      text-shadow: 0 3px 0 #ffffff, 0 9px 22px rgba(43, 67, 101, 0.18);
      letter-spacing: -0.5px;
    }

    h1.title-logo span {
      color: #ff5d7a;
      text-shadow: 0 3px 0 #ffffff, 0 9px 22px rgba(255, 93, 122, 0.25);
    }

    .title-sub {
      font-size: clamp(16px, 4.2vw, 20px);
      color: #4e6b86;
      margin-top: 2px;
    }

    #startBtn {
      margin-top: 12px;
    }

    .title-progress {
      margin-top: 2px;
      font-size: 16px;
      color: #5c7691;
      background: rgba(255, 255, 255, 0.7);
      padding: 5px 16px;
      border-radius: 999px;
    }

    /* ============ 목록 공통 ============ */
    .page-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(var(--safe-top) + 4px) calc(var(--safe-right) + 14px) 10px calc(var(--safe-left) + 14px);
      flex: 0 0 auto;
    }

    .page-head h2 {
      flex: 1;
      font-size: clamp(22px, 5.6vw, 28px);
      color: #2b4365;
      text-align: center;
    }

    #mapScreen .page-head > .icon-btn:last-child {
      visibility: hidden;
    }

    #mapScreen,
    #bookScreen {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: linear-gradient(180deg, #dff3ff 0%, #f1fbff 55%, #eafff3 100%);
    }

    /* ============ 장소 선택 ============ */
    .time-pill {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 2px 16px 14px;
      flex: 0 0 auto;
    }

    .time-pill .tp {
      min-height: 50px;
      padding: 0 22px;
      border-radius: 999px;
      background: #ffffff;
      border: 3px solid #e0edf8;
      color: #6a8199;
      font-size: 18px;
      box-shadow: 0 4px 0 rgba(52, 69, 92, 0.08);
      transition: transform 0.12s ease, background 0.2s ease, color 0.2s ease;
    }

    .time-pill .tp.active {
      background: #ffd93b;
      border-color: #ffc400;
      color: #7c5500;
      transform: translateY(-2px);
    }

    .time-pill .tp.active.night {
      background: #4a5fa8;
      border-color: #3a4d92;
      color: #fff;
    }

    .place-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 0 calc(var(--safe-right) + 16px) 8px calc(var(--safe-left) + 16px);
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
    }

    .place-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 28px;
      background: #ffffff;
      border: 4px solid #e6f0f8;
      box-shadow: 0 8px 0 rgba(52, 69, 92, 0.07);
      text-align: left;
      transition: transform 0.14s ease, border-color 0.2s ease;
      position: relative;
    }

    .place-card:active {
      transform: translateY(3px);
    }

    .place-card .preview {
      width: clamp(88px, 24vw, 118px);
      aspect-ratio: 1 / 1;
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: clamp(38px, 10vw, 52px);
      flex: 0 0 auto;
      overflow: hidden;
      position: relative;
      border: 3px solid rgba(255, 255, 255, 0.7);
    }

    .preview.forest { background: linear-gradient(180deg, #cdefff 0%, #cdefff 55%, #7ed693 55%, #4db16b 100%); }
    .preview.lake { background: linear-gradient(180deg, #cdefff 0%, #cdefff 46%, #66d0ef 46%, #2fa8d6 100%); }
    .preview.nest { background: linear-gradient(180deg, #ffe3c4 0%, #ffd09b 55%, #e9b877 55%, #c9975a 100%); }

    .place-card .preview::after {
      content: "";
      position: absolute;
      left: -20%;
      right: -20%;
      bottom: -34px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.32);
    }

    .place-info {
      flex: 1;
      min-width: 0;
    }

    .place-info {
      display: block;
    }

    .place-title {
      display: block;
      font-size: clamp(19px, 5vw, 24px);
      color: #26384b;
      margin-bottom: 4px;
    }

    .place-info .sub {
      display: block;
      font-size: 14px;
      color: #7b91a6;
      margin-bottom: 7px;
    }

    .place-info .bar {
      display: block;
    }

    .place-info .count {
      display: block;
    }

    .bar {
      height: 12px;
      border-radius: 999px;
      background: #eaf2f8;
      overflow: hidden;
      width: 100%;
    }

    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #7bd494, #4db16b);
      transition: width 0.35s ease;
    }

    .place-info .count {
      font-size: 13px;
      color: #6f8599;
      margin-top: 4px;
    }

    .golden-badge {
      position: absolute;
      top: -10px;
      right: 14px;
      font-size: 26px;
      transform: rotate(8deg);
      filter: drop-shadow(0 3px 2px rgba(120, 90, 0, 0.25));
      animation: soft-bounce 2.2s ease-in-out infinite;
    }

    .map-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 16px calc(var(--safe-bottom) + 18px);
    }

    .map-progress {
      font-size: 15px;
      color: #65809a;
      background: rgba(255, 255, 255, 0.8);
      padding: 5px 16px;
      border-radius: 999px;
    }

    /* ============ 게임 화면 ============ */
    #gameScreen {
      background: #bfe3fc;
    }

    .scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transition: background 0.7s ease;
    }

    .sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #bfe3fc 0%, #dff3ff 52%, #f2fff8 100%);
      transition: background 0.7s ease;
    }

    .scene[data-time="night"] .sky {
      background: linear-gradient(180deg, #16214d 0%, #293a78 48%, #4b4d8f 100%);
    }

    .orb {
      position: absolute;
      top: calc(var(--safe-top) + 74px);
      right: calc(var(--safe-right) + 22px);
      width: clamp(52px, 12vw, 78px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 36% 34%, #fff8bd 0%, #ffd93b 48%, #ffb300 100%);
      box-shadow: 0 0 44px rgba(255, 207, 64, 0.85);
      z-index: 2;
      transition: all 0.7s ease;
    }

    .scene[data-time="night"] .orb {
      background: radial-gradient(circle at 38% 34%, #ffffff 0%, #e8f1ff 45%, #b9cdf5 100%);
      box-shadow: 0 0 38px rgba(180, 205, 255, 0.65);
    }

    .stars {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.7s ease;
      pointer-events: none;
    }

    .scene[data-time="night"] .stars {
      opacity: 1;
    }

    .stars i {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fffbe8;
      box-shadow: 0 0 8px #fff6c4;
      animation: twinkle 2.6s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .cloud-drift {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      opacity: 0.9;
      transition: opacity 0.6s ease;
    }

    .scene[data-time="night"] .cloud-drift {
      opacity: 0.35;
    }

    .cloud-drift i {
      position: absolute;
      display: block;
      background: #ffffff;
      border-radius: 50%;
      width: 44px;
      height: 44px;
    }

    .cloud-drift i:nth-child(2) { width: 58px; height: 58px; left: 30px; top: -18px; }
    .cloud-drift i:nth-child(3) { width: 40px; height: 40px; left: 78px; top: -2px; }
    .cloud-drift i:nth-child(4) { width: 34px; height: 34px; left: 112px; top: 6px; }
    .cloud-drift .base {
      position: absolute;
      left: 6px;
      top: 18px;
      width: 130px;
      height: 30px;
      background: #ffffff;
      border-radius: 40px;
    }

    .cloud-drift.a {
      top: 18%;
      left: -160px;
      animation: drift 42s linear infinite -18s;
    }

    .cloud-drift.b {
      top: 34%;
      left: -200px;
      scale: 0.72;
      opacity: 0.55;
      animation: drift 58s linear infinite -30s;
    }

    .landscape {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100%;
      z-index: 2;
      transition: filter 0.7s ease;
      pointer-events: none;
    }

    .landscape svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .scene[data-time="night"] .landscape {
      filter: brightness(0.52) saturate(0.75) hue-rotate(8deg);
    }

    .spots {
      position: absolute;
      inset: 0;
      z-index: 5;
    }

    .spot {
      position: absolute;
      width: clamp(70px, 16vw, 112px);
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      background: none;
      transform: translate(-50%, -50%);
      animation: spot-wiggle 2.9s ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      z-index: 6;
    }

    .spot.opening {
      animation: spot-poke 0.26s ease;
    }

    .spot.found {
      animation: none;
      transform: translate(-50%, -50%);
      z-index: 12;
    }

    @keyframes spot-wiggle {
      0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
      50% { transform: translate(-50%, -50%) rotate(2.6deg) scale(1.045); }
    }

    @keyframes spot-poke {
      0% { transform: translate(-50%, -50%) scale(1); }
      45% { transform: translate(-50%, -50%) scale(0.82); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .spot-art {
      display: block;
      width: 100%;
      height: 100%;
      transition: opacity 0.22s ease, transform 0.22s ease;
      filter: drop-shadow(0 7px 6px rgba(35, 60, 80, 0.2));
    }

    .spot-art svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .spot.found .spot-art {
      opacity: 0;
      transform: scale(0.4);
    }

    .scene[data-time="night"] .spot-art {
      filter: brightness(0.72) saturate(0.88) drop-shadow(0 7px 6px rgba(20, 30, 50, 0.35));
    }

    .spot.edge-left .reveal-dino {
      left: 66%;
    }

    .spot.edge-right .reveal-dino {
      left: 34%;
    }

    .twinkle {
      position: absolute;
      top: -4%;
      right: 4%;
      width: 12px;
      height: 12px;
      background: #fff6b8;
      border-radius: 50%;
      box-shadow: 0 0 12px #ffd93b;
      animation: twinkle 1.8s ease-in-out infinite;
      transition: opacity 0.2s ease;
    }

    .spot.found .twinkle {
      opacity: 0;
    }

    .reveal-dino {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 152%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.36s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
      z-index: 3;
    }

    .reveal-dino.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .reveal-dino svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 9px 8px rgba(30, 50, 70, 0.28));
    }

    .reveal-dino.show svg {
      animation: dino-bob 2.4s ease-in-out infinite 0.4s;
    }

    @keyframes dino-bob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-6px) rotate(1.5deg); }
    }

    .name-tag {
      position: absolute;
      left: 50%;
      bottom: 2%;
      transform: translate(-50%, 100%);
      background: #ffffff;
      border: 3px solid var(--line);
      border-radius: 999px;
      padding: 1px 12px;
      font-size: clamp(12px, 3.2vw, 16px);
      color: #2b3a4a;
      white-space: nowrap;
      box-shadow: 0 4px 0 rgba(52, 69, 92, 0.18);
    }

    .burst {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--bc, #ffd93b);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.2);
      pointer-events: none;
    }

    .spot.found .burst {
      animation: burst-out 0.75s ease-out forwards;
      animation-delay: var(--bd, 0s);
    }

    @keyframes burst-out {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.3); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--tx, 0px)), calc(-50% + var(--ty, 0px))) scale(1.1); }
    }

    /* HUD */
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: calc(var(--safe-top) + 4px) calc(var(--safe-right) + 14px) 8px calc(var(--safe-left) + 14px);
      z-index: 30;
      pointer-events: none;
    }

    .hud > * {
      pointer-events: auto;
    }

    .hud-center {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 999px;
      padding: 6px 8px 6px 18px;
      box-shadow: 0 5px 0 rgba(52, 69, 92, 0.1);
      max-width: 56vw;
    }

    .hud-center .scene-name {
      font-size: clamp(15px, 4vw, 19px);
      color: #2b4365;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .counter-pill {
      background: #ffd93b;
      color: #7c5500;
      border-radius: 999px;
      padding: 3px 12px;
      font-size: clamp(15px, 4vw, 19px);
      white-space: nowrap;
    }

    .hud-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px calc(var(--safe-right) + 14px) calc(var(--safe-bottom) + 10px) calc(var(--safe-left) + 14px);
      z-index: 30;
    }

    .hint-pill {
      flex: 1;
      text-align: center;
      font-size: clamp(13px, 3.4vw, 16px);
      color: #4a637d;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      padding: 9px 12px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 rgba(52, 69, 92, 0.08);
      transition: opacity 0.25s ease;
    }

    .scene[data-time="night"] .hint-pill {
      background: rgba(255, 255, 255, 0.82);
    }

    .round-btn {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      border-radius: 18px;
      background: #ffffff;
      border: 3px solid #e6f0f8;
      box-shadow: 0 4px 0 rgba(52, 69, 92, 0.12);
      font-size: 22px;
      display: grid;
      place-items: center;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .round-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(52, 69, 92, 0.12);
    }

    .round-btn.wide {
      width: auto;
      min-width: 58px;
      padding: 0 12px;
      font-size: 16px;
      gap: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============ 도감 ============ */
    .book-total {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 2px calc(var(--safe-right) + 20px) 10px calc(var(--safe-left) + 20px);
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
    }

    .book-total .bar {
      flex: 1;
      height: 14px;
    }

    .book-total .bar > i {
      background: linear-gradient(90deg, #ffb347, #ff7a59);
    }

    .book-count {
      font-size: 15px;
      color: #6a8199;
      white-space: nowrap;
    }

    .book-tabs {
      display: flex;
      gap: 8px;
      padding: 0 calc(var(--safe-right) + 20px) 12px calc(var(--safe-left) + 20px);
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
    }

    .book-tabs button {
      flex: 1;
      min-height: 48px;
      border-radius: 18px;
      background: #ffffff;
      border: 3px solid #e6f0f8;
      color: #6a8199;
      font-size: 16px;
      box-shadow: 0 4px 0 rgba(52, 69, 92, 0.07);
    }

    .book-tabs button.active {
      background: #ffe27a;
      border-color: #ffc400;
      color: #7c5500;
      transform: translateY(-2px);
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 0 calc(var(--safe-right) + 20px) 10px calc(var(--safe-left) + 20px);
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
    }

    .book-card {
      position: relative;
      border-radius: 18px;
      background: #ffffff;
      border: 3px solid #e6f0f8;
      padding: 6px 4px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      box-shadow: 0 4px 0 rgba(52, 69, 92, 0.06);
      transition: transform 0.15s ease;
    }

    .book-card:active {
      transform: scale(0.95);
    }

    .book-card.locked {
      background: #eef4f9;
      border-color: #dde9f3;
    }

    .book-card .time-dot {
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 12px;
      opacity: 0.85;
    }

    .book-card .book-art {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 2px;
    }

    .book-card .book-art svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .book-card .book-name {
      font-size: clamp(11px, 2.8vw, 14px);
      color: #3b5068;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      padding: 0 2px;
    }

    .book-card.locked .book-name {
      color: #a8bccd;
    }

    .book-card.just-unlocked {
      animation: card-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-color: #ffc400;
    }

    @keyframes card-pop {
      0% { transform: scale(0.8); }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .book-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 16px calc(var(--safe-bottom) + 18px);
      gap: 2px;
    }

    .locked-egg {
      width: 78%;
      opacity: 0.75;
    }

    /* ============ 오버레이 / 모달 ============ */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(30, 45, 70, 0.38);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .overlay[hidden] {
      display: none;
    }

    .overlay.show {
      opacity: 1;
    }

    .modal-card {
      width: min(430px, 92vw);
      background: #ffffff;
      border-radius: 32px;
      border: 5px solid #ffd9e0;
      padding: 24px 20px 20px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(20, 40, 70, 0.32);
      transform: scale(0.86);
      transition: transform 0.26s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin: auto;
    }

    .overlay.show .modal-card {
      transform: scale(1);
    }

    .modal-card h2 {
      font-size: clamp(24px, 6vw, 30px);
      color: #2b4365;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .modal-card p {
      font-size: 16px;
      color: #6a8199;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .result-stars {
      font-size: clamp(30px, 8vw, 42px);
      letter-spacing: 4px;
      margin-bottom: 4px;
      animation: soft-bounce 1.6s ease-in-out infinite;
    }

    .golden-line {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff6d6;
      border: 3px solid #ffd93b;
      color: #8a6400;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 15px;
      margin-bottom: 12px;
      animation: soft-bounce 2s ease-in-out infinite;
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-top: 4px;
    }

    .result-actions .big-btn {
      min-height: 56px;
      font-size: clamp(18px, 4.6vw, 22px);
    }

    .toast-layer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--safe-bottom) + 86px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: #ffffff;
      border: 3px solid #ffd93b;
      color: #7c5500;
      border-radius: 999px;
      padding: 7px 20px;
      font-size: 16px;
      box-shadow: 0 8px 18px rgba(40, 60, 90, 0.18);
      animation: toast-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both, toast-out 0.35s ease 1.35s both;
      white-space: nowrap;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(14px) scale(0.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toast-out {
      to { opacity: 0; transform: translateY(-10px) scale(0.95); }
    }

    @media (min-width: 760px) {
      .place-list { gap: 18px; }
      .book-grid { grid-template-columns: repeat(6, 1fr); }
    }

    @media (max-height: 520px) {
      .title-content { padding-bottom: 2vh; }
      .title-dinos { display: none; }
      .title-logo { font-size: clamp(30px, 7vw, 44px); }
      #titleBook { display: none; }
      .spot { width: clamp(58px, 11vw, 92px); }
      .spot .twinkle { width: 9px; height: 9px; }
      .name-tag {
        top: -2%;
        bottom: auto;
        transform: translate(-50%, -100%);
        font-size: 12px;
        padding: 0 9px;
      }
      .hint-pill { display: none; }
      .modal-card {
        padding: 16px 16px 14px;
        border-width: 4px;
      }
      .modal-card h2 { font-size: 22px; margin-bottom: 5px; }
      .modal-card p { font-size: 14px; margin-bottom: 8px; }
      .result-stars { font-size: 26px; letter-spacing: 2px; margin-bottom: 0; }
      .golden-line { font-size: 13px; padding: 3px 12px; margin-bottom: 6px; }
      .result-actions { gap: 6px; }
      .result-actions .big-btn { min-height: 46px; font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001s !important;
      }
    }
  </style>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div id="app">
    <!-- ================= 타이틀 ================= -->
    <section id="titleScreen" class="screen active">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="title-hill"></div>
      <div class="title-hill h2"></div>
      <div class="title-dinos" id="titleDinos" aria-hidden="true"></div>

      <div class="title-topbar">
        <a class="home-link" href="../../index.html" aria-label="놀이터 홈으로">🏠 놀이터</a>
        <button class="icon-btn" id="titleSound" type="button" aria-label="소리 켜기/끄기">🔊</button>
      </div>

      <div class="title-content">
        <span class="title-kicker">🦕 까꿍! 숨은 공룡을 찾아요</span>
        <h1 class="title-logo">숨바꼭질<br><span>공룡 친구들</span></h1>
        <p class="title-sub">숲 · 초원 · 호수에서 만나요</p>
        <button id="startBtn" class="big-btn primary" type="button">모험 시작! 🦖</button>
        <div class="title-progress" id="titleProgress">도감 0 / 30 · 하트 0 / 90</div>
        <button id="titlePlayground" class="text-btn" type="button" hidden>🦕 공룡 놀이터</button>
        <button id="titleBook" class="text-btn" type="button">📖 공룡 도감 보기</button>
      </div>
    </section>

    <!-- ================= 장소 선택 ================= -->
    <section id="mapScreen" class="screen">
      <header class="page-head">
        <button id="mapBack" class="icon-btn" type="button" aria-label="뒤로">←</button>
        <h2>어디로 놀러 갈까요?</h2>
        <button class="icon-btn" type="button" tabindex="-1" aria-hidden="true">🔊</button>
      </header>

      <div class="time-pill">
        <button class="tp" id="mapDay" type="button">☀️ 낮</button>
        <button class="tp" id="mapNight" type="button">🌙 밤</button>
      </div>

      <div class="place-list" id="placeList"></div>

      <button class="care-shortcut" id="careShortcut" type="button">
        <span class="cs-emoji" aria-hidden="true">🦕</span>
        <span class="cs-info">
          <strong>공룡 놀이터</strong>
          <small id="csSub">발견한 친구를 돌봐요</small>
        </span>
        <span class="cs-badge" id="csBadge">0</span>
      </button>

      <div class="map-footer">
        <div class="map-progress" id="mapProgress">도감 0 / 30</div>
        <button id="mapBook" class="text-btn" type="button">📖 공룡 도감 보기</button>
        <button id="mapSound" class="text-btn" type="button">🔊 소리 켜짐</button>
      </div>
    </section>

    <!-- ================= 게임 ================= -->
    <section id="gameScreen" class="screen">
      <div class="scene" id="scene" data-scene="forest" data-time="day">
        <div class="sky"></div>
        <div class="stars" id="stars" aria-hidden="true"></div>
        <div class="orb" aria-hidden="true"></div>

        <div class="cloud-drift a" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="base"></span></div>
        <div class="cloud-drift b" aria-hidden="true"><i></i><i></i><i></i><i></i><span class="base"></span></div>

        <div class="landscape" id="landscape" aria-hidden="true"></div>
        <div class="spots" id="spots"></div>
      </div>

      <header class="hud">
        <button id="gameBack" class="round-btn" type="button" aria-label="장소 선택으로">←</button>
        <div class="hud-center">
          <span class="scene-name" id="hudSceneName">쥬라기 숲</span>
          <span class="counter-pill" id="hudCounter" aria-live="polite">0 / 5</span>
        </div>
        <button id="gameSound" class="round-btn" type="button" aria-label="소리 켜기/끄기">🔊</button>
      </header>

      <div class="hud-bottom">
        <button id="gameBook" class="round-btn" type="button" aria-label="공룡 도감">📖</button>
        <div class="hint-pill" id="hintText">흔들리는 곳을 콕! 눌러보세요</div>
        <button id="timeToggle" class="round-btn wide" type="button" aria-label="낮과 밤 바꾸기">🌙</button>
      </div>
    </section>

    <!-- ================= 도감 ================= -->
    <section id="bookScreen" class="screen">
      <header class="page-head">
        <button id="bookBack" class="icon-btn" type="button" aria-label="뒤로">←</button>
        <h2>공룡 도감</h2>
        <button id="bookSound" class="icon-btn" type="button" aria-label="소리 켜기/끄기">🔊</button>
      </header>

      <div class="book-total">
        <div class="bar"><i id="bookBar"></i></div>
        <span class="book-count" id="bookCount">0 / 30 · ♥ 0 / 90</span>
      </div>

      <div class="book-tabs" id="bookTabs"></div>
      <div class="book-grid" id="bookGrid"></div>

      <div class="book-footer">
        <button id="resetBtn" class="text-btn danger" type="button">기록 지우기</button>
      </div>
    </section>

    <!-- ================= 공룡 놀이터 ================= -->
    <section id="playgroundScreen" class="screen">
      <header class="page-head">
        <button id="pgBack" class="icon-btn" type="button" aria-label="뒤로">←</button>
        <h2>공룡 놀이터</h2>
        <button id="pgSound" class="icon-btn" type="button" aria-label="소리 켜기/끄기">🔊</button>
      </header>

      <div class="pg-summary">
        <div class="bar"><i id="pgBar"></i></div>
        <span class="pg-heart-count" id="pgHeartCount">하트 0 / 90</span>
      </div>

      <div class="book-tabs pg-tabs" id="pgTabs"></div>
      <div class="pg-grid" id="pgGrid"></div>

      <div class="pg-footer">
        <button id="pgBook" class="text-btn" type="button">📖 공룡 도감 보기</button>
      </div>
    </section>

    <!-- ================= 돌봄 ================= -->
    <section id="careScreen" class="screen">
      <header class="page-head care-head">
        <button id="careBack" class="icon-btn" type="button" aria-label="놀이터로">←</button>
        <div class="care-title">
          <h2 id="careName">공룡</h2>
          <div class="hearts" id="careHearts" aria-label="친밀도"></div>
        </div>
        <button id="careSound" class="icon-btn" type="button" aria-label="소리 켜기/끄기">🔊</button>
      </header>

      <div class="care-scroll">
        <div class="care-steps" id="careSteps"></div>

        <div class="care-stage" id="careStage">
          <div class="care-dino" id="careDino"></div>
          <div class="care-fx" id="careFx" aria-hidden="true"></div>
        </div>

        <div class="fact-bubble" id="careFact" aria-live="polite"></div>
        <div class="care-panel" id="carePanel"></div>
      </div>
    </section>

    <div class="overlay" id="overlay" hidden></div>
    <div class="toast-layer" id="toastLayer" aria-live="polite"></div>
  </div>

  <script src="game-data.js" defer></script>
  <script src="game-art.js" defer></script>
  <script src="game-core.js" defer></script>
</body>
</html>
