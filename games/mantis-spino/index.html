<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="째깍 크아앙! 놀이 싸움">
  <title>⚡ 째깍 크아앙! 놀이 싸움</title>

  <script>
    (function () {
      if (location.protocol === 'file:') return;
      var p = location.pathname;
      if (/\/$/.test(p) || /\.html?$/.test(p)) return;
      location.replace(p + '/' + location.search + location.hash);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="top-bar">
    <a class="nav-home" href="../../index.html" aria-label="놀이터로 돌아가기">
      <span>🏠</span>
      <span>놀이터</span>
    </a>
    <h1 class="app-title"><span>⚡</span> 째깍 크아앙! 놀이 싸움</h1>
    <div class="top-right">
      <button class="btn-icon" id="btnSound" type="button" aria-label="소리 켜기/끄기">🔊</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="gameCanvas" aria-label="사마귀와 친구들의 놀이 싸움"></canvas>

    <!-- 내 친구 · 적 친구 고르기 -->
    <section class="select-screen is-on" id="selectScreen">
      <div class="select-head">
        <h2>누구랑 누가 겨룰까?</h2>
        <p>내 친구와 적 친구를 골라요</p>
      </div>

      <div class="pick-scroll">
        <div class="pick-block">
          <h3>내 친구</h3>
          <div class="pick-row" id="myRow"></div>
        </div>
        <div class="pick-block">
          <h3>적 친구</h3>
          <div class="pick-row" id="enemyRow"></div>
        </div>
      </div>

      <button class="start-btn" id="btnStart" type="button">
        겨루기 시작! <span>⚡</span>
      </button>
    </section>

    <!-- 공격 버튼 (캐릭터별 3개) -->
    <div class="attack-bar" id="attackBar" aria-label="공격 기술"></div>

    <!-- 소프트 엔딩 -->
    <div class="ending-overlay" id="endingOverlay">
      <div class="ending-card">
        <div class="ending-ornament">⭐💛⭐</div>
        <h2>잘 겨뤘어!</h2>
        <p>폭신! 다 같이 깔깔 웃었어요</p>
        <div class="ending-actions">
          <button class="btn-pill btn-again" id="btnAgain" type="button">또! 🔁</button>
          <button class="btn-pill btn-change" id="btnChange" type="button">친구 바꾸기 🐾</button>
        </div>
        <a class="rest-link" href="../../index.html">쉬자 🏠</a>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
