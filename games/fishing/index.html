<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="바다 낚시">
  <title>🎣 두근두근 바다 낚시 놀이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: "Jua", "Malgun Gothic", sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, #3aa8f7 0%, #1572c8 50%, #0a4382 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 상단 네비게이션 & 미션 바 (HUD) */
    .hud-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: max(8px, env(safe-area-inset-top)) 12px 8px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      border-bottom: 4px solid #bce1ff;
      z-index: 50;
      color: #244163;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f0f6fc;
      color: #2b5c8f;
      text-decoration: none;
      font-size: clamp(14px, 3.2vw, 17px);
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 20px;
      border: 2px solid #c9e0f7;
      box-shadow: 0 3px 0 #b0d2f3;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #b0d2f3;
    }

    /* 타겟 물고기 미션 카드 */
    .mission-box {
      flex: 1;
      max-width: 480px;
      margin: 0 auto;
      background: #eff7ff;
      border: 3px solid #6cbcf8;
      border-radius: 24px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04);
    }

    .mission-target-fish {
      flex-shrink: 0;
      width: clamp(62px, 14vw, 84px);
      height: clamp(46px, 10vw, 58px);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.15));
      animation: target-bob 2s infinite ease-in-out;
    }

    .mission-target-fish svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes target-bob {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.08) translateY(-3px); }
    }

    .mission-text-wrap {
      text-align: left;
    }

    .mission-sub {
      font-size: clamp(11px, 2.4vw, 13px);
      color: #0284c7;
      font-weight: 700;
    }

    .mission-name {
      font-size: clamp(17px, 3.8vw, 24px);
      color: #1e3a5f;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .speak-mission-btn {
      background: #ffffff;
      border: 2px solid #bae6fd;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 2px 0 #93c5fd;
    }

    .speak-mission-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 진행도 (잡은 물고기 수) */
    .score-badge {
      background: #fffae0;
      border: 2px solid #ffd43b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: clamp(15px, 3.4vw, 20px);
      font-weight: 800;
      color: #e67700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 #fcc419;
      white-space: nowrap;
    }

    /* 바닷속 수조 영역 */
    .sea-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .sun-rays {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 65%;
      background: repeating-linear-gradient(
        75deg,
        rgba(255, 255, 255, 0.08) 0px,
        rgba(255, 255, 255, 0.08) 40px,
        transparent 40px,
        transparent 90px
      );
      pointer-events: none;
    }

    .sea-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: linear-gradient(180deg, #d4a373 0%, #bc8a5f 100%);
      border-top: 6px solid #e9c46a;
      pointer-events: none;
      z-index: 5;
    }

    /* 우측 하단: 나의 미니 어항 바구니 (터치 시 나만의 수족관 오픈!) */
    .fish-bowl {
      position: absolute;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      width: clamp(76px, 16vw, 105px);
      height: clamp(76px, 16vw, 105px);
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.95), rgba(200, 235, 255, 0.6) 70%, rgba(130, 205, 255, 0.75) 100%);
      border: 4px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3), inset 0 -6px 12px rgba(10, 80, 160, 0.25);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fish-bowl:active {
      transform: scale(0.92);
    }

    .fish-bowl.bounce-bowl {
      animation: bowl-pop 0.45s ease-out;
    }

    @keyframes bowl-pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.22) rotate(-5deg); }
      70% { transform: scale(0.95) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .fish-bowl-water {
      position: absolute;
      bottom: 6px;
      width: 82%;
      height: 55%;
      background: rgba(56, 189, 248, 0.45);
      border-radius: 0 0 50px 50px;
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 4px;
    }

    .bowl-icon {
      font-size: 20px;
      animation: bowl-fish-bob 1.5s infinite ease-in-out;
    }

    @keyframes bowl-fish-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .bowl-label {
      position: absolute;
      top: -12px;
      background: #ffecb3;
      color: #925400;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 800;
      border: 1px solid #ffd54f;
      white-space: nowrap;
      animation: pulse-bowl-label 1.8s infinite ease-in-out;
    }

    @keyframes pulse-bowl-label {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); background: #ffe082; }
    }

    /* 심해 배경 깜짝 친구들: 고래 & 거북이 (z-index: 4) */
    .bg-creature {
      position: absolute;
      z-index: 4;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      transition: filter 0.2s ease;
      filter: drop-shadow(0 6px 16px rgba(0, 30, 70, 0.35));
    }
    .bg-creature:active {
      transform: scale(1.08);
    }
    .bg-creature svg {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* 고래 물분수 (Rainbow Water Fountain) */
    .fountain-spray {
      position: absolute;
      pointer-events: none;
      z-index: 60;
      transform: translate(-50%, -100%);
      animation: spray-fountain 1.3s forwards ease-out;
      font-size: 38px;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    @keyframes spray-fountain {
      0% { transform: translate(-50%, 0) scale(0.2); opacity: 0; }
      20% { transform: translate(-50%, -35px) scale(1); opacity: 1; }
      65% { transform: translate(-50%, -65px) scale(1.25); opacity: 0.95; }
      100% { transform: translate(-50%, -85px) scale(1.4); opacity: 0; }
    }

    /* 상단 HUD 스테이지 배지 */
    .stage-pill {
      background: linear-gradient(135deg, #ff8a65 0%, #ff5722 100%);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: clamp(11px, 2.5vw, 13px);
      font-weight: 800;
      box-shadow: 0 2px 4px rgba(255, 87, 34, 0.3);
      white-space: nowrap;
    }

    /* 나만의 수족관 모달 (Aquarium Modal) */
    .aquarium-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 19, 38, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 120;
      padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .aquarium-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .aquarium-box {
      width: min(96vw, 680px);
      height: min(88vh, 560px);
      background: linear-gradient(180deg, #1e6091 0%, #184e77 60%, #1a759f 100%);
      border: 6px solid #ffd166;
      border-radius: 36px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .aquarium-overlay.active .aquarium-box {
      transform: scale(1);
    }

    .aquarium-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.15);
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    }
    .aquarium-title {
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }
    .aquarium-close-btn {
      background: #ff595e;
      color: #ffffff;
      border: none;
      font-family: inherit;
      font-size: clamp(14px, 3.2vw, 17px);
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 3px 0 #d90429;
      cursor: pointer;
    }
    .aquarium-close-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .aquarium-tank {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      touch-action: none;
      background: radial-gradient(circle at 50% 30%, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
    }

    .aquarium-hint {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.45);
      color: #fffae0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: clamp(12px, 2.8vw, 14px);
      font-weight: 700;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
    }

    /* 수족관 먹이 (별사탕) */
    .fish-food {
      position: absolute;
      pointer-events: none;
      font-size: 22px;
      z-index: 15;
      animation: food-sink 2.2s forwards ease-in;
    }
    @keyframes food-sink {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(220px) rotate(360deg); opacity: 0.2; }
    }

    /* 수족관 물고기 */
    .aquarium-fish {
      position: absolute;
      cursor: pointer;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
      transition: transform 0.15s ease;
      touch-action: manipulation;
      z-index: 5;
    }
    .aquarium-fish:active {
      transform: scale(1.25) !important;
    }

    /* 공기 방울 (터치 인터랙션 지원) */
    .bubble {
      position: absolute;
      bottom: 10px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.2));
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      cursor: pointer;
      touch-action: manipulation;
      animation: rise-bubble linear infinite;
      z-index: 8;
    }

    .bubble:active {
      transform: scale(1.3);
    }

    @keyframes rise-bubble {
      0% {
        transform: translateY(0) scale(0.7);
        opacity: 0;
      }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% {
        transform: translateY(-92vh) scale(1.2);
        opacity: 0;
      }
    }

    /* 수영하는 물고기 공통 */
    .fish-swimmer {
      position: absolute;
      cursor: pointer;
      z-index: 10;
      user-select: none;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.22));
      transition: filter 0.15s ease;
      touch-action: manipulation;
    }

    .fish-swimmer svg {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* 물보라 (Splash Effect) */
    .splash-ring {
      position: absolute;
      pointer-events: none;
      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: splash-expand 0.5s forwards ease-out;
      z-index: 60;
    }

    @keyframes splash-expand {
      0% { width: 10px; height: 10px; opacity: 1; border-width: 5px; }
      100% { width: 100px; height: 100px; opacity: 0; border-width: 1px; }
    }

    /* 뜰채(Net) 그래픽 */
    .fishing-net {
      position: absolute;
      pointer-events: none;
      width: 72px;
      height: 72px;
      transform: translate(-50%, -50%) scale(0.4);
      z-index: 70;
      animation: net-swoop 0.45s forwards cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    @keyframes net-swoop {
      0% { transform: translate(-50%, -100px) scale(0.5); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%, -70px) scale(0.9); opacity: 0; }
    }

    /* 어항으로 날아가는 모션 (포물선 비행) */
    .flying-fish {
      position: fixed;
      pointer-events: none;
      z-index: 85;
      transition: all 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.3));
    }

    /* 먹물 뿜기 효과 */
    .ink-cloud {
      position: absolute;
      pointer-events: none;
      background: radial-gradient(circle, rgba(20, 20, 30, 0.88) 0%, rgba(20, 20, 30, 0) 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: ink-spread 1.6s forwards ease-out;
      z-index: 15;
    }

    @keyframes ink-spread {
      0% { width: 20px; height: 20px; opacity: 0.9; }
      50% { width: 140px; height: 140px; opacity: 0.8; }
      100% { width: 190px; height: 190px; opacity: 0; }
    }

    /* 성공 파티클 */
    .particle {
      position: absolute;
      pointer-events: none;
      font-size: 24px;
      z-index: 90;
      animation: particle-pop 0.7s forwards ease-out;
    }

    @keyframes particle-pop {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
    }

    /* 오답 흔들림 */
    .wrong-wiggle {
      animation: wrong-shake 0.4s ease-in-out;
    }

    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-14px) rotate(-8deg); }
      40%, 80% { transform: translateX(14px) rotate(8deg); }
    }

    /* 성공 축하 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 28, 52, 0.78);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 36px;
      border: 6px solid #ffd43b;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      color: #2b4365;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-emoji {
      font-size: 64px;
      margin-bottom: 12px;
      animation: celebration-bounce 1s infinite alternate ease-in-out;
    }

    @keyframes celebration-bounce {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.15) translateY(-10px); }
    }

    .modal-title {
      font-size: clamp(26px, 5vw, 34px);
      margin-bottom: 8px;
      color: #1e3a5f;
    }

    .modal-desc {
      font-size: 18px;
      color: #5c7493;
      margin-bottom: 24px;
    }

    .modal-btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-action {
      font-family: inherit;
      font-size: 20px;
      font-weight: 800;
      padding: 14px 24px;
      border-radius: 28px;
      border: none;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.15);
      transition: all 0.12s ease;
    }

    .btn-next {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 5px 0 #059669;
    }
    .btn-next:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #059669;
    }

    .btn-lobby {
      background: #e2e8f0;
      color: #475569;
      box-shadow: 0 4px 0 #cbd5e1;
      text-decoration: none;
      display: inline-block;
    }
    .btn-lobby:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #cbd5e1;
    }
  </style>
</head>
<body>
  <!-- 상단 HUD 바 -->
  <header class="hud-bar">
    <div class="nav-left">
      <a href="../../index.html" class="home-btn" title="놀이터 홈으로">🏠 놀이터</a>
      <span class="stage-pill" id="stagePill">1단계 🐡</span>
    </div>

    <!-- 미션 타겟 -->
    <div class="mission-box" id="missionBox">
      <div class="mission-target-fish" id="targetFishGraphic"></div>
      <div class="mission-text-wrap">
        <div class="mission-sub" id="missionSub">느리고 커다란 복어를 잡아보아요!</div>
        <div class="mission-name">
          <span id="targetFishName">노란 통통 복어</span>
          <button type="button" class="speak-mission-btn" id="speakMissionBtn" title="이름 듣기">🔊</button>
        </div>
      </div>
    </div>

    <!-- 점수 / 진행 -->
    <div class="score-badge" id="scoreBadge">
      <span>⭐</span>
      <span id="scoreText">0 / 3</span>
    </div>
  </header>

  <!-- 바닷속 플레이 공간 -->
  <main class="sea-container" id="seaArea">
    <div class="sun-rays"></div>
    <div id="bgCreaturesGroup"></div>
    <div class="sea-floor"></div>

    <!-- 내 미니 어항 바구니 (누르면 수족관 오픈!) -->
    <div class="fish-bowl" id="fishBowl" title="내 수족관 열기">
      <span class="bowl-label">내 어항 🫧</span>
      <div class="fish-bowl-water" id="bowlWater"></div>
    </div>
  </main>

  <!-- 나만의 수족관 모달 -->
  <div class="aquarium-overlay" id="aquariumModal">
    <div class="aquarium-box">
      <div class="aquarium-header">
        <div class="aquarium-title">✨ 나의 반짝반짝 수족관 🫧</div>
        <button type="button" class="aquarium-close-btn" id="closeAquariumBtn">바다로 나가기 ✖</button>
      </div>
      <div class="aquarium-tank" id="aquariumTank">

    function triggerHaptic(type = 'light') {
      if (!('vibrate' in navigator)) return;
      try {
        if (type === 'light') {
          navigator.vibrate(20);
        } else if (type === 'catch') {
          navigator.vibrate([30, 40, 50]);
        } else if (type === 'bonus') {
          navigator.vibrate([30, 30, 40, 40, 70]);
        } else if (type === 'wrong') {
          navigator.vibrate([50, 40, 50]);
        } else if (type === 'ink') {
          navigator.vibrate([70, 30, 70]);
        }

      resumeAudio();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const start = audioCtx.currentTime + idx * 0.08;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.2, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.32);
      });
    }

      {

        goal: 4,

        unlockedIds: ['puffer', 'clownfish', 'bluetang'],

        level: 4,

        title: '분홍 날개 엔젤피쉬',
        sub: '빠르게 헤엄치는 예쁜 엔젤피쉬를 잡아요!',
        speakPrompt: '빠르게 헤엄치는 분홍색 날개 엔젤피쉬를 잡아보세요!',
        goal: 4,
        speedMult: 1.45,
        sizeMult: 0.95,
        unlockedIds: ['puffer', 'clownfish', 'bluetang', 'angelfish', 'greenfish'],
        allowGolden: true,
        allowOctopus: true,
        nextMsg: '최고예요! 온 바다 친구들이 모두 모여 대축제를 열어요!'
      },
      {
        level: 5,
        name: '5단계 🌊',
        targetId: 'all',
        title: '신나는 바다 대축제!',
        sub: '바닷속 모든 물고기를 자유롭게 잡아보아요!',
        speakPrompt: '신나는 바다 대축제! 마음에 드는 물고기를 자유롭게 잡아보세요!',
        goal: 5,
        speedMult: 1.5,
        sizeMult: 1.0,
        unlockedIds: ['puffer', 'clownfish', 'bluetang', 'angelfish', 'greenfish'],
        allowGolden: true,
        allowOctopus: true,
        nextMsg: '바다 낚시 마스터 달성! 👑 내 어항에서 친구들과 놀아보아요!'
      }
    ];

    // ==========================================
    // 5. 게임 상태 관리
    // ==========================================
    let currentStageIdx = 0;
    let currentTarget = null;
    let targetGoal = 3;
    let currentScore = 0;
    let activeFishList = [];
    let animationFrameId = null;
    let caughtFishHistory = []; // 지금까지 잡은 물고기들 (수족관용)

    // DOM 참조
    const seaArea = document.getElementById('seaArea');
    const stagePill = document.getElementById('stagePill');
    const missionSub = document.getElementById('missionSub');
    const targetFishGraphic = document.getElementById('targetFishGraphic');
    const targetFishName = document.getElementById('targetFishName');
    const scoreText = document.getElementById('scoreText');
    const successModal = document.getElementById('successModal');
    const successTitle = document.getElementById('successTitle');
    const successDesc = document.getElementById('successDesc');
    const successEmoji = document.getElementById('successEmoji');
    const btnNextRound = document.getElementById('btnNextRound');
    const btnOpenAquariumFromModal = document.getElementById('btnOpenAquariumFromModal');
    const speakMissionBtn = document.getElementById('speakMissionBtn');
    const fishBowl = document.getElementById('fishBowl');
    const bowlWater = document.getElementById('bowlWater');
    const bgCreaturesGroup = document.getElementById('bgCreaturesGroup');

    // 수족관 DOM
    const aquariumModal = document.getElementById('aquariumModal');
    const aquariumTank = document.getElementById('aquariumTank');
    const closeAquariumBtn = document.getElementById('closeAquariumBtn');
    const aquariumTotalCount = document.getElementById('aquariumTotalCount');

    // TTS 읽어주기
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = 0.95;
      utter.pitch = 1.25;
      window.speechSynthesis.speak(utter);
    }

    speakMissionBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const stage = STAGES[currentStageIdx];
      speakText(stage.speakPrompt);
    });

    // ==========================================
    // 6. 공기 방울 터뜨리기 인터랙션
    // ==========================================
    function createBubble() {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = Math.random() * 22 + 14;
      b.style.width = `${size}px`;
      b.style.height = `${size}px`;
      b.style.left = `${Math.random() * 92}%`;
      const dur = Math.random() * 4 + 4;
      b.style.animationDuration = `${dur}s`;

      b.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        popBubble(e.clientX, e.clientY, b);
      });

      b.addEventListener('animationiteration', () => {
        b.style.left = `${Math.random() * 92}%`;
      });

      seaArea.appendChild(b);
    }

    function initBubbles() {
      for (let i = 0; i < 14; i++) {
        createBubble();
      }
    }

    function popBubble(x, y, elem) {
      playBubblePopSound();
      triggerHaptic('light');

      for (let i = 0; i < 5; i++) {
        const drop = document.createElement('div');
        drop.className = 'particle';
        drop.textContent = '🫧';
        drop.style.left = `${x}px`;
        drop.style.top = `${y}px`;
        drop.style.fontSize = '16px';
        const angle = (Math.PI * 2 / 5) * i;
        drop.style.setProperty('--dx', `${Math.cos(angle) * 35}px`);
        drop.style.setProperty('--dy', `${Math.sin(angle) * 35}px`);
        document.body.appendChild(drop);
        setTimeout(() => drop.remove(), 500);
      }

      elem.remove();
      setTimeout(createBubble, 800);
    }

    // ==========================================
    // 7. 손맛 이펙트 (물보라 + 뜰채 + 어항 날아가기)
    // ==========================================
    function showSplash(x, y) {
      playSplashSound();

      const ring = document.createElement('div');
      ring.className = 'splash-ring';
      ring.style.left = `${x}px`;
      ring.style.top = `${y}px`;
      seaArea.appendChild(ring);
      setTimeout(() => ring.remove(), 550);

      const net = document.createElement('div');
      net.className = 'fishing-net';
      net.style.left = `${x}px`;
      net.style.top = `${y}px`;
      net.innerHTML = `
        <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <circle cx="36" cy="36" r="28" fill="rgba(255,255,255,0.4)" stroke="#ff7043" stroke-width="4" stroke-dasharray="4,4" />
          <line x1="56" y1="56" x2="78" y2="78" stroke="#8d6e63" stroke-width="6" stroke-linecap="round" />
        </svg>
      `;
      seaArea.appendChild(net);
      setTimeout(() => net.remove(), 500);
    }

    function flyFishToBowl(startX, startY, species) {
      const bowlRect = fishBowl.getBoundingClientRect();
      const targetX = bowlRect.left + bowlRect.width / 2;
      const targetY = bowlRect.top + bowlRect.height / 2;

      const flyer = document.createElement('div');
      flyer.className = 'flying-fish';
      flyer.style.width = '60px';
      flyer.style.height = '42px';
      flyer.style.left = `${startX - 30}px`;
      flyer.style.top = `${startY - 21}px`;
      flyer.innerHTML = species.svg;
      document.body.appendChild(flyer);

      requestAnimationFrame(() => {
        flyer.style.transform = `translate(${targetX - startX}px, ${targetY - startY}px) scale(0.4) rotate(45deg)`;
        flyer.style.opacity = '0.7';
      });

      setTimeout(() => {
        flyer.remove();
        fishBowl.classList.remove('bounce-bowl');
        void fishBowl.offsetWidth;
        fishBowl.classList.add('bounce-bowl');

        const mini = document.createElement('span');
        mini.className = 'bowl-icon';
        mini.textContent = species.icon || '🐟';
        bowlWater.appendChild(mini);
      }, 650);
    }

    function spawnParticles(x, y) {
      const items = ['✨', '⭐', '🫧', '🌟'];
      for (let i = 0; i < 7; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = items[Math.floor(Math.random() * items.length)];
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;
        const angle = (Math.PI * 2 / 7) * i;
        const dist = Math.random() * 60 + 40;
        p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 700);
      }
    }

    // ==========================================
    // 8. 심해 배경 깜짝 친구들 (고래 🐋 & 거북이 🐢)
    // ==========================================
    class BgCreature {
      constructor(type) {
        this.type = type; // 'whale' | 'turtle'
        const bounds = seaArea.getBoundingClientRect();
        this.dir = Math.random() > 0.5 ? 1 : -1;
        this.speed = (type === 'whale' ? 0.75 : 0.9) * this.dir;

        this.width = type === 'whale' ? 160 : 130;
        this.height = type === 'whale' ? 100 : 90;
        this.x = this.dir === 1 ? -this.width - 40 : bounds.width + 40;
        this.y = Math.random() * (bounds.height - 240) + 40;
        this.wave = Math.random() * Math.PI * 2;

        this.el = document.createElement('div');
        this.el.className = 'bg-creature';
        this.el.style.width = `${this.width}px`;
        this.el.style.height = `${this.height}px`;
        this.el.innerHTML = type === 'whale' ? BABY_WHALE_SVG : SEA_TURTLE_SVG;

        this.el.addEventListener('pointerdown', (e) => this.onInteract(e));
        bgCreaturesGroup.appendChild(this.el);
      }

      update(width) {
        this.x += this.speed;
        this.wave += 0.02;
        const currentY = this.y + Math.sin(this.wave) * 15;
        const flip = this.dir === -1 ? 'scaleX(-1)' : 'scaleX(1)';
        this.el.style.transform = `translate3d(${this.x}px, ${currentY}px, 0) ${flip}`;

        if (this.dir === 1 && this.x > width + 70) return false;
        if (this.dir === -1 && this.x < -this.width - 70) return false;
        return true;
      }

      onInteract(e) {
        e.stopPropagation();
        triggerHaptic('light');

        if (this.type === 'whale') {
          playWhaleSound();

          // 무지개 물분수 발사 🌈 💦
          const fountain = document.createElement('div');
          fountain.className = 'fountain-spray';
          fountain.style.left = `${this.x + (this.dir === 1 ? this.width * 0.45 : this.width * 0.55)}px`;
          fountain.style.top = `${this.y + 15}px`;
          fountain.innerHTML = '🌊 🌈 ✨ 💖';
          seaArea.appendChild(fountain);
          setTimeout(() => fountain.remove(), 1300);

          this.speed *= 1.8;
          speakText('뿌우우-! 아기 고래가 물분수를 뿜었어요!');
        } else {
          playTurtleSound();

          // 거품 퐁퐁 뿜기 🫧
          for (let i = 0; i < 6; i++) {
            const b = document.createElement('div');
            b.className = 'particle';
            b.textContent = '🫧';
            b.style.left = `${e.clientX}px`;
            b.style.top = `${e.clientY}px`;
            const angle = (Math.PI * 2 / 6) * i;
            b.style.setProperty('--dx', `${Math.cos(angle) * 50}px`);
            b.style.setProperty('--dy', `${Math.sin(angle) * 50}px`);
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 600);
          }

          this.speed *= 2.0;
        }
      }

      destroy() {
        if (this.el && this.el.parentNode) {
          this.el.parentNode.removeChild(this.el);
        }
      }
    }

    let activeBgCreature = null;
    let nextCreatureTimer = 8000; // 8초 뒤 첫 등장

    function checkBgCreature(delta) {
      if (activeBgCreature) {
        const bounds = seaArea.getBoundingClientRect();
        const alive = activeBgCreature.update(bounds.width);
        if (!alive) {
          activeBgCreature.destroy();
          activeBgCreature = null;
          nextCreatureTimer = Math.random() * 10000 + 12000; // 12~22초 뒤 재출현
        }
      } else {
        nextCreatureTimer -= delta;
        if (nextCreatureTimer <= 0) {
          const type = Math.random() > 0.5 ? 'whale' : 'turtle';
          activeBgCreature = new BgCreature(type);
        }
      }
    }

    // ==========================================
    // 9. 헤엄치는 물고기 Swimmer 클래스
    // ==========================================
    class Swimmer {
      constructor(species, role = 'normal') {
        this.species = species;
        this.role = role;

        const stage = STAGES[currentStageIdx];
        const sizeMult = stage.sizeMult || 1.0;
        const speedMult = stage.speedMult || 1.0;

        const bounds = seaArea.getBoundingClientRect();
        this.width = species.width * sizeMult * (Math.random() * 0.12 + 0.94);
        this.height = species.height * sizeMult * (Math.random() * 0.12 + 0.94);

        this.dir = Math.random() > 0.5 ? 1 : -1;
        let baseSpeed = (Math.random() * 0.8 + 1.0) * speedMult;
        if (role === 'golden') baseSpeed *= 1.7;
        if (role === 'octopus') baseSpeed *= 0.8;
        this.speed = baseSpeed * this.dir;

        this.x = this.dir === 1 ? -this.width - 25 : bounds.width + 25;
        this.y = Math.random() * (bounds.height - 210) + 20;
        this.waveOffset = Math.random() * Math.PI * 2;
        this.waveSpeed = Math.random() * 0.03 + 0.02;

        this.el = document.createElement('div');
        this.el.className = 'fish-swimmer';
        this.el.style.width = `${this.width}px`;
        this.el.style.height = `${this.height}px`;
        this.el.innerHTML = species.svg;

        this.el.addEventListener('pointerdown', (e) => this.onInteract(e));
        seaArea.appendChild(this.el);
      }

      update(width, height) {
        this.x += this.speed;
        this.waveOffset += this.waveSpeed;
        const currentY = this.y + Math.sin(this.waveOffset) * 14;

        const flip = this.dir === -1 ? 'scaleX(-1)' : 'scaleX(1)';
        this.el.style.transform = `translate3d(${this.x}px, ${currentY}px, 0) ${flip}`;

        if (this.dir === 1 && this.x > width + 60) return false;
        if (this.dir === -1 && this.x < -this.width - 60) return false;
        return true;
      }

      onInteract(e) {
        e.stopPropagation();
        if (this.caught) return;

        const stage = STAGES[currentStageIdx];
        const isTargetMatch = stage.targetId === 'all' || this.role === 'target';

        // 1) 목표 물고기 잡기
        if (isTargetMatch) {
          this.caught = true;
          triggerHaptic('catch');
          showSplash(e.clientX, e.clientY);
          playChime();
          spawnParticles(e.clientX, e.clientY);
          flyFishToBowl(e.clientX, e.clientY, this.species);

          // 수족관 기록에 추가! ⭐
          caughtFishHistory.push(this.species);

          currentScore++;
          updateScoreDisplay();

          this.el.remove();
          this.destroy();

          setTimeout(() => spawnFish('target'), 800);

          if (currentScore >= targetGoal) {
            setTimeout(showVictory, 700);
          }
        }
        // 2) 황금 물고기
        else if (this.role === 'golden') {
          this.caught = true;
          triggerHaptic('bonus');
          showSplash(e.clientX, e.clientY);
          playChime();
          spawnParticles(e.clientX, e.clientY);
          flyFishToBowl(e.clientX, e.clientY, this.species);

          caughtFishHistory.push(this.species);
          currentScore++;
          updateScoreDisplay();
          speakText('대박! 황금 물고기를 잡았어요!');

          this.el.remove();
          this.destroy();

          if (currentScore >= targetGoal) {
            setTimeout(showVictory, 700);
          }
        }
        // 3) 아기 문어
        else if (this.role === 'octopus') {
          triggerHaptic('ink');
          playOctopusSound();

          const ink = document.createElement('div');
          ink.className = 'ink-cloud';
          ink.style.left = `${e.clientX}px`;
          ink.style.top = `${e.clientY}px`;
          seaArea.appendChild(ink);
          setTimeout(() => ink.remove(), 1600);

          this.speed *= 2.2;
          this.el.classList.add('wrong-wiggle');
        }
        // 4) 다른 물고기 (스트레스 프리 도망)
        else {
          triggerHaptic('wrong');
          playWrongSound();
          this.el.classList.remove('wrong-wiggle');
          void this.el.offsetWidth;
          this.el.classList.add('wrong-wiggle');
          this.speed *= 1.4;
        }
      }

      destroy() {
        if (this.el && this.el.parentNode) {
          this.el.parentNode.removeChild(this.el);
        }
        const idx = activeFishList.indexOf(this);
        if (idx !== -1) activeFishList.splice(idx, 1);
      }
    }

    function updateScoreDisplay() {
      scoreText.textContent = `${currentScore} / ${targetGoal}`;
    }

    // 물고기 스폰 제어 (스테이지별 잠금 해제 반영)
    function spawnFish(forcedRole = null) {
      const stage = STAGES[currentStageIdx];
      let role = forcedRole;
      let species;

      if (!role) {
        const rand = Math.random();
        if (rand < 0.38) {
          role = 'target';
        } else if (stage.allowGolden && rand < 0.46) {
          role = 'golden';
        } else if (stage.allowOctopus && rand < 0.54) {
          role = 'octopus';
        } else {
          role = 'normal';
        }
      }

      // 스테이지에서 해금된 물고기 풀
      const unlockedSpeciesList = FISH_SPECIES.filter(s => stage.unlockedIds.includes(s.id));

      if (role === 'target') {
        if (stage.targetId === 'all') {
          species = unlockedSpeciesList[Math.floor(Math.random() * unlockedSpeciesList.length)];
        } else {
          species = FISH_SPECIES.find(s => s.id === stage.targetId) || unlockedSpeciesList[0];
        }
      } else if (role === 'golden') {
        species = GOLDEN_FISH;
      } else if (role === 'octopus') {
        species = BABY_OCTOPUS;
      } else {
        const others = unlockedSpeciesList.filter(s => s.id !== (currentTarget ? currentTarget.id : null));
        species = others.length > 0 ? others[Math.floor(Math.random() * others.length)] : unlockedSpeciesList[0];
      }

      const fish = new Swimmer(species, role);
      activeFishList.push(fish);
    }

    let lastTime = performance.now();
    function gameLoop(time) {
      const delta = time - lastTime;
      lastTime = time;

      const bounds = seaArea.getBoundingClientRect();

      // 배경 생물 업데이트
      checkBgCreature(delta);

      // 물고기 업데이트
      for (let i = activeFishList.length - 1; i >= 0; i--) {
        const fish = activeFishList[i];
        if (!fish.caught) {
          const alive = fish.update(bounds.width, bounds.height);
          if (!alive) {
            fish.destroy();
            spawnFish();
          }
        }
      }

      const maxFish = Math.min(10, Math.max(6, Math.floor(bounds.width / 110)));
      if (activeFishList.length < maxFish) {
        spawnFish();
      }

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    // ==========================================
    // 10. 스테이지 시작 & 클리어 로직
    // ==========================================
    function startStage(stageIdx) {
      currentStageIdx = stageIdx % STAGES.length;
      const stage = STAGES[currentStageIdx];

      successModal.classList.remove('active');
      currentScore = 0;
      targetGoal = stage.goal;
      updateScoreDisplay();

      // 상단 HUD 업데이트
      stagePill.textContent = stage.name;
      missionSub.textContent = stage.sub;

      if (stage.targetId === 'all') {
        targetFishGraphic.innerHTML = `
          <div style="font-size: 34px; display:flex; align-items:center; justify-content:center; width:100%; height:100%;">
            🐠 🐟 🐡
          </div>
        `;
        targetFishName.textContent = stage.title;
        currentTarget = null;
      } else {
        currentTarget = FISH_SPECIES.find(s => s.id === stage.targetId);
        targetFishGraphic.innerHTML = currentTarget.svg;
        targetFishName.textContent = currentTarget.name;
      }

      setTimeout(() => {
        speakText(stage.speakPrompt);
      }, 500);

      // 이전 물고기 정리 후 스테이지에 맞는 물고기 배치
      activeFishList.forEach(f => {
        if (f.el && f.el.parentNode) f.el.parentNode.removeChild(f.el);
      });
      activeFishList = [];

      const bounds = seaArea.getBoundingClientRect();
      const initialCount = Math.min(8, Math.max(5, Math.floor(bounds.width / 130)));
      for (let i = 0; i < initialCount; i++) {
        const role = i < 2 ? 'target' : (stage.allowOctopus && i === 2 ? 'octopus' : 'normal');
        spawnFish(role);
      }
    }

    function showVictory() {
      playFanfare();
      triggerHaptic('bonus');

      const stage = STAGES[currentStageIdx];
      const isLastStage = currentStageIdx >= STAGES.length - 1;

      successTitle.textContent = `${stage.name} 완료! 🎉`;
      successDesc.textContent = stage.nextMsg;
      successEmoji.textContent = '🎉 🏆 🐠 🫧';

      if (isLastStage) {
        btnNextRound.textContent = '신나는 바다 축제 계속하기! 🎣';
      } else {
        const nextStage = STAGES[currentStageIdx + 1];
        btnNextRound.textContent = `${nextStage.name} 하러 가기! ➜`;
      }

      successModal.classList.add('active');
      speakText(`우와! ${stage.name}를 멋지게 클리어했어요!`);
    }

    btnNextRound.addEventListener('click', () => {
      startStage(currentStageIdx + 1);
    });

    // ==========================================
    // 11. 나만의 반짝반짝 수족관 (Aquarium) 시스템
    // ==========================================
    class AquariumSwimmer {
      constructor(species, tankWidth, tankHeight) {
        this.species = species;
        this.width = (species.width || 80) * 0.85;
        this.height = (species.height || 60) * 0.85;

        this.x = Math.random() * (tankWidth - this.width);
        this.y = Math.random() * (tankHeight - this.height);
        this.dir = Math.random() > 0.5 ? 1 : -1;
        this.speed = (Math.random() * 0.8 + 0.8) * this.dir;
        this.targetFood = null;

        this.el = document.createElement('div');
        this.el.className = 'aquarium-fish';
        this.el.style.width = `${this.width}px`;
        this.el.style.height = `${this.height}px`;
        this.el.innerHTML = species.svg;

        // 콕콕 찌르면 간지럼 타며 뾱 튀어오름!
        this.el.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          playTurtleSound();
          triggerHaptic('light');

          this.y -= 25;
          this.speed *= -1.2;
          this.dir = Math.sign(this.speed);

          // 하트 뿅
          const heart = document.createElement('div');
          heart.className = 'particle';
          heart.textContent = '💖';
          heart.style.left = `${e.clientX}px`;
          heart.style.top = `${e.clientY}px`;
          heart.style.setProperty('--dx', '0px');
          heart.style.setProperty('--dy', '-45px');
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 600);
        });

        aquariumTank.appendChild(this.el);
      }

      update(tankWidth, tankHeight, foods) {
        // 가장 가까운 먹이 추적
        if (foods && foods.length > 0) {
          let closest = foods[0];
          let minDist = Math.hypot(closest.x - this.x, closest.y - this.y);
          for (let f of foods) {
            const d = Math.hypot(f.x - this.x, f.y - this.y);
            if (d < minDist) {
              minDist = d;
              closest = f;
            }
          }

          if (minDist < 35 && !closest.eaten) {
            // 먹이 냠냠! 🍩
            closest.eaten = true;
            playYumSound();
            triggerHaptic('light');

            const yum = document.createElement('div');
            yum.className = 'particle';
            yum.textContent = '😋';
            yum.style.left = `${closest.x}px`;
            yum.style.top = `${closest.y}px`;
            yum.style.setProperty('--dx', '0px');
            yum.style.setProperty('--dy', '-35px');
            document.body.appendChild(yum);
            setTimeout(() => yum.remove(), 600);
          } else {
            // 먹이 쪽으로 이동
            const angle = Math.atan2(closest.y - this.y, closest.x - this.x);
            this.x += Math.cos(angle) * 1.6;
            this.y += Math.sin(angle) * 1.6;
            this.dir = Math.cos(angle) > 0 ? 1 : -1;
          }
        } else {
          // 평화롭게 배회
          this.x += this.speed;
          if (this.x < 10) {
            this.x = 10;
            this.speed = Math.abs(this.speed);
            this.dir = 1;
          } else if (this.x > tankWidth - this.width - 10) {
            this.x = tankWidth - this.width - 10;
            this.speed = -Math.abs(this.speed);
            this.dir = -1;
          }
        }

        const flip = this.dir === -1 ? 'scaleX(-1)' : 'scaleX(1)';
        this.el.style.transform = `translate3d(${this.x}px, ${this.y}px, 0) ${flip}`;
      }

      destroy() {
        if (this.el && this.el.parentNode) {
          this.el.parentNode.removeChild(this.el);
        }
      }
    }

    let aquariumFishList = [];
    let aquariumFoodList = [];
    let aquariumAnimId = null;

    function openAquarium() {
      aquariumModal.classList.add('active');
      aquariumTank.innerHTML = '<div class="aquarium-hint">👆 화면을 톡톡 누르면 별사탕 밥을 줄 수 있어요! 🍩</div>';
      aquariumFishList = [];
      aquariumFoodList = [];

      const rect = aquariumTank.getBoundingClientRect();
      const tankWidth = rect.width || 400;
      const tankHeight = rect.height || 300;

      // 지금까지 잡은 물고기들 (최대 14마리까지 전시)
      const listToDisplay = caughtFishHistory.length > 0 
        ? caughtFishHistory.slice(-14)
        : [FISH_SPECIES[0], FISH_SPECIES[1]]; // 아직 안 잡았으면 귀여운 2마리 기본 전시

      aquariumTotalCount.textContent = `지금까지 잡은 물고기: ${caughtFishHistory.length}마리 🏆`;

      listToDisplay.forEach(sp => {
        aquariumFishList.push(new AquariumSwimmer(sp, tankWidth, tankHeight));
      });

      speakText('나의 반짝반짝 수족관이에요! 화면을 눌러 맛있는 밥을 주어 보세요!');

      if (aquariumAnimId) cancelAnimationFrame(aquariumAnimId);
      aquariumLoop();
    }

    function closeAquarium() {
      aquariumModal.classList.remove('active');
      if (aquariumAnimId) cancelAnimationFrame(aquariumAnimId);
      aquariumFishList.forEach(f => f.destroy());
      aquariumFishList = [];
      aquariumFoodList = [];
    }

    function aquariumLoop() {
      const rect = aquariumTank.getBoundingClientRect();
      const tankWidth = rect.width || 400;
      const tankHeight = rect.height || 300;

      // 먹이 가라앉기 업데이트
      for (let i = aquariumFoodList.length - 1; i >= 0; i--) {
        const food = aquariumFoodList[i];
        if (food.eaten || food.y > tankHeight - 15) {
          food.el.remove();
          aquariumFoodList.splice(i, 1);
        } else {
          food.y += 1.2;
          food.el.style.top = `${food.y}px`;
        }
      }

      // 물고기 업데이트
      aquariumFishList.forEach(f => f.update(tankWidth, tankHeight, aquariumFoodList));

      aquariumAnimId = requestAnimationFrame(aquariumLoop);
    }

    // 수족관 화면 터치 시 별사탕 밥 주기 🍩 ⭐
    aquariumTank.addEventListener('pointerdown', (e) => {
      const rect = aquariumTank.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      playChime();
      triggerHaptic('light');

      const foodSymbols = ['⭐️', '🍩', '🍬', '✨', '🧁'];
      const sym = foodSymbols[Math.floor(Math.random() * foodSymbols.length)];

      const foodEl = document.createElement('div');
      foodEl.className = 'fish-food';
      foodEl.textContent = sym;
      foodEl.style.left = `${x - 11}px`;
      foodEl.style.top = `${y - 11}px`;
      aquariumTank.appendChild(foodEl);

      aquariumFoodList.push({
        x: x,
        y: y,
        el: foodEl,
        eaten: false
      });
    });

    // 어항 클릭 시 수족관 오픈 연동! ⭐
    fishBowl.addEventListener('click', openAquarium);
    closeAquariumBtn.addEventListener('click', closeAquarium);
    btnOpenAquariumFromModal.addEventListener('click', () => {
      successModal.classList.remove('active');
      openAquarium();
    });

    // ==========================================
    // 12. 게임 초기화 및 시작
    // ==========================================
    initBubbles();
    startStage(0);
    requestAnimationFrame(gameLoop);
  </script>
</body>
