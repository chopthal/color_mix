<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="바다 낚시">
  <title>🎣 두근두근 바다 낚시 놀이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: "Jua", "Malgun Gothic", sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, #3aa8f7 0%, #1572c8 50%, #0a4382 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 상단 네비게이션 & 미션 바 (HUD) */
    .hud-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: max(8px, env(safe-area-inset-top)) 12px 8px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      border-bottom: 4px solid #bce1ff;
      z-index: 50;
      color: #244163;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f0f6fc;
      color: #2b5c8f;
      text-decoration: none;
      font-size: clamp(14px, 3.2vw, 17px);
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 20px;
      border: 2px solid #c9e0f7;
      box-shadow: 0 3px 0 #b0d2f3;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #b0d2f3;
    }

    /* 타겟 물고기 미션 카드 */
    .mission-box {
      flex: 1;
      max-width: 480px;
      margin: 0 auto;
      background: #eff7ff;
      border: 3px solid #6cbcf8;
      border-radius: 24px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.04);
    }

    .mission-target-fish {
      flex-shrink: 0;
      width: clamp(62px, 14vw, 84px);
      height: clamp(46px, 10vw, 58px);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.15));
      animation: target-bob 2s infinite ease-in-out;
    }

    .mission-target-fish svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes target-bob {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.08) translateY(-3px); }
    }

    .mission-text-wrap {
      text-align: left;
    }

    .mission-sub {
      font-size: clamp(11px, 2.4vw, 13px);
      color: #0284c7;
      font-weight: 700;
    }

    .mission-name {
      font-size: clamp(17px, 3.8vw, 24px);
      color: #1e3a5f;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .speak-mission-btn {
      background: #ffffff;
      border: 2px solid #bae6fd;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 2px 0 #93c5fd;
    }

    .speak-mission-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 진행도 (잡은 물고기 수) */
    .score-badge {
      background: #fffae0;
      border: 2px solid #ffd43b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: clamp(15px, 3.4vw, 20px);
      font-weight: 800;
      color: #e67700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 #fcc419;
      white-space: nowrap;
    }

    /* 바닷속 수조 영역 */
    .sea-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .sun-rays {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 65%;
      background: repeating-linear-gradient(
        75deg,
        rgba(255, 255, 255, 0.08) 0px,
        rgba(255, 255, 255, 0.08) 40px,
        transparent 40px,
        transparent 90px
      );
      pointer-events: none;
    }

    .sea-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: linear-gradient(180deg, #d4a373 0%, #bc8a5f 100%);
      border-top: 6px solid #e9c46a;
      pointer-events: none;
      z-index: 5;
    }

    /* 우측 하단: 나의 미니 어항 바구니 */
    .fish-bowl {
      position: absolute;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      width: clamp(76px, 16vw, 105px);
      height: clamp(76px, 16vw, 105px);
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.95), rgba(200, 235, 255, 0.6) 70%, rgba(130, 205, 255, 0.75) 100%);
      border: 4px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3), inset 0 -6px 12px rgba(10, 80, 160, 0.25);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .fish-bowl.bounce-bowl {
      animation: bowl-pop 0.45s ease-out;
    }

    @keyframes bowl-pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.22) rotate(-5deg); }
      70% { transform: scale(0.95) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .fish-bowl-water {
      position: absolute;
      bottom: 6px;
      width: 82%;
      height: 55%;
      background: rgba(56, 189, 248, 0.45);
      border-radius: 0 0 50px 50px;
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 4px;
    }

    .bowl-icon {
      font-size: 20px;
      animation: bowl-fish-bob 1.5s infinite ease-in-out;
    }

    @keyframes bowl-fish-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .bowl-label {
      position: absolute;
      top: -12px;
      background: #ffecb3;
      color: #925400;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 800;
      border: 1px solid #ffd54f;
      white-space: nowrap;
    }

    /* 공기 방울 (터치 인터랙션 지원) */
    .bubble {
      position: absolute;
      bottom: 10px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.2));
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      cursor: pointer;
      touch-action: manipulation;
      animation: rise-bubble linear infinite;
      z-index: 8;
    }

    .bubble:active {
      transform: scale(1.3);
    }

    @keyframes rise-bubble {
      0% {
        transform: translateY(0) scale(0.7);
        opacity: 0;
      }
      15% { opacity: 0.9; }
      85% { opacity: 0.9; }
      100% {
        transform: translateY(-92vh) scale(1.2);
        opacity: 0;
      }
    }

    /* 수영하는 물고기 공통 */
    .fish-swimmer {
      position: absolute;
      cursor: pointer;
      z-index: 10;
      user-select: none;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.22));
      transition: filter 0.15s ease;
      touch-action: manipulation;
    }

    .fish-swimmer svg {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }

    /* 물보라 (Splash Effect) */
    .splash-ring {
      position: absolute;
      pointer-events: none;
      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: splash-expand 0.5s forwards ease-out;
      z-index: 60;
    }

    @keyframes splash-expand {
      0% { width: 10px; height: 10px; opacity: 1; border-width: 5px; }
      100% { width: 100px; height: 100px; opacity: 0; border-width: 1px; }
    }

    /* 뜰채(Net) 그래픽 */
    .fishing-net {
      position: absolute;
      pointer-events: none;
      width: 72px;
      height: 72px;
      transform: translate(-50%, -50%) scale(0.4);
      z-index: 70;
      animation: net-swoop 0.45s forwards cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    @keyframes net-swoop {
      0% { transform: translate(-50%, -100px) scale(0.5); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%, -70px) scale(0.9); opacity: 0; }
    }

    /* 어항으로 날아가는 모션 (포물선 비행) */
    .flying-fish {
      position: fixed;
      pointer-events: none;
      z-index: 85;
      transition: all 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.3));
    }

    /* 먹물 뿜기 효과 */
    .ink-cloud {
      position: absolute;
      pointer-events: none;
      background: radial-gradient(circle, rgba(20, 20, 30, 0.88) 0%, rgba(20, 20, 30, 0) 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: ink-spread 1.6s forwards ease-out;
      z-index: 15;
    }

    @keyframes ink-spread {
      0% { width: 20px; height: 20px; opacity: 0.9; }
      50% { width: 140px; height: 140px; opacity: 0.8; }
      100% { width: 190px; height: 190px; opacity: 0; }
    }

    /* 성공 파티클 */
    .particle {
      position: absolute;
      pointer-events: none;
      font-size: 24px;
      z-index: 90;
      animation: particle-pop 0.7s forwards ease-out;
    }

    @keyframes particle-pop {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
    }

    /* 오답 흔들림 */
    .wrong-wiggle {
      animation: wrong-shake 0.4s ease-in-out;
    }

    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-14px) rotate(-8deg); }
      40%, 80% { transform: translateX(14px) rotate(8deg); }
    }

    /* 성공 축하 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 28, 52, 0.78);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 36px;
      border: 6px solid #ffd43b;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      color: #2b4365;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-emoji {
      font-size: 64px;
      margin-bottom: 12px;
      animation: celebration-bounce 1s infinite alternate ease-in-out;
    }

    @keyframes celebration-bounce {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.15) translateY(-10px); }
    }

    .modal-title {
      font-size: clamp(26px, 5vw, 34px);
      margin-bottom: 8px;
      color: #1e3a5f;
    }

    .modal-desc {
      font-size: 18px;
      color: #5c7493;
      margin-bottom: 24px;
    }

    .modal-btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-action {
      font-family: inherit;
      font-size: 20px;
      font-weight: 800;
      padding: 14px 24px;
      border-radius: 28px;
      border: none;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.15);
      transition: all 0.12s ease;
    }

    .btn-next {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 5px 0 #059669;
    }
    .btn-next:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #059669;
    }

    .btn-lobby {
      background: #e2e8f0;
      color: #475569;
      box-shadow: 0 4px 0 #cbd5e1;
      text-decoration: none;
      display: inline-block;
    }
    .btn-lobby:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #cbd5e1;
    }
  </style>
</head>
<body>
  <!-- 상단 HUD 바 -->
  <header class="hud-bar">
    <div class="nav-left">
      <a href="../../index.html" class="home-btn" title="놀이터 홈으로">🏠 놀이터</a>
    </div>

    <!-- 미션 타겟 -->
    <div class="mission-box" id="missionBox">
      <div class="mission-target-fish" id="targetFishGraphic"></div>
      <div class="mission-text-wrap">
        <div class="mission-sub">이 물고기를 찾아보세요!</div>
        <div class="mission-name">
          <span id="targetFishName">주황 줄무늬 물고기</span>
          <button type="button" class="speak-mission-btn" id="speakMissionBtn" title="이름 듣기">🔊</button>
        </div>
      </div>
    </div>

    <!-- 점수 / 진행 -->
    <div class="score-badge" id="scoreBadge">
      <span>⭐</span>
      <span id="scoreText">0 / 3</span>
    </div>
  </header>

  <!-- 바닷속 플레이 공간 -->
  <main class="sea-container" id="seaArea">
    <div class="sun-rays"></div>
    <div class="sea-floor"></div>

    <!-- 내 미니 어항 바구니 -->
    <div class="fish-bowl" id="fishBowl">
      <span class="bowl-label">내 어항 🫧</span>
      <div class="fish-bowl-water" id="bowlWater"></div>
    </div>
  </main>

  <!-- 스테이지 완료 모달 -->
  <div class="modal-overlay" id="successModal">
    <div class="modal-card">
      <div class="modal-emoji">🎉 🏆 🐠</div>
      <h2 class="modal-title">우와! 다 잡았어요!</h2>
      <p class="modal-desc">내 어항에 물고기가 가득 찼어요! 최고예요!</p>
      <div class="modal-btn-group">
        <button type="button" class="btn-action btn-next" id="btnNextRound">다른 물고기 잡기! 🎣</button>
        <a href="../../index.html" class="btn-action btn-lobby">놀이터로 가기 🏠</a>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 진동(햅틱) 헬퍼 - 안드로이드 완벽 지원, iOS 안전 무시
    // ==========================================
    function triggerHaptic(type = 'light') {
      if (!('vibrate' in navigator)) return;
      try {
        if (type === 'light') {
          navigator.vibrate(20);
        } else if (type === 'catch') {
          navigator.vibrate([30, 40, 50]);
        } else if (type === 'bonus') {
          navigator.vibrate([30, 30, 40, 40, 70]);
        } else if (type === 'wrong') {
          navigator.vibrate([50, 40, 50]);
        } else if (type === 'ink') {
          navigator.vibrate([70, 30, 70]);
        }
      } catch (e) {}
    }

    // ==========================================
    // 2. 효과음 오디오 엔진 (Web Audio API)
    // ==========================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function resumeAudio() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // 맑은 차임벨 (도미솔도)
    function playChime() {
      resumeAudio();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const start = audioCtx.currentTime + idx * 0.08;
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.2, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.32);
      });
    }

    // 기포 퐁! 터지는 소리
    function playBubblePopSound() {
      resumeAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    // 물보라 풍덩 소리
    function playSplashSound() {
      resumeAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.22);
    }

    // 문어 먹물 뿡 소리
    function playOctopusSound() {
      resumeAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.26);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.28);
    }

    // 오답 귀여운 뾱 소리
    function playWrongSound() {
      resumeAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(280, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.22);
    }

    // 클리어 팡파레
    function playFanfare() {
      resumeAudio();
      const melody = [
        { f: 523.25, d: 0.15 }, { f: 659.25, d: 0.15 }, { f: 783.99, d: 0.18 },
        { f: 1046.50, d: 0.45 }
      ];
      let t = audioCtx.currentTime;
      melody.forEach(item => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(item.f, t);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + item.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + item.d + 0.05);
        t += item.d;
      });
    }

    // ==========================================
    // 3. 물고기 및 스페셜 캐릭터 데이터
    // ==========================================
    const FISH_SPECIES = [
      {
        id: 'clownfish',
        name: '주황 줄무늬 물고기',
        speak: '주황색 줄무늬 물고기',
        icon: '🐠',
        width: 90,
        height: 56,
        svg: `
          <svg viewBox="0 0 100 65" xmlns="http://www.w3.org/2000/svg">

    // 스페셜 1: 반짝이 황금 물고기

    // ==========================================
    // 4. 게임 상태 관리
    // ==========================================
    let currentTarget = null;
    let targetGoal = 3;
    let currentScore = 0;
    let activeFishList = [];
    let animationFrameId = null;

    const seaArea = document.getElementById('seaArea');
    const targetFishGraphic = document.getElementById('targetFishGraphic');
    const targetFishName = document.getElementById('targetFishName');
    const scoreText = document.getElementById('scoreText');
    const successModal = document.getElementById('successModal');
    const btnNextRound = document.getElementById('btnNextRound');
    const speakMissionBtn = document.getElementById('speakMissionBtn');
    const fishBowl = document.getElementById('fishBowl');
    const bowlWater = document.getElementById('bowlWater');

    // 음성 읽어주기 (TTS)
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = 0.95;
      utter.pitch = 1.25;
      window.speechSynthesis.speak(utter);
    }

    speakMissionBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentTarget) speakText(currentTarget.speak + '를 잡아보세요!');
    });

    // ==========================================
    // 5. 기포 생성 및 터뜨리기 인터랙션
    // ==========================================
    function createBubble() {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = Math.random() * 22 + 14;
      b.style.width = `${size}px`;
      b.style.height = `${size}px`;
      b.style.left = `${Math.random() * 92}%`;
      const dur = Math.random() * 4 + 4;
      b.style.animationDuration = `${dur}s`;

      // 톡! 터뜨리기 이벤트
      b.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        popBubble(e.clientX, e.clientY, b);
      });

      // 애니메이션 끝나면 재배치
      b.addEventListener('animationiteration', () => {
        b.style.left = `${Math.random() * 92}%`;
      });

      seaArea.appendChild(b);
    }

    function initBubbles() {
      for (let i = 0; i < 14; i++) {
        createBubble();
      }
    }

    function popBubble(x, y, elem) {
      playBubblePopSound();
      triggerHaptic('light');

      // 작은 물방울 파편
      for (let i = 0; i < 5; i++) {
        const drop = document.createElement('div');
        drop.className = 'particle';
        drop.textContent = '🫧';
        drop.style.left = `${x}px`;
        drop.style.top = `${y}px`;
        drop.style.fontSize = '16px';
        const angle = (Math.PI * 2 / 5) * i;
        drop.style.setProperty('--dx', `${Math.cos(angle) * 35}px`);
        drop.style.setProperty('--dy', `${Math.sin(angle) * 35}px`);
        document.body.appendChild(drop);
        setTimeout(() => drop.remove(), 500);
      }

      elem.remove();
      // 1초 뒤 새 방울 생성
      setTimeout(createBubble, 800);
    }

    // ==========================================
    // 6. 손맛 이펙트 (물보라 + 뜰채 + 어항 날아가기)
    // ==========================================
    function showSplash(x, y) {
      playSplashSound();
      
      // 1. 물보라 링
      const ring = document.createElement('div');
      ring.className = 'splash-ring';
      ring.style.left = `${x}px`;
      ring.style.top = `${y}px`;
      seaArea.appendChild(ring);
      setTimeout(() => ring.remove(), 550);

      // 2. 뜰채 모션
      const net = document.createElement('div');
      net.className = 'fishing-net';
      net.style.left = `${x}px`;
      net.style.top = `${y}px`;
      net.innerHTML = `
        <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <circle cx="36" cy="36" r="28" fill="rgba(255,255,255,0.4)" stroke="#ff7043" stroke-width="4" stroke-dasharray="4,4" />
          <line x1="56" y1="56" x2="78" y2="78" stroke="#8d6e63" stroke-width="6" stroke-linecap="round" />
        </svg>
      `;
      seaArea.appendChild(net);
      setTimeout(() => net.remove(), 500);
    }

    // 잡힌 물고기가 어항으로 포물선 비행하는 연출
    function flyFishToBowl(startX, startY, species) {
      const bowlRect = fishBowl.getBoundingClientRect();
      const targetX = bowlRect.left + bowlRect.width / 2;
      const targetY = bowlRect.top + bowlRect.height / 2;

      const flyer = document.createElement('div');
      flyer.className = 'flying-fish';
      flyer.style.width = '60px';
      flyer.style.height = '42px';
      flyer.style.left = `${startX - 30}px`;
      flyer.style.top = `${startY - 21}px`;
      flyer.innerHTML = species.svg;
      document.body.appendChild(flyer);

      // 포물선 이동 (중간에 솟아오름)
      requestAnimationFrame(() => {
        flyer.style.transform = `translate(${targetX - startX}px, ${targetY - startY}px) scale(0.4) rotate(45deg)`;
        flyer.style.opacity = '0.7';
      });

      setTimeout(() => {
        flyer.remove();
        // 어항 바운스 & 미니 아이콘 추가
        fishBowl.classList.remove('bounce-bowl');
        void fishBowl.offsetWidth;
        fishBowl.classList.add('bounce-bowl');

        const mini = document.createElement('span');
        mini.className = 'bowl-icon';
        mini.textContent = species.icon || '🐟';
        bowlWater.appendChild(mini);
      }, 650);
    }

    function spawnParticles(x, y) {
      const items = ['✨', '⭐', '🫧', '🌟'];
      for (let i = 0; i < 7; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = items[Math.floor(Math.random() * items.length)];
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;
        const angle = (Math.PI * 2 / 7) * i;
        const dist = Math.random() * 60 + 40;
        p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 700);
      }
    }

    // ==========================================
    // 7. 헤엄치는 물고기/생물 객체 클래스
    // ==========================================
    class Swimmer {
      constructor(species, role = 'normal') {
        // role: 'target' | 'normal' | 'golden' | 'octopus'
        this.species = species;
        this.role = role;

        const bounds = seaArea.getBoundingClientRect();
        this.width = species.width * (Math.random() * 0.15 + 0.9);
        this.height = species.height * (Math.random() * 0.15 + 0.9);

        // 속도 및 방향 설정
        this.dir = Math.random() > 0.5 ? 1 : -1;
        let baseSpeed = Math.random() * 1.0 + 1.1;
        if (role === 'golden') baseSpeed *= 1.8; // 황금 물고기는 빠름!
        if (role === 'octopus') baseSpeed *= 0.8; // 문어는 여유롭게 둥실
        this.speed = baseSpeed * this.dir;

        this.x = this.dir === 1 ? -this.width - 25 : bounds.width + 25;
        this.y = Math.random() * (bounds.height - 180) + 20;
        this.waveOffset = Math.random() * Math.PI * 2;
        this.waveSpeed = Math.random() * 0.03 + 0.02;

        this.el = document.createElement('div');
        this.el.className = 'fish-swimmer';
        this.el.style.width = `${this.width}px`;
        this.el.style.height = `${this.height}px`;
        this.el.innerHTML = species.svg;

        this.el.addEventListener('pointerdown', (e) => this.onInteract(e));
        seaArea.appendChild(this.el);
      }

      update(width, height) {
        this.x += this.speed;
        this.waveOffset += this.waveSpeed;
        const currentY = this.y + Math.sin(this.waveOffset) * 12;

        const flip = this.dir === -1 ? 'scaleX(-1)' : 'scaleX(1)';
        this.el.style.transform = `translate3d(${this.x}px, ${currentY}px, 0) ${flip}`;

        if (this.dir === 1 && this.x > width + 60) return false;
        if (this.dir === -1 && this.x < -this.width - 60) return false;
        return true;
      }

      onInteract(e) {
        e.stopPropagation();
        if (this.caught) return;

        // 1) 목표 물고기를 잡았을 때
        if (this.role === 'target') {
          this.caught = true;
          triggerHaptic('catch');
          showSplash(e.clientX, e.clientY);
          playChime();
          spawnParticles(e.clientX, e.clientY);
          flyFishToBowl(e.clientX, e.clientY, this.species);

          currentScore++;
          updateScoreDisplay();

          this.el.remove();
          this.destroy();

          // 타겟 물고기 즉시 보충
          setTimeout(() => spawnFish('target'), 800);

          if (currentScore >= targetGoal) {
            setTimeout(showVictory, 700);
          }
        }
        // 2) 보너스 황금 물고기를 잡았을 때
        else if (this.role === 'golden') {
          this.caught = true;
          triggerHaptic('bonus');
          showSplash(e.clientX, e.clientY);
          playChime();
          spawnParticles(e.clientX, e.clientY);
          flyFishToBowl(e.clientX, e.clientY, this.species);

          // 보너스 점수!
          currentScore++;
          updateScoreDisplay();
          speakText('대박! 황금 물고기를 잡았어요!');

          this.el.remove();
          this.destroy();

          if (currentScore >= targetGoal) {
            setTimeout(showVictory, 700);
          }
        }
        // 3) 아기 문어를 건드렸을 때 (먹물 뿡!)
        else if (this.role === 'octopus') {
          triggerHaptic('ink');
          playOctopusSound();

          // 먹물 방울 뿜기
          const ink = document.createElement('div');
          ink.className = 'ink-cloud';
          ink.style.left = `${e.clientX}px`;
          ink.style.top = `${e.clientY}px`;
          seaArea.appendChild(ink);
          setTimeout(() => ink.remove(), 1600);

          // 문어 빠르게 도망가기
          this.speed *= 2.2;
          this.el.classList.add('wrong-wiggle');
        }
        // 4) 다른 일반 물고기를 건드렸을 때
        else {
          triggerHaptic('wrong');
          playWrongSound();
          this.el.classList.remove('wrong-wiggle');
          void this.el.offsetWidth;
          this.el.classList.add('wrong-wiggle');
          this.speed *= 1.4; // 깜짝 놀라 도망침
        }
      }

      destroy() {
        if (this.el && this.el.parentNode) {
          this.el.parentNode.removeChild(this.el);
        }
        const idx = activeFishList.indexOf(this);
        if (idx !== -1) activeFishList.splice(idx, 1);
      }
    }

    function updateScoreDisplay() {
      scoreText.textContent = `${currentScore} / ${targetGoal}`;
    }

    // 물고기 스폰 제어
    function spawnFish(forcedRole = null) {
      let role = forcedRole;
      let species;

      if (!role) {
        const rand = Math.random();
        if (rand < 0.38) {
          role = 'target';
        } else if (rand < 0.46) {
          role = 'golden'; // 8% 확률로 황금 물고기
        } else if (rand < 0.54) {
          role = 'octopus'; // 8% 확률로 아기 문어
        } else {
          role = 'normal';
        }
      }

      if (role === 'target') {
        species = currentTarget;
      } else if (role === 'golden') {
        species = GOLDEN_FISH;
      } else if (role === 'octopus') {
        species = BABY_OCTOPUS;
      } else {
        const others = FISH_SPECIES.filter(s => s.id !== currentTarget.id);
        species = others[Math.floor(Math.random() * others.length)];
      }

      const fish = new Swimmer(species, role);
      activeFishList.push(fish);
    }

    function gameLoop() {
      const bounds = seaArea.getBoundingClientRect();
      for (let i = activeFishList.length - 1; i >= 0; i--) {
        const fish = activeFishList[i];
        if (!fish.caught) {
          const alive = fish.update(bounds.width, bounds.height);
          if (!alive) {
            fish.destroy();
            spawnFish();
          }
        }
      }

      const maxFish = Math.min(10, Math.max(6, Math.floor(bounds.width / 110)));
      if (activeFishList.length < maxFish) {
        spawnFish();
      }

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    // ==========================================
    // 8. 라운드 시작 & 클리어
    // ==========================================
    function startRound() {
      successModal.classList.remove('active');
      currentScore = 0;
      updateScoreDisplay();
      bowlWater.innerHTML = ''; // 어항 비우기

      // 이전 물고기 정리
      activeFishList.forEach(f => {
        if (f.el && f.el.parentNode) f.el.parentNode.removeChild(f.el);
      });
      activeFishList = [];

      // 새로운 타겟 선정
      const prevId = currentTarget ? currentTarget.id : null;
      const candidates = FISH_SPECIES.filter(s => s.id !== prevId);
      currentTarget = candidates[Math.floor(Math.random() * candidates.length)];

      targetFishGraphic.innerHTML = currentTarget.svg;
      targetFishName.textContent = currentTarget.name;

      setTimeout(() => {
        speakText(`${currentTarget.speak}를 찾아보세요!`);
      }, 500);

      // 초기 물고기들 배치
      const bounds = seaArea.getBoundingClientRect();
      const initialCount = Math.min(8, Math.max(5, Math.floor(bounds.width / 130)));
      for (let i = 0; i < initialCount; i++) {
        const isTarget = i < 2;
        const role = isTarget ? 'target' : (i === 2 ? 'octopus' : 'normal');
        let species;
        if (role === 'target') species = currentTarget;
        else if (role === 'octopus') species = BABY_OCTOPUS;
        else species = FISH_SPECIES[Math.floor(Math.random() * FISH_SPECIES.length)];

        const fish = new Swimmer(species, role);
        fish.x = Math.random() * (bounds.width - fish.width);
        activeFishList.push(fish);
      }
    }

    function showVictory() {
      playFanfare();
      triggerHaptic('bonus');
      successModal.classList.add('active');
      speakText('우와! 다 잡았어요! 내 어항이 꽉 찼네요! 최고예요!');
    }

    btnNextRound.addEventListener('click', () => {
      startRound();
    });

    // 시작
    initBubbles();
    startRound();
    gameLoop();
  </script>
</body>
</html>
