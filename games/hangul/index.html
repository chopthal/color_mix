<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="한글 쓰기">
  <title>✏️ 신나는 마법 한글 쓰기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: "Jua", "Malgun Gothic", sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, #fff3d6 0%, #fff9ec 50%, #f0fdf4 100%);
      color: #3b2c1a;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 상단 네비게이션 & 자음 탭 바 (ㄱ ~ ㅎ) */
    .top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: max(8px, env(safe-area-inset-top)) 10px 8px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 4px solid #fed7aa;
      box-shadow: 0 4px 14px rgba(180, 83, 9, 0.08);
      z-index: 50;
      overflow-x: hidden;
    }

    .home-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fef3c7;
      color: #92400e;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 20px;
      border: 2px solid #fde68a;
      box-shadow: 0 3px 0 #fcd34d;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #fcd34d;
    }

    .letter-tabs {
      flex: 1;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .letter-tabs::-webkit-scrollbar {
      display: none;
    }

    .letter-tab-btn {
      flex-shrink: 0;
      min-width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 3px solid #fed7aa;
      background: #ffffff;
      color: #78350f;
      font-size: 21px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #fde68a;
      transition: transform 0.12s, background 0.12s;
      position: relative;
    }

    .letter-tab-btn.active {
      background: #f97316;
      color: #ffffff;
      border-color: #ea580c;
      box-shadow: 0 3px 0 #c2410c;
      transform: translateY(-2px);
    }

    .letter-tab-btn.cleared::after {
      content: '⭐';
      position: absolute;
      top: -6px;
      right: -6px;
      font-size: 12px;
    }

    /* 진행도 바 (기본 ➔ 단어1 ➔ 단어2 ➔ 받침) */
    .step-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px 2px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .step-badges {
      display: flex;
      gap: 6px;
    }

    .step-pill {
      font-size: 13px;
      padding: 3px 10px;
      border-radius: 14px;
      background: #ffedd5;
      color: #9a3412;
      font-weight: 800;
      border: 1px solid #fed7aa;
    }
    .step-pill.active {
      background: #f97316;
      color: #ffffff;
      border-color: #ea580c;
    }
    .step-pill.done {
      background: #10b981;
      color: #ffffff;
      border-color: #059669;
    }

    .guide-prompt {
      font-size: clamp(15px, 3.5vw, 19px);
      color: #7c2d12;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .speak-guide-btn {
      background: #fef3c7;
      border: 2px solid #fde68a;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 2px 0 #fcd34d;
    }
    .speak-guide-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 메인 무대 컨테이너 */
    .main-board-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 12px 14px;
      position: relative;
    }

    /* 큼직한 글자판 칠판 */
    .board-stage {
      position: relative;
      width: min(94vw, 540px);
      height: min(72vh, 420px);
      background: #ffffff;
      border-radius: 36px;
      border: 6px solid #ffedd5;
      box-shadow: 0 16px 36px rgba(180, 83, 9, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
      overflow: hidden;
      touch-action: none;
    }

    .board-grid-pattern {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: 
        linear-gradient(to right, rgba(254, 215, 170, 0.3) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(254, 215, 170, 0.3) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* 상단 이모지 */
    .board-emoji {
      font-size: clamp(48px, 12vw, 76px);
      margin-bottom: 6px;
      animation: emoji-bounce 2.2s infinite ease-in-out;
      z-index: 2;
    }

    @keyframes emoji-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.08); }
    }

    /* 거대한 글자판 영역 */
    .word-letters-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3vw, 24px);
      z-index: 10;
      width: 100%;
    }

    /* 글자 덩어리 블록 */
    .letter-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .letter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 커다란 고정 텍스트 (예: ㅏ, 위, 수 등) */
    .huge-char-text {
      font-size: clamp(52px, 14vw, 88px);
      font-weight: 800;
      color: #9a3412;
      line-height: 1;
      text-shadow: 0 4px 0 #fed7aa;
      transition: transform 0.2s, color 0.2s;
    }

    /* 도로 트랙이 들어갈 빈칸 슬롯 */
    .road-slot-box {
      position: relative;
      width: clamp(130px, 30vw, 190px);
      height: clamp(130px, 30vw, 190px);
      background: rgba(255, 247, 237, 0.7);
      border: 4px dashed #f97316;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 3px 8px rgba(249, 115, 22, 0.1);
      animation: slot-pulse 2s infinite ease-in-out;
    }

    @keyframes slot-pulse {
      0%, 100% { border-color: #f97316; background: rgba(255, 247, 237, 0.7); }
      50% { border-color: #ea580c; background: #ffedd5; }
    }

    /* 도로 SVG */
    .track-svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* 꼬마 자동차 핸들 */
    .car-handle {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffedd5 0%, #fed7aa 100%);
      border: 4px solid #f97316;
      box-shadow: 0 6px 14px rgba(234, 88, 12, 0.4), inset 0 2px 4px #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
      z-index: 30;
      animation: car-bounce 1.5s infinite ease-in-out;
      pointer-events: auto;
    }

    .car-handle:active {
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(1.18);
    }

    @keyframes car-bounce {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }

    /* 완성 합체 축하 팝업 */
    .transform-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.96);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 16px;
      text-align: center;
    }

    .transform-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .transform-emoji {
      font-size: 84px;
      margin-bottom: 6px;
      animation: pop-bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pop-bounce {
      0% { transform: scale(0.2) rotate(-15deg); }
      70% { transform: scale(1.25) rotate(8deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .transform-title {
      font-size: clamp(28px, 6.5vw, 40px);
      color: #ea580c;
      margin-bottom: 4px;
    }

    .transform-desc {
      font-size: clamp(16px, 4vw, 21px);
      color: #7c2d12;
      margin-bottom: 20px;
    }

    .next-btn {
      font-family: inherit;
      font-size: 20px;
      font-weight: 800;
      padding: 14px 30px;
      border-radius: 30px;
      border: none;
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 5px 0 #059669;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .next-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #059669;
    }

    .particle {
      position: absolute;
      pointer-events: none;
      font-size: 24px;
      z-index: 80;
      animation: particle-pop 0.7s forwards ease-out;
    }

    @keyframes particle-pop {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- 상단 자음 탭 (ㄱ ~ ㅎ) -->
  <header class="top-bar">
    <a href="../../index.html" class="home-btn" title="놀이터 홈으로">🏠 놀이터</a>
    <div class="letter-tabs" id="letterTabs"></div>
  </header>

  <!-- 단계 인디케이터 & 가이드 -->
  <div class="step-header">
    <div class="step-badges">
      <span class="step-pill active" id="pill0">기본 글자</span>
      <span class="step-pill" id="pill1">단어 1</span>
      <span class="step-pill" id="pill2">단어 2</span>
      <span class="step-pill" id="pill3">받침 도전</span>
    </div>
    <div class="guide-prompt">
      <span id="guidePromptText">자동차로 길을 따라가요!</span>
      <button type="button" class="speak-guide-btn" id="speakGuideBtn" title="음성 듣기">🔊</button>
    </div>
  </div>

  <!-- 메인 칠판 무대 -->
  <main class="main-board-container">
    <div class="board-stage" id="boardStage">
      <div class="board-grid-pattern"></div>

      <!-- 단어 이모지 -->
      <div class="board-emoji" id="boardEmoji">✂️</div>

      <!-- 거대한 단어 글자판 (예: [도로(ㄱ)]  ㅏ    우   ㅣ) -->
      <div class="word-letters-stage" id="wordLettersStage">
        <!-- JS로 동적 렌더링 -->
      </div>

      <!-- 완성 축하 팝업 -->
      <div class="transform-container" id="transformLayer">
        <div class="transform-emoji" id="transformEmoji">✂️</div>
        <h2 class="transform-title" id="transformTitle">가위 완성!</h2>
        <p class="transform-desc" id="transformDesc">가위의 '기역'을 멋지게 채웠어요!</p>
        <button type="button" class="next-btn" id="nextStepBtn">다음으로! ➜</button>
      </div>
    </div>
  </main>

  <script>
    // ==========================================
    // 1. 자음 및 4단계 코스 데이터 (기본 ➔ 단어1 ➔ 단어2 ➔ 받침)
    // ==========================================
    const HANGUL_LIST = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

    // 도로 트랙 좌표 (200x200 정사각 viewBox 기준)
    const CHAR_PATHS = {
      'ㄱ': [{ x: 45, y: 50 }, { x: 155, y: 50 }, { x: 155, y: 155 }],

      'ㄹ': [{ x: 45, y: 40 }, { x: 150, y: 40 }, { x: 150, y: 95 }, { x: 45, y: 95 }, { x: 45, y: 155 }, { x: 150, y: 155 }],

      'ㅇ': [{ x: 100, y: 40 }, { x: 155, y: 100 }, { x: 100, y: 160 }, { x: 45, y: 100 }, { x: 100, y: 40 }],
      'ㅈ': [{ x: 50, y: 45 }, { x: 150, y: 45 }, { x: 100, y: 45 }, { x: 50, y: 155 }, { x: 100, y: 95 }, { x: 150, y: 155 }],
      'ㅊ': [{ x: 100, y: 30 }, { x: 100, y: 50 }, { x: 50, y: 50 }, { x: 150, y: 50 }, { x: 100, y: 50 }, { x: 50, y: 155 }, { x: 100, y: 100 }, { x: 150, y: 155 }],
      'ㅋ': [{ x: 45, y: 45 }, { x: 150, y: 45 }, { x: 150, y: 100 }, { x: 45, y: 100 }, { x: 150, y: 100 }, { x: 150, y: 155 }],
      'ㅌ': [{ x: 150, y: 40 }, { x: 50, y: 40 }, { x: 50, y: 100 }, { x: 145, y: 100 }, { x: 50, y: 100 }, { x: 50, y: 155 }, { x: 150, y: 155 }],
      'ㅍ': [{ x: 45, y: 45 }, { x: 155, y: 45 }, { x: 80, y: 45 }, { x: 80, y: 155 }, { x: 120, y: 155 }, { x: 120, y: 45 }, { x: 45, y: 155 }, { x: 155, y: 155 }],
      'ㅎ': [{ x: 100, y: 30 }, { x: 100, y: 45 }, { x: 55, y: 45 }, { x: 145, y: 45 }, { x: 100, y: 80 }, { x: 140, y: 120 }, { x: 100, y: 160 }, { x: 60, y: 120 }, { x: 100, y: 80 }]

    // 14개 자음별 4단계 세트
    // type: 'single' (단독) | 'initial' (초성 빈칸) | 'final' (받침 빈칸)
    const HANGUL_COURSES = {
      'ㄱ': {
        name: '기역',
        steps: [
          { type: 'single', emoji: '🚂', prompt: "'기역'을 먼저 써보아요!", word: '기역', speak: '기역! 칙칙폭폭 기차의 기역!' },
          { type: 'initial', emoji: '✂️', prompt: "가위의 'ㄱ'을 채워주세요!", word: '가위', companion: ['ㅏ', '위'], speak: '가위의 기역! 가위 완성!' },
          { type: 'initial', emoji: '🐳', prompt: "고래의 'ㄱ'을 채워주세요!", word: '고래', companion: ['ㅗ', '래'], speak: '고래의 기역! 고래 완성!' },
          { type: 'final', emoji: '🍉', prompt: "수박의 받침 'ㄱ'을 채워주세요!", word: '수박', firstSyllable: '수', initial: 'ㅂ', vowel: 'ㅏ', speak: '수박의 받침 기역! 수박 완성!' }
        ]
      },
      'ㄴ': {

        steps: [
          { type: 'single', emoji: '🦋', prompt: "'니은'을 먼저 써보아요!", word: '니은', speak: '니은! 팔랑팔랑 나비의 니은!' },
          { type: 'initial', emoji: '🦋', prompt: "나비의 'ㄴ'을 채워주세요!", word: '나비', companion: ['ㅏ', '비'], speak: '나비의 니은! 나비 완성!' },
          { type: 'initial', emoji: '🎵', prompt: "노래의 'ㄴ'을 채워주세요!", word: '노래', companion: ['ㅗ', '래'], speak: '노래의 니은! 노래 완성!' },
          { type: 'final', emoji: '🥕', prompt: "당근의 받침 'ㄴ'을 채워주세요!", word: '당근', firstSyllable: '당', initial: 'ㄱ', vowel: 'ㅡ', speak: '당근의 받침 니은! 당근 완성!' }

      },
      'ㄷ': {

          { type: 'initial', emoji: '🐿️', prompt: "다람쥐의 'ㄷ'을 채워주세요!", word: '다람쥐', companion: ['ㅏ', '람쥐'], speak: '다람쥐의 디귿! 다람쥐 완성!' },
          { type: 'initial', emoji: '🍱', prompt: "도시락의 'ㄷ'을 채워주세요!", word: '도시락', companion: ['ㅗ', '시락'], speak: '도시락의 디귿! 도시락 완성!' },

        ]
      },
      'ㄹ': {
        name: '리을',
        steps: [

          { type: 'initial', emoji: '📻', prompt: "라디오의 'ㄹ'을 채워주세요!", word: '라디오', companion: ['ㅏ', '디오'], speak: '라디오의 리을! 라디오 완성!' },
          { type: 'final', emoji: '☁️', prompt: "구름의 받침 'ㄹ'을 채워주세요!", word: '구름', firstSyllable: '구', initial: '', vowel: 'ㅡ', speak: '구름의 받침 리을! 구름 완성!' }
        ]
      },
      'ㅁ': {
        name: '미음',
        steps: [
          { type: 'single', emoji: '👒', prompt: "'미음'을 먼저 써보아요!", word: '미음', speak: '미음! 멋진 모자의 미음!' },

    // ==========================================
    // 2. 오디오 및 햅틱
    // ==========================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function resumeAudio() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function triggerHaptic(type = 'light') {
      if (!('vibrate' in navigator)) return;
      try {
        if (type === 'light') navigator.vibrate(15);
        else if (type === 'step') navigator.vibrate(25);
        else if (type === 'success') navigator.vibrate([35, 45, 55, 75]);
      } catch (e) {}
    }

    const PITCH_SCALE = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
    function playChimeNote(idx) {
      resumeAudio();
      const freq = PITCH_SCALE[idx % PITCH_SCALE.length];
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.22);
    }

    function playVictorySound() {
      resumeAudio();
      const notes = [
        { f: 523.25, d: 0.12 }, { f: 659.25, d: 0.12 }, { f: 783.99, d: 0.15 },
        { f: 1046.50, d: 0.45 }
      ];
      let t = audioCtx.currentTime;
      notes.forEach(n => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, t);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + n.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + n.d + 0.05);
        t += n.d;
      });
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = 0.95;
      utter.pitch = 1.25;
      window.speechSynthesis.speak(utter);
    }

    // ==========================================
    // 3. 상태 관리
    // ==========================================
    let currentChar = 'ㄱ';
    let currentStepIdx = 0; // 0: 단독, 1: 단어1, 2: 단어2, 3: 받침
    let currentWaypointIdx = 0;
    let isDragging = false;

    const letterTabs = document.getElementById('letterTabs');
    const boardEmoji = document.getElementById('boardEmoji');
    const wordLettersStage = document.getElementById('wordLettersStage');
    const guidePromptText = document.getElementById('guidePromptText');
    const speakGuideBtn = document.getElementById('speakGuideBtn');
    const transformLayer = document.getElementById('transformLayer');
    const transformEmoji = document.getElementById('transformEmoji');
    const transformTitle = document.getElementById('transformTitle');
    const transformDesc = document.getElementById('transformDesc');
    const nextStepBtn = document.getElementById('nextStepBtn');

    // 14개 자음 탭 생성
    function initTabs() {
      letterTabs.innerHTML = '';
      HANGUL_LIST.forEach(char => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `letter-tab-btn ${char === currentChar ? 'active' : ''}`;
        btn.dataset.char = char;
        btn.textContent = char;
        btn.addEventListener('click', () => {
          currentChar = char;
          currentStepIdx = 0;
          updateActiveTab();
          renderStep();
        });
        letterTabs.appendChild(btn);
      });
    }

    function updateActiveTab() {
      document.querySelectorAll('.letter-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.char === currentChar);
      });
    }

    function generatePathD(points) {
      if (!points || points.length === 0) return '';
      return points.map((p, idx) => (idx === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');
    }

    // ==========================================
    // 4. 화면 렌더링 (메인 무대 큰 글자판 구성)
    // ==========================================
    function renderStep() {
      currentWaypointIdx = 0;
      transformLayer.classList.remove('active');

      const course = HANGUL_COURSES[currentChar];
      const step = course.steps[currentStepIdx];

      // 단계 인디케이터
      for (let i = 0; i < 4; i++) {
        const pill = document.getElementById(`pill${i}`);
        pill.classList.remove('active', 'done');
        if (i < currentStepIdx) pill.classList.add('done');
        else if (i === currentStepIdx) pill.classList.add('active');
      }

      boardEmoji.textContent = step.emoji;
      guidePromptText.textContent = step.prompt;

      // 무대 레이아웃 구성
      wordLettersStage.innerHTML = '';

      if (step.type === 'single') {
        // [0단계: 단독 자음 도로]
        wordLettersStage.innerHTML = `
          <div class="road-slot-box" id="activeRoadSlot">
            <svg class="track-svg" id="trackSvg" viewBox="0 0 200 200">
              <path id="baseRoad" fill="none" stroke="#e2e8f0" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
              <path id="centerDashes" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10,10" stroke-linecap="round" stroke-linejoin="round" />
              <path id="paintedRoad" fill="none" stroke="#f59e0b" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="car-handle" id="carHandle">🚗</div>
          </div>
        `;
      } else if (step.type === 'initial') {
        // [1~2단계: 초성 자리에 도로 + 옆에 큰 글자들 (예: [ㄱ도로] ㅏ 우 ㅣ)]
        const compHtml = step.companion.map(c => `<span class="huge-char-text">${c}</span>`).join('');
        wordLettersStage.innerHTML = `
          <div class="letter-block">
            <div class="letter-row">
              <div class="road-slot-box" id="activeRoadSlot">
                <svg class="track-svg" id="trackSvg" viewBox="0 0 200 200">
                  <path id="baseRoad" fill="none" stroke="#e2e8f0" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
                  <path id="centerDashes" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10,10" stroke-linecap="round" stroke-linejoin="round" />
                  <path id="paintedRoad" fill="none" stroke="#f59e0b" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="car-handle" id="carHandle">🚗</div>
              </div>
              ${compHtml}
            </div>
          </div>
        `;
      } else if (step.type === 'final') {
        // [3단계: 받침 자리에 도로 (예: 수 + ㅂ ㅏ / 아래에 [ㄱ 도로])]
        wordLettersStage.innerHTML = `
          <div class="letter-block">
            <div class="letter-row" style="align-items: flex-end;">
              ${step.firstSyllable ? `<span class="huge-char-text" style="margin-right: 14px;">${step.firstSyllable}</span>` : ''}
              <div style="display:flex; flex-direction:column; align-items:center;">
                <div class="letter-row">
                  <span class="huge-char-text">${step.initial}</span>
                  <span class="huge-char-text">${step.vowel}</span>
                </div>
                <div class="road-slot-box" id="activeRoadSlot" style="width: 140px; height: 110px; margin-top: 4px;">
                  <svg class="track-svg" id="trackSvg" viewBox="0 0 200 200">
                    <path id="baseRoad" fill="none" stroke="#e2e8f0" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
                    <path id="centerDashes" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10,10" stroke-linecap="round" stroke-linejoin="round" />
                    <path id="paintedRoad" fill="none" stroke="#f59e0b" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                  <div class="car-handle" id="carHandle">🚗</div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 도로 패스 및 자동차 세팅
      setupRoadTrack();

      setTimeout(() => {
        speakText(step.prompt);
      }, 350);
    }

    // 도로 트랙 및 자동차 포인터 이벤트 연결
    function setupRoadTrack() {
      const baseRoad = document.getElementById('baseRoad');
      const centerDashes = document.getElementById('centerDashes');
      const paintedRoad = document.getElementById('paintedRoad');
      const carHandle = document.getElementById('carHandle');
      const activeRoadSlot = document.getElementById('activeRoadSlot');

      const points = CHAR_PATHS[currentChar];
      const fullPath = generatePathD(points);
      baseRoad.setAttribute('d', fullPath);
      centerDashes.setAttribute('d', fullPath);
      paintedRoad.setAttribute('d', '');

      updateCarPos(points[0].x, points[0].y);

      // 드래그 제어
      carHandle.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        isDragging = true;
        carHandle.setPointerCapture(e.pointerId);
        resumeAudio();
        triggerHaptic('light');
      });

      carHandle.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        onDragMove(e.clientX, e.clientY);
      });

      carHandle.addEventListener('pointerup', (e) => {
        isDragging = false;
        try { carHandle.releasePointerCapture(e.pointerId); } catch (err) {}
      });

      activeRoadSlot.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        onDragMove(e.clientX, e.clientY);
      });
    }

    function updateCarPos(svgX, svgY) {
      const activeRoadSlot = document.getElementById('activeRoadSlot');
      const carHandle = document.getElementById('carHandle');
      if (!activeRoadSlot || !carHandle) return;

      const rect = activeRoadSlot.getBoundingClientRect();
      const scaleX = rect.width / 200;
      const scaleY = rect.height / 200;
      carHandle.style.left = `${svgX * scaleX}px`;
      carHandle.style.top = `${svgY * scaleY}px`;
    }

    function onDragMove(clientX, clientY) {
      const activeRoadSlot = document.getElementById('activeRoadSlot');
      const paintedRoad = document.getElementById('paintedRoad');
      if (!activeRoadSlot || !paintedRoad) return;

      const rect = activeRoadSlot.getBoundingClientRect();
      const svgX = ((clientX - rect.left) / rect.width) * 200;
      const svgY = ((clientY - rect.top) / rect.height) * 200;

      const points = CHAR_PATHS[currentChar];
      const nextTarget = points[currentWaypointIdx + 1];
      if (!nextTarget) return;

      const dist = Math.hypot(svgX - nextTarget.x, svgY - nextTarget.y);
      if (dist < 42) {
        currentWaypointIdx++;
        triggerHaptic('step');
        playChimeNote(currentWaypointIdx);
        spawnStars(clientX, clientY);

        const visited = points.slice(0, currentWaypointIdx + 1);
        paintedRoad.setAttribute('d', generatePathD(visited));
        updateCarPos(nextTarget.x, nextTarget.y);

        if (currentWaypointIdx >= points.length - 1) {
          isDragging = false;
          onStepComplete();
        }
      } else {
        updateCarPos(svgX, svgY);
      }
    }

    function spawnStars(x, y) {
      const items = ['⭐', '✨', '🌟', '💖'];
      for (let i = 0; i < 4; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = items[Math.floor(Math.random() * items.length)];
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;
        const angle = (Math.PI * 2 / 4) * i;
        p.style.setProperty('--dx', `${Math.cos(angle) * 36}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * 36}px`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 600);
      }
    }

    // ==========================================
    // 5. 완료 축하 & 다음 단계 진행
    // ==========================================
    function onStepComplete() {
      const course = HANGUL_COURSES[currentChar];
      const step = course.steps[currentStepIdx];

      playVictorySound();
      triggerHaptic('success');

      transformEmoji.textContent = step.emoji;
      transformTitle.textContent = `${step.word} 완성! 🎉`;
      transformDesc.textContent = step.speak;

      if (currentStepIdx >= 3) {
        nextStepBtn.textContent = '다음 글자로 가기! ➜';
        const tabBtn = Array.from(document.querySelectorAll('.letter-tab-btn')).find(b => b.dataset.char === currentChar);
        if (tabBtn) tabBtn.classList.add('cleared');
      } else {
        nextStepBtn.textContent = `다음 단어 (${currentStepIdx + 2}/4) ➜`;
      }

      transformLayer.classList.add('active');
      speakText(step.speak);
    }

    nextStepBtn.addEventListener('click', () => {
      if (currentStepIdx < 3) {
        currentStepIdx++;
        renderStep();
      } else {
        const nextIdx = (HANGUL_LIST.indexOf(currentChar) + 1) % HANGUL_LIST.length;
        currentChar = HANGUL_LIST[nextIdx];
        currentStepIdx = 0;
        updateActiveTab();
        renderStep();
      }
    });

    speakGuideBtn.addEventListener('click', () => {
      const course = HANGUL_COURSES[currentChar];
      const step = course.steps[currentStepIdx];
      speakText(step.prompt);
    });

    window.addEventListener('resize', () => {
      const points = CHAR_PATHS[currentChar];
      if (points) {
        const pt = points[currentWaypointIdx] || points[0];
        updateCarPos(pt.x, pt.y);
      }
    });

    // 시작
    initTabs();
    renderStep();
  </script>
</body>
</html>
