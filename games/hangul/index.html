<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="한글 쓰기">
  <title>✏️ 신나는 마법 한글 쓰기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: "Jua", "Malgun Gothic", sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, #fff3d6 0%, #fff9ec 50%, #f0fdf4 100%);
      color: #3b2c1a;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 상단 네비게이션 & 자음 탭 바 (ㄱ ~ ㅎ) */
    .top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: max(8px, env(safe-area-inset-top)) 10px 8px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 4px solid #fed7aa;
      box-shadow: 0 4px 14px rgba(180, 83, 9, 0.08);
      z-index: 50;
      overflow-x: hidden;
    }

    .home-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fef3c7;
      color: #92400e;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 20px;
      border: 2px solid #fde68a;
      box-shadow: 0 3px 0 #fcd34d;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #fcd34d;
    }

    .letter-tabs {
      flex: 1;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .letter-tabs::-webkit-scrollbar {
      display: none;
    }

    .letter-tab-btn {
      flex-shrink: 0;
      min-width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 3px solid #fed7aa;
      background: #ffffff;
      color: #78350f;
      font-size: 21px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #fde68a;
      transition: transform 0.12s, background 0.12s;
      position: relative;
    }

    .letter-tab-btn.active {
      background: #f97316;
      color: #ffffff;
      border-color: #ea580c;
      box-shadow: 0 3px 0 #c2410c;
      transform: translateY(-2px);
    }

    .letter-tab-btn.cleared::after {
      content: '⭐';
      position: absolute;
      top: -6px;
      right: -6px;
      font-size: 12px;
    }

    /* 진행도 바 (기본 ➔ 단어1 ➔ 단어2 ➔ 받침) */
    .step-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px 2px;
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
    }

    .step-badges {
      display: flex;
      gap: 5px;
    }

    .step-pill {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 14px;
      background: #ffedd5;
      color: #9a3412;
      font-weight: 800;
      border: 1px solid #fed7aa;
    }
    .step-pill.active {
      background: #f97316;
      color: #ffffff;
      border-color: #ea580c;
    }
    .step-pill.done {
      background: #10b981;
      color: #ffffff;
      border-color: #059669;
    }

    .guide-prompt {
      font-size: clamp(14px, 3.4vw, 18px);
      color: #7c2d12;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .speak-guide-btn {
      background: #fef3c7;
      border: 2px solid #fde68a;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 2px 0 #fcd34d;
    }
    .speak-guide-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 메인 무대 컨테이너 */
    .main-board-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 12px 14px;
      position: relative;
    }

    /* 칠판 무대 */
    .board-stage {
      position: relative;
      width: min(94vw, 540px);
      height: min(72vh, 430px);
      background: #ffffff;
      border-radius: 36px;
      border: 6px solid #ffedd5;
      box-shadow: 0 16px 36px rgba(180, 83, 9, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
      touch-action: none;
    }

    .board-grid-pattern {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: 
        linear-gradient(to right, rgba(254, 215, 170, 0.3) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(254, 215, 170, 0.3) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .board-emoji {
      font-size: clamp(44px, 11vw, 68px);
      margin-bottom: 4px;
      animation: emoji-bounce 2.2s infinite ease-in-out;
      z-index: 2;
    }

    @keyframes emoji-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.08); }
    }

    /* 거대한 단어 글자판 레이아웃 */
    .word-letters-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3vw, 24px);
      z-index: 10;
      width: 100%;
    }

    /* 1. 세로 모음 (좌우 결합형) */
    .syllable-horizontal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 2. 가로 모음 (상하 결합형: ㅗ, ㅜ, ㅡ 등) */
    .syllable-vertical {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    /* 3. 받침 결합형 (위에 완성 글자 + 아래에 받침 도로) */
    .syllable-with-final {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 큼직한 한글 글씨 */
    .huge-char-text {
      font-size: clamp(48px, 13vw, 84px);
      font-weight: 800;
      color: #9a3412;
      line-height: 1;
      text-shadow: 0 4px 0 #fed7aa;
    }

    /* 상하 결합 시 아래 모음 */
    .huge-vowel-bottom {
      font-size: clamp(44px, 12vw, 76px);
      font-weight: 800;
      color: #9a3412;
      line-height: 0.9;
      text-shadow: 0 4px 0 #fed7aa;
      margin-top: -4px;
    }

    /* 받침 위 완성 글자 (예: '수', '그', '바', '오') */
    .huge-char-top {
      font-size: clamp(44px, 12vw, 76px);
      font-weight: 800;
      color: #9a3412;
      line-height: 1;
      text-shadow: 0 4px 0 #fed7aa;
      margin-bottom: 2px;
    }

    /* 도로 트랙 빈칸 슬롯 */
    .road-slot-box {
      position: relative;
      background: rgba(255, 247, 237, 0.85);
      border: 4px dashed #f97316;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 3px 8px rgba(249, 115, 22, 0.12);
      animation: slot-pulse 2s infinite ease-in-out;
    }

    .road-slot-box.size-standard {
      width: clamp(120px, 28vw, 175px);
      height: clamp(120px, 28vw, 175px);
    }

    .road-slot-box.size-vertical-top {
      width: clamp(110px, 26vw, 155px);
      height: clamp(95px, 22vw, 135px);
    }

    /* 받침 전용 컴팩트 슬롯 */
    .road-slot-box.size-final-bottom {
      width: clamp(110px, 25vw, 150px);
      height: clamp(80px, 19vw, 115px);
    }

    @keyframes slot-pulse {
      0%, 100% { border-color: #f97316; background: rgba(255, 247, 237, 0.85); }
      50% { border-color: #ea580c; background: #ffedd5; }
    }

    .track-svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* 꼬마 자동차 */
    .car-handle {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffedd5 0%, #fed7aa 100%);
      border: 4px solid #f97316;
      box-shadow: 0 6px 14px rgba(234, 88, 12, 0.4), inset 0 2px 4px #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
      z-index: 30;
      animation: car-bounce 1.5s infinite ease-in-out;
      pointer-events: auto;
    }

    .car-handle:active {
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(1.18);
    }

    @keyframes car-bounce {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }

    /* 완성 합체 축하 팝업 */
    .transform-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.96);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 16px;
      text-align: center;
    }

    .transform-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .transform-emoji {
      font-size: 84px;
      margin-bottom: 6px;
      animation: pop-bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pop-bounce {
      0% { transform: scale(0.2) rotate(-15deg); }
      70% { transform: scale(1.25) rotate(8deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .transform-title {
      font-size: clamp(28px, 6.5vw, 40px);
      color: #ea580c;
      margin-bottom: 4px;
    }

    .transform-desc {
      font-size: clamp(16px, 4vw, 21px);
      color: #7c2d12;
      margin-bottom: 20px;
    }

    .next-btn {
      font-family: inherit;
      font-size: 20px;
      font-weight: 800;
      padding: 14px 30px;
      border-radius: 30px;
      border: none;
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 5px 0 #059669;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .next-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #059669;
    }

    .particle {
      position: absolute;
      pointer-events: none;
      font-size: 24px;
      z-index: 80;
      animation: particle-pop 0.7s forwards ease-out;
    }

    @keyframes particle-pop {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <a href="../../index.html" class="home-btn" title="놀이터 홈으로">🏠 놀이터</a>
    <div class="letter-tabs" id="letterTabs"></div>
  </header>

  <div class="step-header">
    <div class="step-badges">
      <span class="step-pill active" id="pill0">기본 글자</span>
      <span class="step-pill" id="pill1">단어 1</span>
      <span class="step-pill" id="pill2">단어 2</span>
      <span class="step-pill" id="pill3">받침 도전</span>
    </div>
    <div class="guide-prompt">
      <span id="guidePromptText">자동차로 길을 따라가요!</span>
      <button type="button" class="speak-guide-btn" id="speakGuideBtn" title="음성 듣기">🔊</button>
    </div>
  </div>

  <main class="main-board-container">
    <div class="board-stage" id="boardStage">
      <div class="board-grid-pattern"></div>
      <div class="board-emoji" id="boardEmoji">✂️</div>
      <div class="word-letters-stage" id="wordLettersStage"></div>

      <div class="transform-container" id="transformLayer">
        <div class="transform-emoji" id="transformEmoji">✂️</div>
        <h2 class="transform-title" id="transformTitle">가위 완성!</h2>
        <p class="transform-desc" id="transformDesc">가위의 '기역'을 멋지게 채웠어요!</p>
        <button type="button" class="next-btn" id="nextStepBtn">다음으로! ➜</button>
      </div>
    </div>
  </main>

  <script>
    // ==========================================
    // 1. 자음 및 4단계 코스 전면 정비 데이터
    // ==========================================
    const HANGUL_LIST = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

    const CHAR_PATHS = {
      'ㄱ': [{ x: 45, y: 50 }, { x: 155, y: 50 }, { x: 155, y: 155 }],
      'ㄴ': [{ x: 50, y: 45 }, { x: 50, y: 155 }, { x: 155, y: 155 }],
      'ㄷ': [{ x: 150, y: 45 }, { x: 50, y: 45 }, { x: 50, y: 155 }, { x: 155, y: 155 }],
      'ㄹ': [{ x: 45, y: 40 }, { x: 150, y: 40 }, { x: 150, y: 95 }, { x: 45, y: 95 }, { x: 45, y: 155 }, { x: 150, y: 155 }],
      'ㅁ': [{ x: 50, y: 45 }, { x: 150, y: 45 }, { x: 150, y: 155 }, { x: 50, y: 155 }, { x: 50, y: 45 }],
      'ㅂ': [{ x: 50, y: 40 }, { x: 50, y: 155 }, { x: 150, y: 155 }, { x: 150, y: 40 }, { x: 150, y: 100 }, { x: 50, y: 100 }],
      'ㅅ': [{ x: 100, y: 45 }, { x: 50, y: 155 }, { x: 100, y: 95 }, { x: 150, y: 155 }],
      'ㅇ': [{ x: 100, y: 40 }, { x: 155, y: 100 }, { x: 100, y: 160 }, { x: 45, y: 100 }, { x: 100, y: 40 }],
      'ㅈ': [{ x: 50, y: 45 }, { x: 150, y: 45 }, { x: 100, y: 45 }, { x: 50, y: 155 }, { x: 100, y: 95 }, { x: 150, y: 155 }],
      'ㅊ': [{ x: 100, y: 30 }, { x: 100, y: 50 }, { x: 50, y: 50 }, { x: 150, y: 50 }, { x: 100, y: 50 }, { x: 50, y: 155 }, { x: 100, y: 100 }, { x: 150, y: 155 }],
      'ㅋ': [{ x: 45, y: 45 }, { x: 150, y: 45 }, { x: 150, y: 100 }, { x: 45, y: 100 }, { x: 150, y: 100 }, { x: 150, y: 155 }],
      'ㅌ': [{ x: 150, y: 40 }, { x: 50, y: 40 }, { x: 50, y: 100 }, { x: 145, y: 100 }, { x: 50, y: 100 }, { x: 50, y: 155 }, { x: 150, y: 155 }],
      'ㅍ': [{ x: 45, y: 45 }, { x: 155, y: 45 }, { x: 80, y: 45 }, { x: 80, y: 155 }, { x: 120, y: 155 }, { x: 120, y: 45 }, { x: 45, y: 155 }, { x: 155, y: 155 }],
      'ㅎ': [{ x: 100, y: 30 }, { x: 100, y: 45 }, { x: 55, y: 45 }, { x: 145, y: 45 }, { x: 100, y: 80 }, { x: 140, y: 120 }, { x: 100, y: 160 }, { x: 60, y: 120 }, { x: 100, y: 80 }]
    };

    // 정비된 코스 데이터
    // layout 종류:
    // 1. 'single': 단독 자음
    // 2. 'initial-h': 초성 + 세로모음 (좌우 결합) -> vowel, nextChars, firstChar
    // 3. 'initial-v': 초성 + 가로모음 (상하 결합) -> vowel, nextChars, firstChar
    // 4. 'final': 받침 글자 -> firstChar, baseChar (위에 놓일 완성 글자), nextChars
    const HANGUL_COURSES = {
      'ㄱ': {
        name: '기역',
        steps: [
          { layout: 'single', emoji: '🚂', prompt: "'기역'을 먼저 써보아요!", word: '기역', speak: '기역! 칙칙폭폭 기차의 기역!' },
          { layout: 'initial-h', emoji: '✂️', prompt: "가위의 'ㄱ'을 채워주세요!", word: '가위', vowel: 'ㅏ', nextChars: '위', speak: '가위의 기역! 가위 완성!' },
          { layout: 'initial-v', emoji: '🐳', prompt: "고래의 'ㄱ'을 채워주세요!", word: '고래', vowel: 'ㅗ', nextChars: '래', speak: '고래의 기역! 고래 완성!' },
          { layout: 'final', emoji: '🍉', prompt: "수박의 받침 'ㄱ'을 채워주세요!", word: '수박', firstChar: '수', baseChar: '바', nextChars: '', speak: '수박의 받침 기역! 수박 완성!' }
        ]
      },
      'ㄴ': {
        name: '니은',
        steps: [
          { layout: 'single', emoji: '🦋', prompt: "'니은'을 먼저 써보아요!", word: '니은', speak: '니은! 팔랑팔랑 나비의 니은!' },
          { layout: 'initial-h', emoji: '🦋', prompt: "나비의 'ㄴ'을 채워주세요!", word: '나비', vowel: 'ㅏ', nextChars: '비', speak: '나비의 니은! 나비 완성!' },
          { layout: 'initial-v', emoji: '🎵', prompt: "노래의 'ㄴ'을 채워주세요!", word: '노래', vowel: 'ㅗ', nextChars: '래', speak: '노래의 니은! 노래 완성!' },
          { layout: 'final', emoji: '🥕', prompt: "당근의 받침 'ㄴ'을 채워주세요!", word: '당근', firstChar: '당', baseChar: '그', nextChars: '', speak: '당근의 받침 니은! 당근 완성!' }
        ]
      },
      'ㄷ': {
        name: '디귿',
        steps: [
          { layout: 'single', emoji: '🐿️', prompt: "'디귿'을 먼저 써보아요!", word: '디귿', speak: '디귿! 귀여운 다람쥐의 디귿!' },
          { layout: 'initial-h', emoji: '🐿️', prompt: "다람쥐의 'ㄷ'을 채워주세요!", word: '다람쥐', vowel: 'ㅏ', nextChars: '람쥐', speak: '다람쥐의 디귿! 다람쥐 완성!' },
          { layout: 'initial-v', emoji: '🍱', prompt: "도시락의 'ㄷ'을 채워주세요!", word: '도시락', vowel: 'ㅗ', nextChars: '시락', speak: '도시락의 디귿! 도시락 완성!' },
          { layout: 'final', emoji: '🥄', prompt: "숟가락의 받침 'ㄷ'을 채워주세요!", word: '숟가락', firstChar: '', baseChar: '수', nextChars: '가락', speak: '숟가락의 받침 디귿! 숟가락 완성!' }
        ]
      },
      'ㄹ': {
        name: '리을',
        steps: [
          { layout: 'single', emoji: '🚀', prompt: "'리을'을 먼저 써보아요!", word: '리을', speak: '리을! 슝슝 로켓의 리을!' },

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function resumeAudio() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function triggerHaptic(type = 'light') {
      if (!('vibrate' in navigator)) return;
      try {
        if (type === 'light') navigator.vibrate(15);
        else if (type === 'step') navigator.vibrate(25);
        else if (type === 'success') navigator.vibrate([35, 45, 55, 75]);
      } catch (e) {}
    }

    const PITCH_SCALE = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
    function playChimeNote(idx) {
      resumeAudio();
      const freq = PITCH_SCALE[idx % PITCH_SCALE.length];
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.22);
    }

    function playVictorySound() {
      resumeAudio();
      const notes = [
        { f: 523.25, d: 0.12 }, { f: 659.25, d: 0.12 }, { f: 783.99, d: 0.15 },
        { f: 1046.50, d: 0.45 }
      ];
      let t = audioCtx.currentTime;
      notes.forEach(n => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, t);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + n.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + n.d + 0.05);
        t += n.d;
      });
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = 0.95;
      utter.pitch = 1.25;
      window.speechSynthesis.speak(utter);
    }

      letterTabs.innerHTML = '';

        btn.type = 'button';
        btn.className = `letter-tab-btn ${char === currentChar ? 'active' : ''}`;
        btn.dataset.char = char;
        btn.textContent = char;
        btn.addEventListener('click', () => {
          currentChar = char;
          currentStepIdx = 0;
          updateActiveTab();
          renderStep();
        });
        letterTabs.appendChild(btn);

      if (!points || points.length === 0) return '';
      return points.map((p, idx) => (idx === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');
    }

      });

      carHandle.addEventListener('pointerup', (e) => {
        isDragging = false;
        try { carHandle.releasePointerCapture(e.pointerId); } catch (err) {}
      });

      activeRoadSlot.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        onDragMove(e.clientX, e.clientY);
      });
    }

    function updateCarPos(svgX, svgY) {
      const activeRoadSlot = document.getElementById('activeRoadSlot');
      const carHandle = document.getElementById('carHandle');
      if (!activeRoadSlot || !carHandle) return;

      const rect = activeRoadSlot.getBoundingClientRect();
      const scaleX = rect.width / 200;
      const scaleY = rect.height / 200;
      carHandle.style.left = `${svgX * scaleX}px`;
      carHandle.style.top = `${svgY * scaleY}px`;
    }

    function onDragMove(clientX, clientY) {
      const activeRoadSlot = document.getElementById('activeRoadSlot');
      const paintedRoad = document.getElementById('paintedRoad');
      if (!activeRoadSlot || !paintedRoad) return;

      const rect = activeRoadSlot.getBoundingClientRect();
      const svgX = ((clientX - rect.left) / rect.width) * 200;
      const svgY = ((clientY - rect.top) / rect.height) * 200;

      const points = CHAR_PATHS[currentChar];
      const nextTarget = points[currentWaypointIdx + 1];
      if (!nextTarget) return;

      const dist = Math.hypot(svgX - nextTarget.x, svgY - nextTarget.y);
      if (dist < 42) {
        currentWaypointIdx++;
        triggerHaptic('step');
        playChimeNote(currentWaypointIdx);
        spawnStars(clientX, clientY);

        const visited = points.slice(0, currentWaypointIdx + 1);
        paintedRoad.setAttribute('d', generatePathD(visited));
        updateCarPos(nextTarget.x, nextTarget.y);

        if (currentWaypointIdx >= points.length - 1) {
          isDragging = false;
          onStepComplete();
        }
      } else {
        updateCarPos(svgX, svgY);
      }
    }

    function spawnStars(x, y) {
      const items = ['⭐', '✨', '🌟', '💖'];
      for (let i = 0; i < 4; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = items[Math.floor(Math.random() * items.length)];
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;
        const angle = (Math.PI * 2 / 4) * i;
        p.style.setProperty('--dx', `${Math.cos(angle) * 36}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * 36}px`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 600);
      }
    }

    function onStepComplete() {
      const course = HANGUL_COURSES[currentChar];
      const step = course.steps[currentStepIdx];

      playVictorySound();
      triggerHaptic('success');

      transformEmoji.textContent = step.emoji;
      transformTitle.textContent = `${step.word} 완성! 🎉`;
      transformDesc.textContent = step.speak;

      if (currentStepIdx >= 3) {
        nextStepBtn.textContent = '다음 글자로 가기! ➜';
        const tabBtn = Array.from(document.querySelectorAll('.letter-tab-btn')).find(b => b.dataset.char === currentChar);
        if (tabBtn) tabBtn.classList.add('cleared');
      } else {
        nextStepBtn.textContent = `다음 단어 (${currentStepIdx + 2}/4) ➜`;
      }

      transformLayer.classList.add('active');
      speakText(step.speak);
    }

    nextStepBtn.addEventListener('click', () => {
      if (currentStepIdx < 3) {
        currentStepIdx++;
        renderStep();
      } else {
        const nextIdx = (HANGUL_LIST.indexOf(currentChar) + 1) % HANGUL_LIST.length;
        currentChar = HANGUL_LIST[nextIdx];
        currentStepIdx = 0;
        updateActiveTab();
        renderStep();
      }
    });

    speakGuideBtn.addEventListener('click', () => {
      const course = HANGUL_COURSES[currentChar];
      const step = course.steps[currentStepIdx];
      speakText(step.prompt);
    });

    window.addEventListener('resize', () => {
      const points = CHAR_PATHS[currentChar];
      if (points) {
        const pt = points[currentWaypointIdx] || points[0];
        updateCarPos(pt.x, pt.y);
      }
    });

    // 시작
    initTabs();
    renderStep();
  </script>
</body>
</html>
