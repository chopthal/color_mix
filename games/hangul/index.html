<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="한글 쓰기">
  <title>✏️ 신나는 마법 한글 쓰기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: "Jua", "Malgun Gothic", sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, #fff3d6 0%, #fff9ec 50%, #f0fdf4 100%);
      color: #3b2c1a;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 상단 네비게이션 & 자음 탭 바 (ㄱ ~ ㅎ) */
    .top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: max(8px, env(safe-area-inset-top)) 10px 8px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 4px solid #fed7aa;
      box-shadow: 0 4px 14px rgba(180, 83, 9, 0.08);
      z-index: 50;
      overflow-x: hidden;
    }

    .home-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fef3c7;
      color: #92400e;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 20px;
      border: 2px solid #fde68a;
      box-shadow: 0 3px 0 #fcd34d;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #fcd34d;
    }

    .letter-tabs {
      flex: 1;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .letter-tabs::-webkit-scrollbar {
      display: none;
    }

    .letter-tab-btn {
      flex-shrink: 0;
      min-width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 3px solid #fed7aa;
      background: #ffffff;
      color: #78350f;
      font-size: 21px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 0 #fde68a;
      transition: transform 0.12s, background 0.12s;
      position: relative;
    }

    .letter-tab-btn.active {
      background: #f97316;
      color: #ffffff;
      border-color: #ea580c;
      box-shadow: 0 3px 0 #c2410c;
      transform: translateY(-2px);
    }

    .letter-tab-btn.cleared::after {
      content: '⭐';
      position: absolute;
      top: -6px;
      right: -6px;
      font-size: 12px;
    }

    /* 진행도 바 (기본 ➔ 단어1 ➔ 단어2 ➔ 3단계) */
    .step-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px 2px;
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
    }

    .step-badges {
      display: flex;
      gap: 5px;
    }

    .step-pill {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 14px;
      background: #ffedd5;
      color: #9a3412;
      font-weight: 800;
      border: 1px solid #fed7aa;
    }
    .step-pill.active {
      background: #f97316;
      color: #ffffff;
      border-color: #ea580c;
    }
    .step-pill.done {
      background: #10b981;
      color: #ffffff;
      border-color: #059669;
    }

    .guide-prompt {
      font-size: clamp(14px, 3.4vw, 18px);
      color: #7c2d12;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .speak-guide-btn {
      background: #fef3c7;
      border: 2px solid #fde68a;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 2px 0 #fcd34d;
    }
    .speak-guide-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 메인 무대 컨테이너 */
    .main-board-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 12px 14px;
      position: relative;
    }

    /* 칠판 무대 */
    .board-stage {
      position: relative;
      width: min(94vw, 540px);
      height: min(72vh, 430px);
      background: #ffffff;
      border-radius: 36px;
      border: 6px solid #ffedd5;
      box-shadow: 0 16px 36px rgba(180, 83, 9, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
      touch-action: none;
    }

    .board-grid-pattern {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: 
        linear-gradient(to right, rgba(254, 215, 170, 0.3) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(254, 215, 170, 0.3) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .board-emoji {
      font-size: clamp(44px, 11vw, 68px);
      margin-bottom: 4px;
      animation: emoji-bounce 2.2s infinite ease-in-out;
      z-index: 2;
    }

    @keyframes emoji-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.08); }
    }

    /* 거대한 단어 글자판 레이아웃 */
    .word-letters-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 3vw, 24px);
      z-index: 10;
      width: 100%;
    }

    /* 1. 세로 모음 (좌우 결합형) */
    .syllable-horizontal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 2. 가로 모음 (상하 결합형: ㅗ, ㅜ, ㅡ 등) */
    .syllable-vertical {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    /* 3. 받침 결합형 (위에 완성 글자 + 아래에 받침 도로) */
    .syllable-with-final {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 큼직한 한글 글씨 */
    .huge-char-text {
      font-size: clamp(48px, 13vw, 84px);
      font-weight: 800;
      color: #9a3412;
      line-height: 1;
      text-shadow: 0 4px 0 #fed7aa;
    }

    .huge-vowel-bottom {
      font-size: clamp(44px, 12vw, 76px);
      font-weight: 800;
      color: #9a3412;
      line-height: 0.9;
      text-shadow: 0 4px 0 #fed7aa;
      margin-top: -4px;
    }

    .huge-char-top {
      font-size: clamp(44px, 12vw, 76px);
      font-weight: 800;
      color: #9a3412;
      line-height: 1;
      text-shadow: 0 4px 0 #fed7aa;
      margin-bottom: 2px;
    }

    /* 도로 트랙 빈칸 슬롯 */
    .road-slot-box {
      position: relative;
      background: rgba(255, 247, 237, 0.85);
      border: 4px dashed #f97316;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 3px 8px rgba(249, 115, 22, 0.12);
      animation: slot-pulse 2s infinite ease-in-out;
    }

    .road-slot-box.size-standard {
      width: clamp(120px, 28vw, 175px);
      height: clamp(120px, 28vw, 175px);
    }

    .road-slot-box.size-vertical-top {
      width: clamp(110px, 26vw, 155px);
      height: clamp(95px, 22vw, 135px);
    }

    .road-slot-box.size-final-bottom {
      width: clamp(110px, 25vw, 150px);
      height: clamp(80px, 19vw, 115px);
    }

    @keyframes slot-pulse {
      0%, 100% { border-color: #f97316; background: rgba(255, 247, 237, 0.85); }
      50% { border-color: #ea580c; background: #ffedd5; }
    }

    .track-svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* 꼬마 자동차 */
    .car-handle {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffedd5 0%, #fed7aa 100%);
      border: 4px solid #f97316;
      box-shadow: 0 6px 14px rgba(234, 88, 12, 0.4), inset 0 2px 4px #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
      z-index: 30;
      animation: car-bounce 1.5s infinite ease-in-out;
      pointer-events: auto;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .car-handle:active {
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(1.18);
    }

    /* 다음 획으로 뿅! 점프할 때 애니메이션 */
    .car-handle.hopping {
      animation: car-hop 0.4s ease-out !important;
    }

    @keyframes car-hop {
      0% { transform: translate(-50%, -50%) scale(1); }
      40% { transform: translate(-50%, -75%) scale(1.35) rotate(-10deg); }
      70% { transform: translate(-50%, -45%) scale(0.9) rotate(5deg); }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    }

    @keyframes car-bounce {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.12); }
    }

    /* 완성 합체 축하 팝업 */
    .transform-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.96);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 16px;
      text-align: center;
    }

    .transform-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .transform-emoji {
      font-size: 84px;
      margin-bottom: 6px;
      animation: pop-bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pop-bounce {
      0% { transform: scale(0.2) rotate(-15deg); }
      70% { transform: scale(1.25) rotate(8deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .transform-title {
      font-size: clamp(28px, 6.5vw, 40px);
      color: #ea580c;
      margin-bottom: 4px;
    }

    .transform-desc {
      font-size: clamp(16px, 4vw, 21px);
      color: #7c2d12;
      margin-bottom: 20px;
    }

    .next-btn {
      font-family: inherit;
      font-size: 20px;
      font-weight: 800;
      padding: 14px 30px;
      border-radius: 30px;
      border: none;
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 5px 0 #059669;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .next-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #059669;
    }

    .particle {
      position: absolute;
      pointer-events: none;
      font-size: 24px;
      z-index: 80;
      animation: particle-pop 0.7s forwards ease-out;
    }

    @keyframes particle-pop {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <a href="../../index.html" class="home-btn" title="놀이터 홈으로">🏠 놀이터</a>
    <div class="letter-tabs" id="letterTabs"></div>
  </header>

  <div class="step-header">
    <div class="step-badges">
      <span class="step-pill active" id="pill0">기본 글자</span>
      <span class="step-pill" id="pill1">단어 1</span>
      <span class="step-pill" id="pill2">단어 2</span>
      <span class="step-pill" id="pill3">3단계</span>
    </div>
    <div class="guide-prompt">
      <span id="guidePromptText">자동차로 길을 따라가요!</span>
      <button type="button" class="speak-guide-btn" id="speakGuideBtn" title="음성 듣기">🔊</button>
    </div>
  </div>

  <main class="main-board-container">
    <div class="board-stage" id="boardStage">
      <div class="board-grid-pattern"></div>
      <div class="board-emoji" id="boardEmoji">✂️</div>
      <div class="word-letters-stage" id="wordLettersStage"></div>

      <div class="transform-container" id="transformLayer">
        <div class="transform-emoji" id="transformEmoji">✂️</div>
        <h2 class="transform-title" id="transformTitle">가위 완성!</h2>
        <p class="transform-desc" id="transformDesc">가위의 '기역'을 멋지게 채웠어요!</p>
        <button type="button" class="next-btn" id="nextStepBtn">다음으로! ➜</button>
      </div>
    </div>
  </main>

  <script>
    // ==========================================
    // 1. 원형 궤도 생성 헬퍼 (반시계 정통 획순 완벽한 원)
    // ==========================================
    function createCirclePoints(cx, cy, r, count = 16) {
      const pts = [];
      for (let i = 0; i <= count; i++) {
        // -90도(12시 방향)에서 시작해 반시계 방향으로 회전
        const angle = -Math.PI / 2 - (i / count) * Math.PI * 2;
        pts.push({
          x: Math.round(cx + Math.cos(angle) * r),
          y: Math.round(cy + Math.sin(angle) * r)
        });
      }
      return pts;
    }

    // ==========================================
    // 2. 정통 획순(Strokes) 자음 데이터 (ㄱ ~ ㅎ)
    // ==========================================
    const HANGUL_LIST = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

    const CHAR_STROKES = {
      // ㄱ: 1획 (가로 ➔ 세로)
      'ㄱ': [
        [{ x: 45, y: 50 }, { x: 155, y: 50 }, { x: 155, y: 155 }]
      ],
      // ㄴ: 1획 (세로 ➔ 가로)
      'ㄴ': [
        [{ x: 50, y: 45 }, { x: 50, y: 155 }, { x: 155, y: 155 }]
      ],
      // ㄷ: 2획 (1: 위 가로 ➡️, 2: 세로 ⬇️ ➔ 아래 가로 ➡️)
      'ㄷ': [
        [{ x: 50, y: 50 }, { x: 150, y: 50 }],
        [{ x: 50, y: 50 }, { x: 50, y: 155 }, { x: 150, y: 155 }]
      ],
      // ㄹ: 3획 (1: ㄱ형태 ➡️ ⬇️, 2: 가운데 가로 ➡️, 3: ㄴ형태 ⬇️ ➡️)
      'ㄹ': [
        [{ x: 50, y: 45 }, { x: 150, y: 45 }, { x: 150, y: 95 }],
        [{ x: 50, y: 95 }, { x: 150, y: 95 }],
        [{ x: 50, y: 95 }, { x: 50, y: 155 }, { x: 150, y: 155 }]
      ],
      // ㅁ: 3획 (정통 획순 완벽 반영!) ⭐
      // 1획: 왼쪽 기둥 (위 ➔ 아래 ⬇️)
      // 2획: 위 가로 ➡️ 꺾어서 오른쪽 기둥 ⬇️
      // 3획: 바닥 가로선 닫기 ➡️
      'ㅁ': [
        [{ x: 50, y: 45 }, { x: 50, y: 155 }],
        [{ x: 50, y: 45 }, { x: 150, y: 45 }, { x: 150, y: 155 }],
        [{ x: 50, y: 155 }, { x: 150, y: 155 }]
      ],
      // ㅂ: 4획 (정통 획순 완벽 반영!) ⭐
      // 1획: 왼쪽 기둥 (위 ➔ 아래 ⬇️)
      // 2획: 오른쪽 기둥 (위 ➔ 아래 ⬇️)
      // 3획: 가운데 가로선 (왼 ➔ 오른 ➡️)
      // 4획: 바닥 가로선 (왼 ➔ 오른 ➡️)
      'ㅂ': [
        [{ x: 50, y: 40 }, { x: 50, y: 155 }],
        [{ x: 150, y: 40 }, { x: 150, y: 155 }],
        [{ x: 50, y: 95 }, { x: 150, y: 95 }],
        [{ x: 50, y: 155 }, { x: 150, y: 155 }]
      ],
      // ㅅ: 2획 (1: 왼쪽 빗금 ↙️, 2: 오른쪽 빗금 ↘️)
      'ㅅ': [
        [{ x: 100, y: 45 }, { x: 45, y: 155 }],
        [{ x: 100, y: 85 }, { x: 155, y: 155 }]
      ],
      // ㅇ: 1획 (12시부터 반시계 완벽한 동그라미 ⭕) ⭐
      'ㅇ': [
        createCirclePoints(100, 100, 55, 16)
      ],
      // ㅈ: 2획 (자연스러운 손글씨 필순: 1: 가로 ➡️ 코너 꺾어 좌하향 ↙️, 2: 우하향 빗금 ↘️) ⭐
      'ㅈ': [
        [{ x: 50, y: 45 }, { x: 150, y: 45 }, { x: 55, y: 155 }],
        [{ x: 105, y: 100 }, { x: 155, y: 155 }]
      ],
      // ㅊ: 3획 (자연스러운 손글씨 필순: 1: 꼭지 ⬇️, 2: 가로 ➡️ 코너 꺾어 좌하향 ↙️, 3: 우하향 빗금 ↘️) ⭐
      'ㅊ': [
        [{ x: 100, y: 22 }, { x: 100, y: 46 }],
        [{ x: 50, y: 50 }, { x: 150, y: 50 }, { x: 55, y: 155 }],
        [{ x: 105, y: 102 }, { x: 155, y: 155 }]
      ],
      // ㅋ: 2획 (1: ㄱ형태 ➡️ ⬇️, 2: 가운데 가로 ➡️)
      'ㅋ': [
        [{ x: 45, y: 45 }, { x: 155, y: 45 }, { x: 155, y: 155 }],
        [{ x: 45, y: 100 }, { x: 155, y: 100 }]
      ],
      // ㅌ: 3획 (1: 위 가로 ➡️, 2: 가운데 가로 ➡️, 3: ㄴ형태 ⬇️ ➡️)
      'ㅌ': [
        [{ x: 50, y: 45 }, { x: 150, y: 45 }],
        [{ x: 50, y: 100 }, { x: 145, y: 100 }],
        [{ x: 50, y: 45 }, { x: 50, y: 155 }, { x: 150, y: 155 }]
      ],
      // ㅍ: 4획 (1: 위 가로 ➡️, 2: 왼쪽 기둥 ⬇️, 3: 오른쪽 기둥 ⬇️, 4: 바닥 가로 ➡️)
      'ㅍ': [
        [{ x: 45, y: 45 }, { x: 155, y: 45 }],
        [{ x: 80, y: 45 }, { x: 80, y: 155 }],
        [{ x: 120, y: 45 }, { x: 120, y: 155 }],
        [{ x: 45, y: 155 }, { x: 155, y: 155 }]
      ],
      // ㅎ: 3획 (1: 꼭지 ⬇️, 2: 가로선 ➡️, 3: 아래 완벽한 동그라미 ⭕) ⭐
      'ㅎ': [
        [{ x: 100, y: 24 }, { x: 100, y: 46 }],
        [{ x: 55, y: 48 }, { x: 145, y: 48 }],
        createCirclePoints(100, 118, 38, 14)
      ]
    };

    // 14개 자음 전체 4단계 코스 (전수 검증 완료)
    const HANGUL_COURSES = {
      'ㄱ': {
        name: '기역',

    // ==========================================
    // 3. 오디오 & 햅틱
    // ==========================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function resumeAudio() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function triggerHaptic(type = 'light') {
      if (!('vibrate' in navigator)) return;
      try {
        if (type === 'light') navigator.vibrate(15);
        else if (type === 'step') navigator.vibrate(25);
        else if (type === 'hop') navigator.vibrate([20, 30, 40]);
        else if (type === 'success') navigator.vibrate([35, 45, 55, 75]);
      } catch (e) {}
    }

    const PITCH_SCALE = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
    function playChimeNote(idx) {
      resumeAudio();
      const freq = PITCH_SCALE[idx % PITCH_SCALE.length];
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.22);
    }

    // 획 끝날 때 "뾰로롱!" 점프 사운드
    function playHopSound() {
      resumeAudio();
      const notes = [659.25, 880.00];
      notes.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const t = audioCtx.currentTime + i * 0.08;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.14);
      });
    }

    function playVictorySound() {
      resumeAudio();
      const notes = [
        { f: 523.25, d: 0.12 }, { f: 659.25, d: 0.12 }, { f: 783.99, d: 0.15 },
        { f: 1046.50, d: 0.45 }
      ];
      let t = audioCtx.currentTime;
      notes.forEach(n => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n.f, t);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + n.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + n.d + 0.05);
        t += n.d;
      });
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = 0.95;
      utter.pitch = 1.25;
      window.speechSynthesis.speak(utter);
    }

    function initTabs() {
      letterTabs.innerHTML = '';
      HANGUL_LIST.forEach(char => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `letter-tab-btn ${char === currentChar ? 'active' : ''}`;
        btn.dataset.char = char;
        btn.textContent = char;
        btn.addEventListener('click', () => {
          currentChar = char;
          currentStepIdx = 0;
          updateActiveTab();
          renderStep();
        });
        letterTabs.appendChild(btn);
      });
    }

    function updateActiveTab() {
      document.querySelectorAll('.letter-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.char === currentChar);
      });
    }

    function generatePathD(points) {
      if (!points || points.length === 0) return '';
      return points.map((p, idx) => (idx === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');
    }

      currentWaypointIdx = 0;

      const step = course.steps[currentStepIdx];

      for (let i = 0; i < 4; i++) {
        const pill = document.getElementById(`pill${i}`);

        if (i < currentStepIdx) pill.classList.add('done');
        else if (i === currentStepIdx) pill.classList.add('active');

      } else if (step.layout === 'initial-h') {
        // [세로 모음: 좌-우]
        const firstPrefix = step.firstChar ? `<span class="huge-char-text">${step.firstChar}</span>` : '';
        const nextSuffix = step.nextChars ? `<span class="huge-char-text">${step.nextChars}</span>` : '';
        wordLettersStage.innerHTML = `
          ${firstPrefix}
          <div class="syllable-horizontal">
            <div class="road-slot-box size-standard" id="activeRoadSlot">
              <svg class="track-svg" id="trackSvg" viewBox="0 0 200 200">
                <g id="baseRoadGroup"></g>
                <g id="centerDashesGroup"></g>
                <g id="paintedRoadGroup"></g>
              </svg>
              <div class="car-handle" id="carHandle">🚗</div>
            </div>
            <span class="huge-char-text">${step.vowel}</span>
          </div>
          ${nextSuffix}
        `;
      } else if (step.layout === 'initial-v') {
        // [가로 모음: 상-하]
        const firstPrefix = step.firstChar ? `<span class="huge-char-text" style="margin-right: 8px;">${step.firstChar}</span>` : '';
        const nextSuffix = step.nextChars ? `<span class="huge-char-text" style="margin-left: 8px;">${step.nextChars}</span>` : '';
        wordLettersStage.innerHTML = `
          ${firstPrefix}
          <div class="syllable-vertical">
            <div class="road-slot-box size-vertical-top" id="activeRoadSlot">
              <svg class="track-svg" id="trackSvg" viewBox="0 0 200 200">
                <g id="baseRoadGroup"></g>
                <g id="centerDashesGroup"></g>
                <g id="paintedRoadGroup"></g>
              </svg>
              <div class="car-handle" id="carHandle">🚗</div>
            </div>
            <span class="huge-vowel-bottom">${step.vowel}</span>
          </div>
          ${nextSuffix}
        `;
      } else if (step.layout === 'final') {
        // [받침: 위에 완성 글자 + 아래에 도로]
        const firstPrefix = step.firstChar ? `<span class="huge-char-text" style="margin-right: 12px;">${step.firstChar}</span>` : '';
        const nextSuffix = step.nextChars ? `<span class="huge-char-text" style="margin-left: 12px;">${step.nextChars}</span>` : '';
        wordLettersStage.innerHTML = `
          ${firstPrefix}
          <div class="syllable-with-final">
            <span class="huge-char-top">${step.baseChar}</span>
            <div class="road-slot-box size-final-bottom" id="activeRoadSlot">
              <svg class="track-svg" id="trackSvg" viewBox="0 0 200 200">
                <g id="baseRoadGroup"></g>
                <g id="centerDashesGroup"></g>
                <g id="paintedRoadGroup"></g>
              </svg>
              <div class="car-handle" id="carHandle">🚗</div>
            </div>
          </div>
          ${nextSuffix}
        `;
      }

      setupMultiStrokeTracks();

      setTimeout(() => {
        speakText(step.prompt);
      }, 350);
    }

    // 다중 획 트랙 초기화 및 렌더링
    function setupMultiStrokeTracks() {
      const baseRoadGroup = document.getElementById('baseRoadGroup');
      const centerDashesGroup = document.getElementById('centerDashesGroup');
      const paintedRoadGroup = document.getElementById('paintedRoadGroup');
      const carHandle = document.getElementById('carHandle');
      const activeRoadSlot = document.getElementById('activeRoadSlot');

      baseRoadGroup.innerHTML = '';
      centerDashesGroup.innerHTML = '';
      paintedRoadGroup.innerHTML = '';

      const strokes = CHAR_STROKES[currentChar];

      // 모든 획의 기본 회색 아스팔트 + 점선 미리 그리기
      strokes.forEach(strokePoints => {
        const d = generatePathD(strokePoints);

        const baseP = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        baseP.setAttribute('d', d);
        baseP.setAttribute('fill', 'none');
        baseP.setAttribute('stroke', '#e2e8f0');
        baseP.setAttribute('stroke-width', '38');
        baseP.setAttribute('stroke-linecap', 'round');
        baseP.setAttribute('stroke-linejoin', 'round');
        baseRoadGroup.appendChild(baseP);

        const dashP = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        dashP.setAttribute('d', d);
        dashP.setAttribute('fill', 'none');
        dashP.setAttribute('stroke', '#cbd5e1');
        dashP.setAttribute('stroke-width', '3');
        dashP.setAttribute('stroke-dasharray', '10,10');
        dashP.setAttribute('stroke-linecap', 'round');
        dashP.setAttribute('stroke-linejoin', 'round');
        centerDashesGroup.appendChild(dashP);
      });

      // 1번째 획의 주황색 도로 패스 엘리먼트 생성
      createActivePaintedPath();

      // 자동차를 1번째 획의 시작점에 배치
      updateCarPos(strokes[0][0].x, strokes[0][0].y);

      // 드래그 이벤트 연결
      carHandle.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        isDragging = true;
        carHandle.setPointerCapture(e.pointerId);
        resumeAudio();
        triggerHaptic('light');
      });

      carHandle.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        onDragMove(e.clientX, e.clientY);
      });

      carHandle.addEventListener('pointerup', (e) => {
        isDragging = false;
        try { carHandle.releasePointerCapture(e.pointerId); } catch (err) {}
      });

      activeRoadSlot.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        onDragMove(e.clientX, e.clientY);
      });
    }

    function createActivePaintedPath() {
      const paintedRoadGroup = document.getElementById('paintedRoadGroup');
      const activeP = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      activeP.id = `paintedPath_${currentStrokeIdx}`;
      activeP.setAttribute('d', '');
      activeP.setAttribute('fill', 'none');
      activeP.setAttribute('stroke', '#f59e0b');
      activeP.setAttribute('stroke-width', '38');
      activeP.setAttribute('stroke-linecap', 'round');
      activeP.setAttribute('stroke-linejoin', 'round');
      paintedRoadGroup.appendChild(activeP);
    }

    function updateCarPos(svgX, svgY) {
      const activeRoadSlot = document.getElementById('activeRoadSlot');
      const carHandle = document.getElementById('carHandle');
      if (!activeRoadSlot || !carHandle) return;

      const rect = activeRoadSlot.getBoundingClientRect();
      const scaleX = rect.width / 200;
      const scaleY = rect.height / 200;
      carHandle.style.left = `${svgX * scaleX}px`;
      carHandle.style.top = `${svgY * scaleY}px`;
    }

    function onDragMove(clientX, clientY) {
      const activeRoadSlot = document.getElementById('activeRoadSlot');
      if (!activeRoadSlot) return;

      const rect = activeRoadSlot.getBoundingClientRect();
      const svgX = ((clientX - rect.left) / rect.width) * 200;
      const svgY = ((clientY - rect.top) / rect.height) * 200;

      const strokes = CHAR_STROKES[currentChar];
      const currentStrokePoints = strokes[currentStrokeIdx];
      const nextTarget = currentStrokePoints[currentWaypointIdx + 1];
      if (!nextTarget) return;

      const dist = Math.hypot(svgX - nextTarget.x, svgY - nextTarget.y);
      if (dist < 42) {
        currentWaypointIdx++;
        triggerHaptic('step');
        playChimeNote(currentWaypointIdx);
        spawnStars(clientX, clientY);

        // 현재 획 칠하기 업데이트
        const visited = currentStrokePoints.slice(0, currentWaypointIdx + 1);
        const currP = document.getElementById(`paintedPath_${currentStrokeIdx}`);
        if (currP) currP.setAttribute('d', generatePathD(visited));

        updateCarPos(nextTarget.x, nextTarget.y);

        // 현재 획 완료 검사!
        if (currentWaypointIdx >= currentStrokePoints.length - 1) {
          isDragging = false;
          // 다음 획이 남아있는지 확인
          if (currentStrokeIdx < strokes.length - 1) {
            hopToNextStroke();
          } else {
            // 모든 획 최종 완료!
            onStepComplete();
          }
        }
      } else {
        updateCarPos(svgX, svgY);
      }
    }

    // 다음 획으로 뿅! 점프 이동 애니메이션
    function hopToNextStroke() {
      currentStrokeIdx++;
      currentWaypointIdx = 0;

      playHopSound();
      triggerHaptic('hop');

      const carHandle = document.getElementById('carHandle');
      carHandle.classList.remove('hopping');
      void carHandle.offsetWidth;
      carHandle.classList.add('hopping');

      // 새 획을 위한 패스 엘리먼트 생성
      createActivePaintedPath();

      // 다음 획의 시작점으로 자동차 뿅! 이동
      const strokes = CHAR_STROKES[currentChar];
      const nextStartPoint = strokes[currentStrokeIdx][0];
      updateCarPos(nextStartPoint.x, nextStartPoint.y);

      // 반짝이 파티클 점프 효과
      const rect = carHandle.getBoundingClientRect();
      spawnStars(rect.left + rect.width / 2, rect.top + rect.height / 2);
    }

    function spawnStars(x, y) {
      const items = ['⭐', '✨', '🌟', '💖'];
      for (let i = 0; i < 4; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = items[Math.floor(Math.random() * items.length)];
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;
        const angle = (Math.PI * 2 / 4) * i;
        p.style.setProperty('--dx', `${Math.cos(angle) * 36}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * 36}px`);
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 600);
      }
    }

    function onStepComplete() {
      const course = HANGUL_COURSES[currentChar];
      const step = course.steps[currentStepIdx];

      playVictorySound();
      triggerHaptic('success');

      transformEmoji.textContent = step.emoji;
      transformTitle.textContent = `${step.word} 완성! 🎉`;
      transformDesc.textContent = step.speak;

      if (currentStepIdx >= 3) {
        nextStepBtn.textContent = '다음 글자로 가기! ➜';
        const tabBtn = Array.from(document.querySelectorAll('.letter-tab-btn')).find(b => b.dataset.char === currentChar);
        if (tabBtn) tabBtn.classList.add('cleared');
      } else {
        nextStepBtn.textContent = `다음 단어 (${currentStepIdx + 2}/4) ➜`;
      }

      transformLayer.classList.add('active');
      speakText(step.speak);
    }

    nextStepBtn.addEventListener('click', () => {
      if (currentStepIdx < 3) {
        currentStepIdx++;
        renderStep();
      } else {
        const nextIdx = (HANGUL_LIST.indexOf(currentChar) + 1) % HANGUL_LIST.length;
        currentChar = HANGUL_LIST[nextIdx];
        currentStepIdx = 0;
        updateActiveTab();
        renderStep();
      }
    });

    speakGuideBtn.addEventListener('click', () => {
      const course = HANGUL_COURSES[currentChar];
      const step = course.steps[currentStepIdx];
      speakText(step.prompt);
    });

    window.addEventListener('resize', () => {
      const strokes = CHAR_STROKES[currentChar];
      if (strokes && strokes[currentStrokeIdx]) {
        const pt = strokes[currentStrokeIdx][currentWaypointIdx] || strokes[currentStrokeIdx][0];
        updateCarPos(pt.x, pt.y);
      }
    });

    // 시작
    initTabs();
    renderStep();
  </script>
</body>
</html>
