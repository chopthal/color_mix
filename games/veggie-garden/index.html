<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="꼬물꼬물 텃밭">
  <title>꼬물꼬물 텃밭</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <meta name="theme-color" content="#b8e0a8">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">

  <script>
    (function () {
      if (location.protocol === 'file:') return;
      var p = location.pathname;
      if (/\/$/.test(p) || /\.html?$/.test(p)) return;
      location.replace(p + '/' + location.search + location.hash);
    })();
  </script>

  <link rel="stylesheet" href="../../fonts/fonts.css">
  <link rel="stylesheet" href="../_shared/kit.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="top-bar">
    <a class="nav-home" href="../../index.html" aria-label="놀이터">
      <span aria-hidden="true">🏠</span>
      <span>놀이터</span>
    </a>
    <h1 class="app-title">꼬물꼬물 텃밭</h1>
    <button class="btn-icon" id="btnSound" type="button" aria-label="소리">🔊</button>
  </header>

  <main class="stage" id="stage">

    <!-- ===== 밭 ===== -->
    <section class="scene scene-field is-active" id="sceneField" aria-label="밭">
      <div class="sky" aria-hidden="true">
        <div class="sun"></div>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
      </div>

      <div class="field-tools">
        <div class="seed-pouch" id="seedPouch" role="group" aria-label="씨앗">
          <button class="seed-btn is-selected" type="button" data-crop="carrot" aria-label="당근" aria-pressed="true">
            <span class="seed-swatch seed-carrot" aria-hidden="true"></span>
          </button>
          <button class="seed-btn" type="button" data-crop="tomato" aria-label="토마토" aria-pressed="false">
            <span class="seed-swatch seed-tomato" aria-hidden="true"></span>
          </button>
          <button class="seed-btn" type="button" data-crop="corn" aria-label="옥수수" aria-pressed="false">
            <span class="seed-swatch seed-corn" aria-hidden="true"></span>
          </button>
        </div>

        <button class="tool-can" id="waterCan" type="button" aria-label="물" aria-pressed="false">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <ellipse cx="28" cy="38" rx="18" ry="14" fill="#6eb5e8"/>
            <rect x="40" y="28" width="18" height="8" rx="3" fill="#5a9fd4"/>
            <path d="M14 28 Q18 14 28 16 Q34 17 36 26" fill="none" stroke="#4a8fc0" stroke-width="5" stroke-linecap="round"/>
            <circle cx="22" cy="36" r="3" fill="#fff" opacity=".45"/>
          </svg>
        </button>
      </div>

      <div class="plots" id="plots" role="grid" aria-label="밭"></div>

      <div class="field-hint" id="fieldHint" hidden></div>
    </section>

    <!-- ===== 창고 ===== -->
    <section class="scene scene-warehouse" id="sceneWarehouse" aria-label="창고" hidden>
      <div class="warehouse-wall" aria-hidden="true"></div>
      <div class="shelves" id="shelves" aria-label="선반"></div>
      <div class="full-flash" id="fullFlash" hidden>가득!</div>
    </section>

    <!-- ===== 부엌 ===== -->
    <section class="scene scene-kitchen" id="sceneKitchen" aria-label="부엌" hidden>
      <div class="kitchen-bg" aria-hidden="true"></div>

      <div class="friend-row">
        <div class="friend-bubble" id="friendBubble" hidden></div>
        <div class="friend-spot" id="friendSpot" aria-hidden="true">
          <div class="friend-face" id="friendFace"></div>
          <div class="hearts" id="hearts" aria-hidden="true"></div>
        </div>
      </div>

      <div class="kitchen-empty" id="kitchenEmpty" hidden>
        <p class="empty-msg">밭에 가 볼까?</p>
      </div>

      <div class="kitchen-work" id="kitchenWork">
        <div class="tool-tabs" role="tablist">
          <button class="tool-tab is-on" type="button" data-tool="mixer" role="tab" aria-selected="true" aria-label="믹서">
            <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="8" width="20" height="28" rx="6" fill="#c9d6e8"/><circle cx="24" cy="22" r="8" fill="#8eb4d8"/><rect x="18" y="34" width="12" height="6" rx="2" fill="#7a90a8"/></svg>
          </button>
          <button class="tool-tab" type="button" data-tool="salad" role="tab" aria-selected="false" aria-label="샐러드">
            <svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="28" rx="18" ry="10" fill="#f0e6c8"/><ellipse cx="24" cy="24" rx="16" ry="8" fill="#a8d86e"/><circle cx="18" cy="24" r="3" fill="#e85d5d"/><circle cx="28" cy="22" r="3" fill="#ff9b4a"/></svg>
          </button>
        </div>

        <div class="pantry" id="pantry" aria-label="재료"></div>

        <div class="cook-slots" id="cookSlots" aria-label="넣기"></div>

        <!-- 믹서 -->
        <div class="cook-station" id="mixerStation">
          <div class="mixer-jar" id="mixerJar">
            <div class="juice" id="juice"></div>
          </div>
          <button class="hold-btn" id="blendBtn" type="button" aria-label="믹서">꾹</button>
        </div>

        <!-- 샐러드 -->
        <div class="cook-station" id="saladStation" hidden>
          <div class="salad-bowl" id="saladBowl" role="button" tabindex="0" aria-label="젓기">
            <svg class="stir-ring" viewBox="0 0 100 100" aria-hidden="true">
              <circle class="ring-track" cx="50" cy="50" r="46"></circle>
              <circle class="ring-fill" id="ringFill" cx="50" cy="50" r="46"></circle>
            </svg>
            <div class="salad-mix" id="saladMix"></div>
            <div class="stir-hand" aria-hidden="true">👆</div>
          </div>
        </div>
      </div>

      <div class="recipe-toast" id="recipeToast" hidden>
        <span>새 요리!</span>
        <div class="recipe-card" id="recipeCard"></div>
      </div>
    </section>

    <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

    <!-- 하단 장면 탭 (그림만) -->
    <nav class="scene-tabs" id="sceneTabs" aria-label="장면">
      <button class="scene-tab is-on" type="button" data-scene="field" aria-label="밭" aria-pressed="true">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <rect x="4" y="30" width="48" height="18" rx="4" fill="#8b6b3d"/>
          <rect x="8" y="34" width="12" height="10" rx="2" fill="#6b4e2a"/>
          <rect x="22" y="34" width="12" height="10" rx="2" fill="#6b4e2a"/>
          <rect x="36" y="34" width="12" height="10" rx="2" fill="#6b4e2a"/>
          <ellipse cx="28" cy="22" rx="10" ry="8" fill="#7ac74f"/>
          <circle cx="28" cy="14" r="5" fill="#ff9b4a"/>
        </svg>
      </button>
      <button class="scene-tab" type="button" data-scene="warehouse" aria-label="창고" aria-pressed="false">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <rect x="6" y="10" width="44" height="36" rx="4" fill="#c4a574"/>
          <rect x="10" y="16" width="36" height="6" rx="1" fill="#8b6b3d"/>
          <rect x="10" y="28" width="36" height="6" rx="1" fill="#8b6b3d"/>
          <rect x="10" y="40" width="36" height="4" rx="1" fill="#8b6b3d"/>
          <circle cx="18" cy="22" r="4" fill="#ff9b4a"/>
          <circle cx="30" cy="34" r="4" fill="#e85d5d"/>
        </svg>
      </button>
      <button class="scene-tab" type="button" data-scene="kitchen" aria-label="부엌" aria-pressed="false">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <ellipse cx="28" cy="36" rx="18" ry="10" fill="#e8dcc0"/>
          <rect x="18" y="12" width="20" height="22" rx="6" fill="#b0c4d8"/>
          <circle cx="28" cy="22" r="7" fill="#8eb4d8"/>
          <circle cx="40" cy="14" r="6" fill="#ffe0a0"/>
        </svg>
      </button>
    </nav>
  </main>

  <script src="../_shared/kit.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
