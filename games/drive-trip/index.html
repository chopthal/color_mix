<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="부릉부릉 드라이브">
  <title>🚗 부릉부릉 드라이브</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <meta name="theme-color" content="#bfe4fb">
  <link rel="apple-touch-icon" href="../../icons/icon-192.png">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="../../fonts/fonts.css">

  <link rel="stylesheet" href="../_shared/kit.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-map">

  <canvas id="scene" aria-label="운전 화면"></canvas>
  <canvas id="glass" class="glass" aria-hidden="true"></canvas>

  <div class="hud">
    <a class="nav-home" href="../../index.html" aria-label="놀이터로 돌아가기">
      <span aria-hidden="true">🏠</span>
      <span>놀이터</span>
    </a>

    <button class="btn-sound" id="soundBtn" type="button" aria-label="소리 켜기/끄기">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M9 19h7l9-7v24l-9-7H9z" fill="#5b6b8c" stroke="#5b6b8c" stroke-width="3" stroke-linejoin="round"/>
        <g class="snd-waves" fill="none" stroke="#5b6b8c" stroke-width="3.5" stroke-linecap="round">
          <path d="M31 18.5c2.2 3.4 2.2 7.6 0 11"/>
          <path d="M35.5 14.5c4.4 5.8 4.4 13.2 0 19"/>
        </g>
        <g class="snd-off" fill="none" stroke="#ff8270" stroke-width="3.5" stroke-linecap="round">
          <path d="M31 19l9 10M40 19l-9 10"/>
        </g>
      </svg>
    </button>

    <div class="steer-zone" id="steerZone" aria-label="핸들"></div>
    <div class="wheel" id="wheel">
      <div class="wheel-rot" id="wheelRot" aria-hidden="true">
        <svg viewBox="-100 -100 200 200">
          <circle r="84" fill="none" stroke="#d9655a" stroke-width="26"/>
          <circle r="84" fill="none" stroke="#ff8270" stroke-width="20"/>
          <circle r="84" fill="none" stroke="#ffb3a6" stroke-width="5" stroke-linecap="round" stroke-dasharray="70 460" transform="rotate(-160)"/>
          <g fill="#ff9a8a">
            <circle cx="-84" cy="0" r="5"/><circle cx="84" cy="0" r="5"/>
            <circle cx="-59.4" cy="59.4" r="5"/><circle cx="59.4" cy="59.4" r="5"/>
            <circle cx="-59.4" cy="-59.4" r="5"/><circle cx="59.4" cy="-59.4" r="5"/>
          </g>
          <g fill="#fff3e0" stroke="#efcfaa" stroke-width="3">
            <rect x="-80" y="-12" width="160" height="24" rx="12"/>
            <rect x="-12" y="-2" width="24" height="80" rx="12"/>
          </g>
          <circle r="47" fill="#fff8ee" stroke="#efcfaa" stroke-width="4"/>
          <rect x="-8" y="-99" width="16" height="28" rx="8" fill="#ffd166" stroke="#e9b44c" stroke-width="2"/>
        </svg>
      </div>
      <button class="horn" id="horn" type="button" aria-label="경적">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="19" cy="34" r="11" fill="#ff9fb4" stroke="#f07f98" stroke-width="2.5"/>
          <rect x="27" y="30.5" width="9" height="7" rx="2" fill="#ffd166" stroke="#e0a93a" stroke-width="2"/>
          <path d="M35 29.5 L46 22 Q52 34 46 46 L35 38.5 Z" fill="#ffd166" stroke="#e0a93a" stroke-width="2.5" stroke-linejoin="round"/>
          <g class="horn-waves" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
            <path d="M52 27c2.4 4.2 2.4 9.8 0 14"/>
            <path d="M57 23c3.6 6.6 3.6 15.4 0 22"/>
          </g>
        </svg>
      </button>
    </div>

    <div class="pedal-zone" id="pedalZone" aria-label="페달">
      <div class="pedal" id="pedal" aria-hidden="true">
        <span class="pedal-shadow"></span>
        <span class="pedal-glow"></span>
        <svg class="pedal-face" viewBox="0 0 120 170">
          <rect x="6" y="6" width="108" height="158" rx="36" fill="#5f6f96"/>
          <rect x="13" y="10" width="94" height="146" rx="30" fill="#8494bd"/>
          <rect x="22" y="16" width="56" height="10" rx="5" fill="#a9b7da" opacity="0.8"/>
          <g fill="#6a7aa3">
            <rect x="28" y="40" width="64" height="11" rx="5.5"/>
            <rect x="28" y="62" width="64" height="11" rx="5.5"/>
            <rect x="28" y="84" width="64" height="11" rx="5.5"/>
            <rect x="28" y="106" width="64" height="11" rx="5.5"/>
            <rect x="28" y="128" width="64" height="11" rx="5.5"/>
          </g>
        </svg>
        <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
      </div>
      <div class="finger" id="fingerHint" aria-hidden="true">👇</div>
    </div>

    <div class="dash-wrap" id="dashWrap">
      <div class="dash" id="dash">
        <button class="dbtn dbtn-blink" id="btnBlinkL" type="button" aria-label="왼쪽 깜빡이">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path class="arrow" d="M8 24 L24 10 V18 H38 V30 H24 V38 Z" stroke-linejoin="round"/></svg>
        </button>
        <div class="gauge" aria-hidden="true">
          <svg viewBox="0 0 120 74">
            <path d="M6 66 A54 54 0 0 1 114 66 Z" fill="#fff8ef" stroke="#3d2b1f" stroke-width="3.5" stroke-linejoin="round"/>
            <g fill="none" stroke-width="9">
              <path d="M18 64 A42 42 0 0 1 39 27.63" stroke="#8fd6b5"/>
              <path d="M39 27.63 A42 42 0 0 1 81 27.63" stroke="#ffe08a"/>
              <path d="M81 27.63 A42 42 0 0 1 102 64" stroke="#ffb58a"/>
            </g>
            <g id="needle" class="needle">
              <path d="M56.5 64 L60 27 L63.5 64 Z" fill="#ff8270" stroke="#3d2b1f" stroke-width="2" stroke-linejoin="round"/>
            </g>
            <circle cx="60" cy="64" r="7" fill="#5b6b8c" stroke="#3d2b1f" stroke-width="2"/>
          </svg>
        </div>
        <button class="dbtn dbtn-blink" id="btnBlinkR" type="button" aria-label="오른쪽 깜빡이">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path class="arrow" d="M40 24 L24 10 V18 H10 V30 H24 V38 Z" stroke-linejoin="round"/></svg>
        </button>
        <button class="dbtn dbtn-wiper" id="btnWiper" type="button" aria-label="와이퍼">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M6 34 Q24 6 42 34 Z" fill="#cdeefe" stroke="#3d2b1f" stroke-width="3" stroke-linejoin="round"/>
            <path class="blade" d="M24 34 L12 18" stroke="#3d2b1f" stroke-width="4" stroke-linecap="round"/>
            <circle cx="24" cy="34" r="3.5" fill="#3d2b1f"/>
            <circle cx="31" cy="21" r="2.6" fill="#7cc6fe"/>
            <circle cx="35" cy="27" r="2" fill="#7cc6fe"/>
          </svg>
        </button>
        <button class="dbtn dbtn-radio" id="btnRadio" type="button" aria-label="라디오">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M14 15 L30 7" stroke="#3d2b1f" stroke-width="3" stroke-linecap="round"/>
            <rect x="6" y="15" width="36" height="24" rx="7" fill="#ffb3c1" stroke="#3d2b1f" stroke-width="3"/>
            <circle cx="16" cy="27" r="6" fill="#fff6e5" stroke="#3d2b1f" stroke-width="2.5"/>
            <rect x="27" y="21" width="10" height="4" rx="2" fill="#3d2b1f"/>
            <rect x="27" y="29" width="10" height="4" rx="2" fill="#3d2b1f"/>
            <g class="note"><path d="M38 6 V14" stroke="#3d2b1f" stroke-width="2.5" stroke-linecap="round"/><circle cx="35.5" cy="14.5" r="3" fill="#3d2b1f"/></g>
          </svg>
        </button>
        <button class="dbtn dbtn-lights" id="btnLights" type="button" aria-label="라이트">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M22 11 C10 11 8 24 8 24 C8 24 10 37 22 37 Z" fill="#fff6e5" stroke="#3d2b1f" stroke-width="3" stroke-linejoin="round"/>
            <g class="rays" stroke="#3d2b1f" stroke-width="3" stroke-linecap="round">
              <path d="M28 15 H41"/><path d="M28 24 H42"/><path d="M28 33 H41"/>
            </g>
          </svg>
        </button>
      </div>
      <div class="bubble" id="bubble" role="status" aria-live="polite"><span id="bubbleText"></span></div>
      <div class="tori-wrap">
        <div class="tori" id="tori" aria-hidden="true">
          <svg viewBox="0 0 120 132">
            <g stroke="#3D2B1F" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round">
              <path d="M80 112 C122 108 124 50 100 32 C88 22 72 32 80 44 C94 58 92 88 70 100 Z" fill="#B07A4F"/>
              <path d="M98 44 C108 58 106 82 92 96" fill="none" stroke="#D59C6A" stroke-width="5"/>
              <ellipse cx="56" cy="100" rx="27" ry="25" fill="#B07A4F"/>
              <ellipse cx="44" cy="123" rx="11" ry="6.5" fill="#B07A4F"/>
              <ellipse cx="68" cy="123" rx="11" ry="6.5" fill="#B07A4F"/>
            </g>
            <ellipse cx="56" cy="104" rx="16" ry="17" fill="#FFF6E5"/>
            <g stroke="#3D2B1F" stroke-width="3.4">
              <ellipse cx="44" cy="94" rx="6.5" ry="5.5" fill="#C98B58"/>
              <ellipse cx="68" cy="94" rx="6.5" ry="5.5" fill="#C98B58"/>
            </g>
            <g stroke="#3D2B1F" stroke-width="4.6" stroke-linejoin="round">
              <ellipse cx="30" cy="34" rx="8" ry="11" fill="#B07A4F"/>
              <ellipse cx="82" cy="34" rx="8" ry="11" fill="#B07A4F"/>
              <circle cx="56" cy="58" r="31" fill="#B07A4F"/>
            </g>
            <ellipse cx="30" cy="35" rx="3.5" ry="6" fill="#FFB3C1"/>
            <ellipse cx="82" cy="35" rx="3.5" ry="6" fill="#FFB3C1"/>
            <ellipse cx="41" cy="45" rx="9" ry="4.5" fill="#C99266" opacity="0.6"/>
            <g stroke="#3D2B1F" stroke-width="4.6" stroke-linejoin="round">
              <path d="M27 42 Q56 0 85 42 Q56 34 27 42 Z" fill="#8A5A35"/>
              <rect x="52.5" y="4" width="7" height="11" rx="3.5" fill="#6E4429"/>
            </g>
            <g stroke="#6E4429" stroke-width="2" fill="none" stroke-linecap="round">
              <path d="M40 30 L48 22 M50 33 L60 20 M62 33 L70 24 M38 36 L46 28 M66 36 L74 28"/>
            </g>
            <ellipse cx="44" cy="22" rx="7" ry="3" fill="#B98559" opacity="0.7"/>
            <ellipse cx="40" cy="70" rx="13" ry="10" fill="#FFF6E5"/>
            <ellipse cx="72" cy="70" rx="13" ry="10" fill="#FFF6E5"/>
            <circle cx="31" cy="68" r="5.5" fill="#FFB3C1" opacity="0.6"/>
            <circle cx="81" cy="68" r="5.5" fill="#FFB3C1" opacity="0.6"/>
            <g class="eyes-open">
              <ellipse cx="44" cy="56" rx="6.6" ry="7.6" fill="#3D2B1F"/>
              <ellipse cx="68" cy="56" rx="6.6" ry="7.6" fill="#3D2B1F"/>
              <circle cx="46.4" cy="53" r="2.5" fill="#fff"/>
              <circle cx="70.4" cy="53" r="2.5" fill="#fff"/>
            </g>
            <g class="eyes-happy" fill="none" stroke="#3D2B1F" stroke-width="4.2" stroke-linecap="round">
              <path d="M37.5 58 Q44 49 50.5 58"/>
              <path d="M61.5 58 Q68 49 74.5 58"/>
            </g>
            <ellipse cx="56" cy="66" rx="4" ry="3" fill="#3D2B1F"/>
            <path class="mouth-closed" d="M49 71 Q52.5 75 56 71 Q59.5 75 63 71" fill="none" stroke="#3D2B1F" stroke-width="2.8" stroke-linecap="round"/>
            <ellipse class="mouth-open" cx="56" cy="74" rx="4.6" ry="4" fill="#9a4b4b" stroke="#3D2B1F" stroke-width="2.4"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="stars" id="stars" aria-hidden="true"></div>
  </div>

  <section class="map-screen" id="mapScreen" aria-label="여행 도장 지도">
    <svg class="map-bg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="mapLand" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e3f6cf"/>
          <stop offset="1" stop-color="#c9ecad"/>
        </linearGradient>
      </defs>
      <rect width="1000" height="700" fill="url(#mapLand)"/>
      <path d="M620 700 C660 600 760 560 860 540 C930 528 1000 500 1000 470 V700 Z" fill="#8fd0fb" stroke="#3D2B1F" stroke-width="5"/>
      <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8">
        <path d="M760 620 q15 -10 30 0 t30 0"/><path d="M860 590 q15 -10 30 0 t30 0"/><path d="M700 670 q15 -10 30 0 t30 0"/>
      </g>
      <path d="M640 0 C600 120 700 200 640 300 C590 380 700 450 780 560" fill="none" stroke="#3D2B1F" stroke-width="44" stroke-linecap="round"/>
      <path d="M640 0 C600 120 700 200 640 300 C590 380 700 450 780 560" fill="none" stroke="#a9dcfc" stroke-width="34" stroke-linecap="round"/>
      <g stroke="#3D2B1F" stroke-width="5">
        <path d="M0 40 L90 -20 L190 60 L290 -10 L400 70 V0 H0 Z" fill="#b9d6a0"/>
        <g fill="#7BD389"><circle cx="70" cy="130" r="38"/><circle cx="140" cy="100" r="32"/><circle cx="200" cy="150" r="36"/><circle cx="110" cy="190" r="34"/><circle cx="40" cy="220" r="30"/></g>
        <g fill="#fff3b0"><rect x="780" y="80" width="80" height="60" rx="8"/><rect x="870" y="80" width="80" height="60" rx="8"/><rect x="780" y="150" width="80" height="60" rx="8"/></g>
        <g fill="#cdeab0"><rect x="870" y="150" width="80" height="60" rx="8"/></g>
      </g>
      <path d="M500 380 C420 320 320 260 180 200 M500 380 C600 300 700 200 830 140 M500 380 C420 470 300 540 170 560 M500 380 C600 470 700 540 840 600" fill="none" stroke="#3D2B1F" stroke-width="30" stroke-linecap="round"/>
      <path d="M500 380 C420 320 320 260 180 200 M500 380 C600 300 700 200 830 140 M500 380 C420 470 300 540 170 560 M500 380 C600 470 700 540 840 600" fill="none" stroke="#f6e2b3" stroke-width="22" stroke-linecap="round"/>
      <path d="M500 380 C420 320 320 260 180 200 M500 380 C600 300 700 200 830 140 M500 380 C420 470 300 540 170 560 M500 380 C600 470 700 540 840 600" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 16"/>
      <g stroke="#3D2B1F" stroke-width="5" stroke-linejoin="round">
        <rect x="462" y="356" width="76" height="56" rx="8" fill="#fff6e5"/>
        <path d="M452 362 L500 318 L548 362 Z" fill="#FF6B81"/>
        <rect x="486" y="380" width="28" height="32" rx="5" fill="#7CC6FE"/>
      </g>
    </svg>
    <h1 class="map-title">부릉부릉 드라이브</h1>
    <div class="dest-grid" id="destGrid">
      <button class="dest-card dest-zoo" data-dest="zoo" type="button" aria-label="동물원">
        <svg class="dest-art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect width="100" height="100" fill="#c6efb0"/><path d="M0 70 Q25 60 50 70 T100 68 V100 H0 Z" fill="#9bd97c"/><g stroke="#B07A4F" stroke-width="3"><path d="M5 72 V90 M20 72 V90 M35 72 V90 M50 72 V90 M65 72 V90 M80 72 V90 M95 72 V90 M0 78 H100"/></g></svg>
        <span class="dest-emoji" aria-hidden="true">🦒</span>
        <span class="stamp" aria-hidden="true"></span><span class="dots" aria-hidden="true"></span>
      </button>
      <button class="dest-card dest-grandma" data-dest="grandma" type="button" aria-label="할머니 댁">
        <svg class="dest-art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect width="100" height="100" fill="#ffe7c7"/><path d="M0 74 H100 V100 H0 Z" fill="#f6d39a"/><g fill="#ff9f45"><circle cx="16" cy="22" r="5"/><circle cx="28" cy="14" r="4"/><circle cx="84" cy="20" r="5"/><circle cx="74" cy="12" r="4"/></g></svg>
        <span class="dest-emoji" aria-hidden="true">🏡</span>
        <span class="stamp" aria-hidden="true"></span><span class="dots" aria-hidden="true"></span>
      </button>
      <button class="dest-card dest-park" data-dest="park" type="button" aria-label="놀이공원">
        <svg class="dest-art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect width="100" height="100" fill="#ffe0ea"/><g fill="none" stroke-width="5"><path d="M10 80 A40 40 0 0 1 90 80" stroke="#ff8a7a"/><path d="M17 80 A33 33 0 0 1 83 80" stroke="#ffd166"/><path d="M24 80 A26 26 0 0 1 76 80" stroke="#7fd6a6"/><path d="M31 80 A19 19 0 0 1 69 80" stroke="#6cbcf0"/></g><path d="M0 82 H100 V100 H0 Z" fill="#f5c2d6"/></svg>
        <span class="dest-emoji" aria-hidden="true">🎡</span>
        <span class="stamp" aria-hidden="true"></span><span class="dots" aria-hidden="true"></span>
      </button>
      <button class="dest-card dest-sea" data-dest="sea" type="button" aria-label="바닷가">
        <svg class="dest-art" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect width="100" height="100" fill="#cdeefe"/><circle cx="82" cy="18" r="10" fill="#ffd166"/><path d="M0 62 Q12 56 25 62 T50 62 T75 62 T100 62 V100 H0 Z" fill="#7cc6fe"/><path d="M0 84 Q30 76 60 84 T100 82 V100 H0 Z" fill="#f6e2b3"/></svg>
        <span class="dest-emoji" aria-hidden="true">🏖️</span>
        <span class="stamp" aria-hidden="true"></span><span class="dots" aria-hidden="true"></span>
      </button>
    </div>
  </section>

  <div class="key-overlay" id="keyOverlay" hidden>
    <div class="key-card">
      <h1 class="key-title">부릉부릉 드라이브</h1>
      <button class="key-btn" id="keyBtn" type="button" aria-label="시동">
        <span class="key-icon" aria-hidden="true">
          <svg viewBox="0 0 120 60">
            <circle cx="28" cy="30" r="20" fill="#ffd166" stroke="#e0a93a" stroke-width="4"/>
            <circle cx="24" cy="30" r="6.5" fill="#8fd6b5" stroke="#e0a93a" stroke-width="3"/>
            <rect x="46" y="23.5" width="64" height="13" rx="6.5" fill="#ffd166" stroke="#e0a93a" stroke-width="4"/>
            <rect x="82" y="33" width="8" height="13" rx="2" fill="#ffd166" stroke="#e0a93a" stroke-width="3"/>
            <rect x="96" y="33" width="8" height="10" rx="2" fill="#ffd166" stroke="#e0a93a" stroke-width="3"/>
          </svg>
        </span>
        <span class="key-label">시동!</span>
      </button>
    </div>
  </div>

  <script src="../_shared/kit.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
